<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K&amp;D spike — Rive rigs in a Pixi scene</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #0d0b1a; color: #e8e4f2;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      header { padding: 10px 16px 6px; border-bottom: 1px solid #2a2440; }
      h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
      .sub { color: #8d85ad; font-size: 12px; }
      #stage { line-height: 0; }
      #stage canvas { display: block; }
      .panel { padding: 10px 16px; border-top: 1px solid #2a2440; display: grid; gap: 8px; }
      .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
      label { display: flex; gap: 7px; align-items: center; color: #b7afd0; }
      input[type="range"] { width: 190px; }
      select, button {
        font: inherit; background: #1c1832; color: #e8e4f2;
        border: 1px solid #3a3260; border-radius: 5px; padding: 4px 11px;
      }
      button { cursor: pointer; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: #4a3d8f; border-color: #6754c4; }
      #live { color: #9df2c8; min-height: 1.5em; }
      #env { color: #6f688c; font-size: 11px; word-break: break-all; }
      .verdict { font-weight: 700; min-height: 1.5em; }
      .verdict.pass { color: #7ee5a8; }
      .verdict.fail { color: #ff8f8f; }
      #report { white-space: pre; color: #c8c1e0; font-size: 12px; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chapter 0 spike — Rive rigs composited into Pixi</h1>
      <div class="sub">
        art-pipeline.md §7. Seven rigs is 3 players + 4 enemies, the worst the spec allows.
        The verdict is read off frame time, not off displayed fps — a vsync cap looks
        identical to headroom. Open this on the TV-connected machine.
      </div>
    </header>

    <div id="stage"></div>

    <div class="panel">
      <div class="row">
        <label>rigs <input id="count" type="range" min="1" max="12" step="1" value="7" /><b id="countOut">7</b></label>
        <label>offscreen
          <select id="buffer">
            <option value="256">256px</option>
            <option value="384">384px</option>
            <option value="512" selected>512px</option>
            <option value="768">768px</option>
            <option value="1024">1024px</option>
          </select>
        </label>
        <label><input id="dirty" type="checkbox" /> upload dirty rigs only</label>
        <button id="run" class="primary">Run measurement</button>
        <button id="copy" disabled>Copy report</button>
      </div>
      <div id="live">starting…</div>
      <div id="verdict" class="verdict"></div>
      <pre id="report"></pre>
      <div id="env"></div>
    </div>

    <script type="module" src="./rive-pixi.ts"></script>
  </body>
</html>
