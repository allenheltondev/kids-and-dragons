# Keeps the `uses:` pins in .github/workflows/ current mechanically — the
# hand-guessed action versions the 2026-07 pass had to fix are exactly the
# mistake this automates away. deploy.yml already carries the dependabot-actor
# guard, so a bump PR gets CI but never a staging deploy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm: the advisories the 2026-10 pass found (vite, vitest, concurrently,
  # express) had in-range fixes for weeks before anyone ran `npm audit`.
  # Grouped so a week's patch and minor bumps arrive as one PR the full CI
  # checks, instead of a dozen; majors come one at a time, since each is a
  # real migration (typescript, vitest, jsdom).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # vitest and its @vitest/* packages (coverage-v8) are one release train:
      # each package's peer dependency is the matching vitest major. Split into
      # two PRs, the vitest bump leaves coverage-v8 on the old major and the
      # coverage-v8 bump cannot install against the old vitest, so neither is
      # ever mergeable alone. First in this list, so it claims them before the
      # minor-and-patch group does, and it takes majors too.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the Node the code runs on (22: ci.yml node-version and
      # package.json engines), not the newest Node. Types ahead of the runtime
      # let code call APIs that do not exist where it runs, and nothing would
      # fail until it did. Minor and patch bumps still arrive; raise the major
      # together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
