# World Encyclopedia — build and deploy to GitHub Pages.
#
# Runs the Generator (canon → Markdown), Hugo (Markdown → HTML), and Pagefind
# (HTML → search index), then pushes the result to GitHub Pages.
#
# Triggers on pushes to main that touch canon data, the content that canon is
# projected into, wiki content, wiki tooling, or this workflow itself. Also
# runnable manually via workflow_dispatch.
#
# `content/**` is in that list because creature pages show stat blocks, and the
# numbers behind them live in `content/rules.json` `encounterBands`. Retuning a
# band is the one edit the canon/rules split exists to make easy, and it has to
# reach the published wiki.

name: Deploy Wiki

on:
  push:
    branches: [main]
    paths:
      - "canon/**"
      - "content/**"
      - "wiki/**"
      - "tools/wiki/**"
      - "assets/**"
      - ".github/workflows/wiki-deploy.yml"
  workflow_dispatch:

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build encyclopedia
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pillow, for the derived page-sized images below.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: wiki/go.sum

      - name: Install Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.0"
          extended: true

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Creature pages show stat blocks, and they read content/bestiary.json —
      # the join of canon's `encounter` blocks with rules.json's band table.
      # Regenerate it first: building the wiki from fresh canon but a stale
      # projection would publish numbers the game does not use.
      - name: Project canon into the bestiary
        run: npm run canon:bestiary

      # Pages render derived, page-sized images rather than the commissioned
      # sources — a related-entity card is 56x56 and was pulling a 754KB
      # backdrop. Deriving them here rather than trusting the committed copies
      # means new art cannot publish a stale picture; a checkout still has them
      # committed so `wiki:generate` works locally without Pillow.
      - name: Derive page-sized images
        run: npm run art:portraits

      # Item pages show what the item does in your hands, and they read
      # content/items.json — canon's `mechanics` blocks merged with every
      # chapter's props (D7). Same reason as the bestiary: fresh canon against
      # a stale projection publishes an effect the game does not have.
      - name: Project canon into the item catalog
        run: npm run canon:items

      # The Generator reads canon/*.yaml and produces wiki/content/ pages.
      # --force because CI has no manifest from a prior run.
      - name: Generate wiki pages
        run: npx tsx tools/wiki/generate.ts --force

      # Hugo builds the static site. The baseURL comes from the Pages
      # configuration so links work at whatever path GitHub assigns.
      - name: Build Hugo site
        run: hugo --source wiki --minify --baseURL "${{ steps.pages.outputs.base_url }}"

      # Pagefind creates the client-side search index from the built HTML.
      - name: Index with Pagefind
        run: npx pagefind --site wiki/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: wiki/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
