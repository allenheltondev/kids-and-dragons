# Kids & Dragons CI.
#
# One workflow, on purpose. This is a family project, not a platform team — a single
# file you can read top to bottom beats a matrix of reusable workflows nobody edits.
#
# It enforces the two cross-cutting rules from docs/roadmap.md that only CI can:
#   * schema validation — a malformed chapter fails the build, never the play session
#   * the art gate — "the agent says it's finished" is not an acceptance criterion
#     (docs/art-pipeline.md §3)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only. On main, a CI run gates the
  # production deploy (prod-deploy.yml triggers on its completion), so
  # cancelling an in-flight main run would silently drop a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow only reads the repo. Stated explicitly so a future step that
# wants to write (the one-time PR-repair pattern) has to say so out loud.
permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, content, art, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The prod store gets tested against a real DynamoDB, not a mock. The whole
    # justification for the in-memory store is that swapping in DynamoRepository
    # is a wiring change rather than a re-modelling exercise
    # (packages/server/src/store/contract.test.ts), and that claim is worth
    # nothing unless one suite runs against both.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    # dynamodb-local ships no HEALTHCHECK, and GitHub only waits on containers
    # that define one — so without the wait step below, `npm test` can race a
    # port that is not listening yet and fail intermittently.

    steps:
      - uses: actions/checkout@v7

      # Node 22 — the same runtime the Lambdas use (architecture §1).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Python 3.11 for the art tooling and cfn-lint. The set lives in
      # requirements-dev.txt so every workflow and scripts/setup.sh install the
      # same thing, and `cache: pip` stops each run re-downloading the wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Typecheck
        run: npm run typecheck

      # KAD_DDB_ENDPOINT switches the repository contract suite from "memory
      # only" to "memory and DynamoDB". Without it those cases skip, which is
      # what keeps `npm test` a two-second command on a laptop.
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "::error::DynamoDB Local never came up on :8000"
          exit 1

      # Coverage rather than a bare `npm test`: the thresholds in
      # vitest.config.ts are a ratchet, and a ratchet nothing turns is a
      # comment. `--coverage` runs the identical suite, so this is the same
      # gate plus a floor.
      - name: Test
        run: npm run test:coverage
        env:
          KAD_DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1

      # The summary lands in the run's front page rather than 400 lines up the
      # log, because a number nobody sees is a number nobody defends.
      - name: Report coverage
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `${k.padEnd(12)} ${String(s[k].pct).padStart(6)}%  (${s[k].covered}/${s[k].total})`;
              for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The stack is code too. cfn-lint applies the SAM transform, so this
      # catches a bad property on a Serverless resource — the class of mistake
      # you would otherwise find eight minutes into a deploy.
      - name: Lint the stack
        run: npm run infra:lint

      # A Lambda bundle that does not build is a deploy that fails after the
      # checks have already passed. It costs seconds here.
      - name: Bundle Lambdas
        run: npm run infra:build

      # Canon is the source of truth (docs/canon-contract.md), and until now it
      # was the one corpus no build step read: content:validate checks a
      # chapter's biome against assets/manifest.json and has no concept of a
      # creature id, and the wiki's own validator only ran inside the manual
      # wiki:generate. A truth nothing verifies drifts.
      - name: Check canon
        run: npm run canon:check

      # content/bestiary.json is generated from canon, and both the content
      # validator and the wiki read it. A committed copy that no longer matches
      # its source would validate chapters against stale stats and publish them,
      # so regenerate and fail if anything moved.
      - name: Check the bestiary is up to date
        run: |
          npm run canon:bestiary
          git diff --exit-code -- content/bestiary.json || {
            echo "::error::content/bestiary.json is stale — run \`npm run canon:bestiary\` and commit the result."
            exit 1
          }

      # Same contract as the bestiary, one file over: content/items.json is
      # projected from canon/items.yaml plus every chapter's `props` (D7). The
      # generator is also where prop/canon id collisions are caught, so this
      # step fails on a stale catalog *and* on a prop that shadows a world item.
      - name: Check the item catalog is up to date
        run: |
          npm run canon:items
          git diff --exit-code -- content/items.json || {
            echo "::error::content/items.json is stale — run \`npm run canon:items\` and commit the result."
            exit 1
          }

      # Content is data (roadmap, "Content as data"), so it gets checked like code:
      # schemas first, then the cross-file rules a schema cannot express.
      - name: Validate content
        run: npm run content:validate

      - name: Verify art assets
        run: npm run art:verify

      # The rig contract is checked separately from the pixels because it needs
      # no image decoding and no delivered art — it is arithmetic over
      # manifest.rigContract, and it should go red the moment a clip grows past
      # the turn budget rather than when the first .riv shows up.
      - name: Verify rig contract
        run: npm run art:verify:rig

      # Sound is checked the same way art is, with one difference the gate
      # itself explains: a missing file is a *placeholder*, not a failure —
      # every cue has a synthesized recipe behind it — so this goes red only
      # for a file that is present and would reach a table broken.
      - name: Verify audio assets
        run: npm run audio:verify

      - name: Build
        run: npm run build

      # The bytes production ships. On a main push, prod-deploy.yml downloads
      # this artifact from the triggering run instead of rebuilding — so what
      # goes live is the exact output CI just tested, not a second npm ci +
      # esbuild resolution of the same commit. Staging (deploy.yml) cannot do
      # the same: it runs in parallel with CI on the pull request, so there is
      # no completed run to pull from, and it builds its own on purpose.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: kad-build-${{ github.sha }}
          path: |
            infra/.build/
            packages/client/dist/
          # `.build` is a dotted directory, which upload-artifact v4 skips by
          # default — without this the artifact would silently hold only the
          # client, and the ship-mode guard in deploy.sh would refuse it.
          include-hidden-files: true
          if-no-files-found: error
          # Two weeks bounds how old a one-click redeploy of a past artifact
          # can be; older than that means rebuilding from the commit.
          retention-days: 14

      # The contact sheets are the human gate's input (art-pipeline.md §3.2). They do
      # not gate the build — nothing here decides whether the art looks right — but
      # having them on every run means a reviewer never has to build them by hand.
      - name: Contact sheets
        run: npm run art:sheet

      - name: Upload contact sheets
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: art-review-sheets
          path: art/review/
          if-no-files-found: ignore
          retention-days: 14

  rigs:
    # Where a rig stands, checked on every pull request.
    #
    # A rig is a binary somebody else's tool produced, and until this job existed
    # nothing in CI could see inside one. That is not a hypothetical gap: all 24
    # rigs shipped built at 90% scale with their feet 73px low, and separately the
    # four manticore tiers shipped with a corrupt mesh — both passed every check
    # the pipeline had, because `art:verify:rig` reads the file as data and
    # `art:verify:rig:motion` measures each clip against *that rig's own* rest
    # pose. A rig uniformly too small is internally consistent. Only comparing it
    # against the approved art catches it, and that needs a renderer.
    #
    # Separate job rather than a step in `build` so it runs in parallel and adds
    # nothing to the critical path — it is ~40s of gate behind ~90s of setup.
    name: rigs stand where their art stands
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # numpy and Pillow: the comparison itself is a few lines of python inside
      # verify-rig-rest.mjs, the same as the rest of the art tooling.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The version is data, not a literal in this file: `art/rig/rive-mcp.pin.json`
      # is what both this job and rig-motion.yml read, so the renderer moves in one
      # visible commit rather than in two workflows that can disagree.
      # A missing secret and an expired one both surface as "Repository not
      # found" two steps down, which points at the wrong thing. Say it plainly
      # while we still can tell the difference.
      - name: Check the rive-mcp token exists
        env:
          TOKEN: ${{ secrets.RIVE_MCP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret RIVE_MCP_TOKEN is not set. The rig gates render with rive-mcp's CLI, which lives in a private repo; this needs a fine-grained PAT with read access to allenheltondev/rive-mcp. See the rigs job in .github/workflows/ci.yml."
            exit 1
          fi

      - name: Read the pinned rive-mcp
        id: pin
        run: |
          ref=$(jq -r '.ref' art/rig/rive-mcp.pin.json)
          # A short sha or a branch name would still check out, and would make
          # "which renderer measured this" unanswerable six months from now.
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::art/rig/rive-mcp.pin.json ref is not a full 40-char sha: $ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # rive-mcp is a separate *private* repository and is not an npm dependency
      # of this one — its published package ships only the MCP server, not the
      # `rive-mcp-build` CLI this gate drives, so there is nothing to `npm i`.
      #
      # RIVE_MCP_TOKEN is a fine-grained PAT with read access to that repo and
      # nothing else. The default GITHUB_TOKEN cannot stand in: it is scoped to
      # this repository, and against a private one it fails with "Repository not
      # found" — which is how we learned rive-mcp was private in the first place.
      #
      # THE TRAP, named on purpose: PATs expire. When this one does, both rig
      # jobs fail at this step with that same "Repository not found", which reads
      # like the repo moved rather than like a credential lapsed. If you are here
      # because of that message and nothing about rigging changed, mint a new
      # token before looking at anything else.
      - name: Check out the pinned rive-mcp
        uses: actions/checkout@v7
        with:
          repository: allenheltondev/rive-mcp
          ref: ${{ steps.pin.outputs.ref }}
          path: .rive-mcp
          token: ${{ secrets.RIVE_MCP_TOKEN }}

      - name: Build the Rive CLI
        run: npm ci && npm run build
        working-directory: .rive-mcp

      # `render` drives the real Rive runtime through headless Chromium, and it
      # has to be a real browser: the in-process runtime `art:verify:rig` uses
      # reports "No WebGL support. Image mesh will not be drawn.", so a node-only
      # renderer would score the one meshed species against a tail that was never
      # drawn — passing exactly the rig most likely to be broken.
      #
      # The browser is installed by *rive-mcp's own* playwright-core rather than
      # this repo's @playwright/test, and the cache is keyed on rive-mcp's
      # lockfile, because that is what decides which Chromium revision the CLI
      # will ask for. Two Playwright versions want two revisions, and installing
      # one to satisfy the other is how you get a browser on disk that the tool
      # still will not use.
      - name: Cache Playwright browsers for the Rive CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: rive-playwright-${{ runner.os }}-${{ hashFiles('.rive-mcp/package-lock.json') }}

      # Unconditional, not gated on a cache hit. `install` is a no-op when the
      # browser is already there, and gating it meant a cache that restored
      # *something* under ms-playwright skipped the install and left the job with
      # no browser at all — which is exactly what happened the first time this ran.
      - name: Install Chromium for the Rive CLI
        working-directory: .rive-mcp
        run: npx playwright-core install --with-deps chromium

      # Ask Playwright where it put the browser instead of guessing the layout.
      # The guess was wrong: this glob used to look for `chrome-linux/chrome`,
      # and playwright-core 1.61 installs `chrome-linux64/chrome`. rive-mcp's own
      # search has the same stale list, so it cannot find the browser either —
      # RIVE_MCP_CHROME is required here, not a nicety.
      - name: Point the CLI at Chromium
        working-directory: .rive-mcp
        run: |
          exe=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          if [ ! -x "$exe" ]; then
            echo "::error::playwright-core reports its chromium at $exe, and nothing executable is there — the install step above did not complete"
            exit 1
          fi
          echo "RIVE_MCP_CHROME=$exe" >> "$GITHUB_ENV"
          echo "KAD_RIVE_CLI=$GITHUB_WORKSPACE/.rive-mcp/dist/cli.js" >> "$GITHUB_ENV"

      # Frame 0 of `idle` against that tier's approved assembled.png, in the
      # canvas-sized window at the stage offset. 24 rigs, ~40s.
      - name: Verify rigs at rest
        run: npm run art:verify:rig:rest

  e2e:
    # The roadmap's dev loop says a change isn't done until it has been seen on
    # a TV *and* in three-phone Travel Mode. CI can't hold three phones, so it
    # holds three browser contexts against the real dev server: real room
    # codes, real SSE, real server-rolled dice. It is a separate job because it
    # is minutes rather than seconds, and because a red e2e means something
    # quite different from a red unit test.
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ~1-2 minutes of download per run without the cache. Keyed on the lock
      # file because that is what pins @playwright/test, whose version decides
      # which browser build it wants.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # OS-level deps are not cached with the browser; install them either way.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # playwright.config.ts starts `npm run dev` itself and waits for Vite.
      - name: Play a chapter
        run: npm run e2e

      - name: Upload traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
