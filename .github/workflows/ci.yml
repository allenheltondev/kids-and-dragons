name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'claude/combat-foundations-dxz34k'
    name: apply and verify PR review fixes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/combat-foundations-dxz34k
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply the one-time repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-pr-5.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          block = [line[10:] if line.startswith('          ') else line for line in source[start:end + 1]]
          script = '\n'.join(block) + '\n'

          def remove_call(marker: str, next_section: str) -> None:
              global script
              at = script.index(marker)
              after = script.index(next_section, at)
              script = script[:at] + script[after + 1:]

          remove_call(
              "replace_once(\n    engine,\n    '''          ): Presentation | undefined {",
              "\n# ------------------------------------------------------------------\n# Encounter legality",
          )
          remove_call(
              "replace_once(\n    encounter,\n    '''  } else if (ability.target.kind === \"tile\") {",
              "\n# ------------------------------------------------------------------\n# Authored Pounce",
          )
          Path('/tmp/apply-pr-5-fixes.sh').write_text(script)
          PY
          bash /tmp/apply-pr-5-fixes.sh

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one stable match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'packages/shared/src/engine.ts',
              '''function doUseItem(
            draft: RunState,
            playerId: string,
            itemId: string,
            ctx: EngineContext,
          ): Presentation | undefined {
            const member = memberByPlayer(draft, playerId);
            if (!member) throw new Illegal("NOT_FOUND", `player "${playerId}" is not in this run`);

            const def = ctx.items[itemId];
          ''',
              '''function doUseItem(
            draft: RunState,
            playerId: string,
            itemId: string,
            ctx: EngineContext,
          ): Presentation | undefined {
            const member = memberByPlayer(draft, playerId);
            if (!member) throw new Illegal("NOT_FOUND", `player "${playerId}" is not in this run`);
            if (draft.encounter) {
              throw new Illegal("ILLEGAL", "items cannot be used during a fight yet");
            }

            const def = ctx.items[itemId];
          ''',
          )

          replace_once(
              'packages/shared/src/encounter.ts',
              '''  } else if (ability.target.kind === "tile") {
            const tile = request.targetTile;
            if (!tile || !offered.tiles.some((t) => samePosition(t, tile))) {
              return { ok: false, reason: "that is not a legal tile" };
            }
            point = { x: tile.x, y: tile.y };
          }
          ''',
              '''  } else if (ability.target.kind === "tile") {
            const tile = request.targetTile;
            if (!tile || !offered.tiles.some((t) => samePosition(t, tile))) {
              return { ok: false, reason: "that is not a legal tile" };
            }
            point = { x: tile.x, y: tile.y };
            if (ability.target.followUp) {
              const option = offered.tileTargets?.find((entry) => samePosition(entry.tile, tile));
              if (!request.targetId || !option?.targets.includes(request.targetId)) {
                return { ok: false, reason: "that is not a legal target from that tile" };
              }
              targetId = request.targetId;
            }
          }
          ''',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content
        run: npm run content:validate

      - name: Commit verified fixes and remove temporary CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/workflows/fix-pr-5.yml
          git add packages/shared/src/engine.ts packages/shared/src/encounter.ts \
            packages/shared/src/types/protocol.ts packages/shared/src/engine.test.ts \
            packages/shared/src/encounter.test.ts packages/client/src/layout/WorldView.tsx \
            content/abilities.json schemas/abilities.schema.json tools/content/validate.mjs \
            .github/workflows/ci.yml
          git commit -m "fix: preserve combat events and action legality"
          git push origin HEAD:claude/combat-foundations-dxz34k

  build:
    name: typecheck, test, content, art, build
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - run: npm run typecheck
      - run: npm test
        env:
          KAD_DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1
      - run: |
          python -m pip install --disable-pip-version-check cfn-lint
          npm run infra:lint
      - run: npm run infra:build
      - run: npm run content:validate
      - run: npm run art:verify
      - run: npm run art:verify:rig
      - run: npm run build
      - run: npm run art:sheet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-review-sheets
          path: art/review/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
