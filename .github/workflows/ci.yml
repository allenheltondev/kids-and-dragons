# Kids & Dragons CI.
#
# One workflow, on purpose. This is a family project, not a platform team — a single
# file you can read top to bottom beats a matrix of reusable workflows nobody edits.
#
# It enforces the two cross-cutting rules from docs/roadmap.md that only CI can:
#   * schema validation — a malformed chapter fails the build, never the play session
#   * the art gate — "the agent says it's finished" is not an acceptance criterion
#     (docs/art-pipeline.md §3)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'claude/combat-foundations-dxz34k'
    name: apply and verify PR review fixes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/combat-foundations-dxz34k
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply the one-time repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-pr-5.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          block = []
          for line in source[start:end + 1]:
              block.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-pr-5-fixes.sh').write_text('\n'.join(block) + '\n')
          PY
          bash /tmp/apply-pr-5-fixes.sh

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content
        run: npm run content:validate

      - name: Commit verified fixes and remove temporary CI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD^ -- .github/workflows/ci.yml
          git rm .github/workflows/fix-pr-5.yml
          git add packages/shared/src/engine.ts \
                  packages/shared/src/encounter.ts \
                  packages/shared/src/types/protocol.ts \
                  packages/shared/src/engine.test.ts \
                  packages/shared/src/encounter.test.ts \
                  packages/client/src/layout/WorldView.tsx \
                  content/abilities.json \
                  schemas/abilities.schema.json \
                  tools/content/validate.mjs \
                  .github/workflows/ci.yml
          git commit -m "fix: preserve combat events and action legality"
          git push origin HEAD:claude/combat-foundations-dxz34k

  build:
    name: typecheck, test, content, art, build
    runs-on: ubuntu-latest

    # The prod store gets tested against a real DynamoDB, not a mock. The whole
    # justification for the in-memory store is that swapping in DynamoRepository
    # is a wiring change rather than a re-modelling exercise
    # (packages/server/src/store/contract.test.ts), and that claim is worth
    # nothing unless one suite runs against both.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4

      # Node 22 — the same runtime the Lambdas use (architecture §1).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Python 3.11 for the art tooling. Pillow and numpy are the verifier's only
      # dependencies and it prints exactly that if they are missing.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install art dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Typecheck
        run: npm run typecheck

      # KAD_DDB_ENDPOINT switches the repository contract suite from "memory
      # only" to "memory and DynamoDB". Without it those cases skip, which is
      # what keeps `npm test` a two-second command on a laptop.
      - name: Test
        run: npm test
        env:
          KAD_DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1

      # The stack is code too. cfn-lint applies the SAM transform, so this
      # catches a bad property on a Serverless resource — the class of mistake
      # you would otherwise find eight minutes into a deploy.
      - name: Lint the stack
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          npm run infra:lint

      # A Lambda bundle that does not build is a deploy that fails after the
      # checks have already passed. It costs seconds here.
      - name: Bundle Lambdas
        run: npm run infra:build

      # Content is data (roadmap, "Content as data"), so it gets checked like code:
      # schemas first, then the cross-file rules a schema cannot express.
      - name: Validate content
        run: npm run content:validate

      - name: Verify art assets
        run: npm run art:verify

      # The rig contract is checked separately from the pixels because it needs
      # no image decoding and no delivered art — it is arithmetic over
      # manifest.rigContract, and it should go red the moment a clip grows past
      # the turn budget rather than when the first .riv shows up.
      - name: Verify rig contract
        run: npm run art:verify:rig

      - name: Build
        run: npm run build

      # The contact sheets are the human gate's input (art-pipeline.md §3.2). They do
      # not gate the build — nothing here decides whether the art looks right — but
      # having them on every run means a reviewer never has to build them by hand.
      - name: Contact sheets
        run: npm run art:sheet

      - name: Upload contact sheets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-review-sheets
          path: art/review/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    # The roadmap's dev loop says a change isn't done until it has been seen on
    # a TV *and* in three-phone Travel Mode. CI can't hold three phones, so it
    # holds three browser contexts against the real dev server: real room
    # codes, real SSE, real server-rolled dice. It is a separate job because it
    # is minutes rather than seconds, and because a red e2e means something
    # quite different from a red unit test.
    name: end to end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself and waits for Vite.
      - name: Play a chapter
        run: npx playwright test

      - name: Upload traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
