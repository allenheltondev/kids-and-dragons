# Kids & Dragons CI.
#
# One workflow, on purpose. This is a family project, not a platform team — a single
# file you can read top to bottom beats a matrix of reusable workflows nobody edits.
#
# It enforces the two cross-cutting rules from docs/roadmap.md that only CI can:
#   * schema validation — a malformed chapter fails the build, never the play session
#   * the art gate — "the agent says it's finished" is not an acceptance criterion
#     (docs/art-pipeline.md §3)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pull requests share one group per branch, and a new push cancels the run
  # it supersedes. Everything else gets a group per commit, so two merges to
  # main run side by side instead of the second queuing behind the first (it
  # used to wait out the whole of its predecessor). Order is safe without the
  # queue: prod-deploy.yml's guard deploys only a run whose commit is still
  # the tip of main, whichever finishes first. Nothing on main is cancelled,
  # because a CI run there gates the production deploy.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow only reads the repo. Stated explicitly so a future step that
# wants to write (the one-time PR-repair pattern) has to say so out loud.
permissions:
  contents: read

jobs:
  changes:
    # Which of the jobs below can say anything about this change
    # (tools/ci/changes.mjs, where the rules and their reasons live). A few
    # seconds here saves minutes on every pull request: a docs PR used to run
    # the whole pipeline, and every manifest edit ran the full pipeline.
    #
    # The jobs below skip with `if:` rather than the workflow using `on.paths`,
    # because a job skipped by `if:` reports as passed and so satisfies a
    # required check, where a workflow that never starts leaves one waiting
    # forever. Pushes to main and manual runs skip nothing.
    name: which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
      e2e: ${{ steps.classify.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7

      # The PR's own changes: the base tip fetched shallow, and a tree diff
      # from it to the merge commit checkout@v7 gives us.
      - name: Classify the change
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            node tools/ci/changes.mjs "$BASE" HEAD
          else
            node tools/ci/changes.mjs --all
          fi

  # What used to be one job, `build (run)`, in three that run side by side: the
  # cheap gates (typecheck, the stack, canon, content, art, audio: under two
  # minutes), the unit suite (five minutes with coverage, the long pole), and
  # the build with its payload budget and the artifact a deploy ships. Serial,
  # a budget overrun surfaced at minute seven, after the tests; now it surfaces
  # at two, and the suite no longer waits on the art gate or the reverse.
  # build-result below is still the one required check.
  checks:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: checks (typecheck, stack, canon, content, art)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 22 — the same runtime the Lambdas use (architecture §1).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Python 3.11 for the art tooling and cfn-lint. The set lives in
      # requirements-dev.txt so every workflow and scripts/setup.sh install the
      # same thing, and `cache: pip` stops each run re-downloading the wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Typecheck
        run: npm run typecheck

      # KAD_DDB_ENDPOINT switches the repository contract suite from "memory
      # only" to "memory and DynamoDB". Without it those cases skip, which is
      # what keeps `npm test` a two-second command on a laptop.
      - name: Lint the stack
        run: npm run infra:lint

      # A Lambda bundle that does not build is a deploy that fails after the
      # checks have already passed. It costs seconds here.
      - name: Bundle Lambdas
        run: npm run infra:build

      # Canon is the source of truth (docs/canon-contract.md), and until now it
      # was the one corpus no build step read: content:validate checks a
      # chapter's biome against assets/manifest.json and has no concept of a
      # creature id, and the wiki's own validator only ran inside the manual
      # wiki:generate. A truth nothing verifies drifts.
      - name: Check canon
        run: npm run canon:check

      # content/bestiary.json is generated from canon, and both the content
      # validator and the wiki read it. A committed copy that no longer matches
      # its source would validate chapters against stale stats and publish them,
      # so regenerate and fail if anything moved.
      - name: Check the bestiary is up to date
        run: |
          npm run canon:bestiary
          git diff --exit-code -- content/bestiary.json || {
            echo "::error::content/bestiary.json is stale — run \`npm run canon:bestiary\` and commit the result."
            exit 1
          }

      # Same contract as the bestiary, one file over: content/items.json is
      # projected from canon/items.yaml plus every chapter's `props` (D7). The
      # generator is also where prop/canon id collisions are caught, so this
      # step fails on a stale catalog *and* on a prop that shadows a world item.
      - name: Check the item catalog is up to date
        run: |
          npm run canon:items
          git diff --exit-code -- content/items.json || {
            echo "::error::content/items.json is stale — run \`npm run canon:items\` and commit the result."
            exit 1
          }

      # And once more for the world map: content/world.json is the client's
      # copy of canon's map anchors, and a stale one puts the party on the
      # wrong country.
      - name: Check the world map is up to date
        run: |
          npm run art:atlas
          git diff --exit-code -- art/atlas/tiles.json art/atlas/pyramid.json art/atlas/build.json || {
            echo "::error::Atlas assets are stale — run npm run art:atlas and commit the result."
            exit 1
          }
          npm run canon:world
          git diff --exit-code -- content/world.json || {
            echo "::error::content/world.json is stale — run \`npm run canon:world\` and commit the result."
            exit 1
          }

      # content/field-guide.json is what a player reads about the world, cut
      # from canon through an allow-list. A stale copy would show lore that
      # canon has since changed, or miss an entry, so regenerate and compare.
      - name: Check the field guide is up to date
        run: |
          npm run canon:field-guide
          git diff --exit-code -- content/field-guide.json || {
            echo "::error::content/field-guide.json is stale — run \`npm run canon:field-guide\` and commit the result."
            exit 1
          }

      # Content is data (roadmap, "Content as data"), so it gets checked like code:
      # schemas first, then the cross-file rules a schema cannot express.
      - name: Validate content
        run: npm run content:validate

      - name: Verify art assets
        run: npm run art:verify


      - name: Verify audio assets
        run: npm run audio:verify


  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The prod store gets tested against a real DynamoDB, not a mock. The whole
    # justification for the in-memory store is that swapping in DynamoRepository
    # is a wiring change rather than a re-modelling exercise
    # (packages/server/src/store/contract.test.ts), and that claim is worth
    # nothing unless one suite runs against both.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    # dynamodb-local ships no HEALTHCHECK, and GitHub only waits on containers
    # that define one — so without the wait step below, `npm test` can race a
    # port that is not listening yet and fail intermittently.

    steps:
      - uses: actions/checkout@v7

      # Node 22 — the same runtime the Lambdas use (architecture §1).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "::error::DynamoDB Local never came up on :8000"
          exit 1

      # Coverage rather than a bare `npm test` on main: the thresholds in
      # vitest.config.ts are a ratchet, and a ratchet nothing turns is a
      # comment. `--coverage` runs the identical suite, so this is the same
      # gate plus a floor. A pull request runs the suite bare: instrumenting
      # 5,500 tests was two of the five minutes this step took, and the floor
      # is checked on the merge that moves it.
      - name: Test
        run: ${{ github.event_name == 'pull_request' && 'npm test' || 'npm run test:coverage' }}
        env:
          KAD_DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1

      # The summary lands in the run's front page rather than 400 lines up the
      # log, because a number nobody sees is a number nobody defends.
      - name: Report coverage
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `${k.padEnd(12)} ${String(s[k].pct).padStart(6)}%  (${s[k].covered}/${s[k].total})`;
              for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The stack is code too. cfn-lint applies the SAM transform, so this
      # catches a bad property on a Serverless resource — the class of mistake
      # you would otherwise find eight minutes into a deploy.

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # Not the required check; build-result below is, under the name this job
    # used to carry.
    name: build (run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Node 22 — the same runtime the Lambdas use (architecture §1).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Python 3.11 for the art tooling and cfn-lint. The set lives in
      # requirements-dev.txt so every workflow and scripts/setup.sh install the
      # same thing, and `cache: pip` stops each run re-downloading the wheels.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The Lambda bundle rides in the artifact beside the client, so it is
      # built here too (checks lints the stack and builds it as a gate; this
      # is the copy a deploy ships). Seconds.
      - name: Bundle Lambdas
        run: npm run infra:build

      - name: Build
        run: npm run build

      # What a cold start costs, which is the performance number CI can
      # honestly police — frame time is measured on the machine driving the
      # television (`?perf`), and the gate says why at length.
      - name: Check payload budget
        run: npm run perf:bundle

      # The bytes production ships. On a main push, prod-deploy.yml downloads
      # this artifact from the triggering run instead of rebuilding — so what
      # goes live is the exact output CI just tested, not a second npm ci +
      # esbuild resolution of the same commit. Staging (deploy.yml) cannot do
      # the same: it runs in parallel with CI on the pull request, so there is
      # no completed run to pull from, and it builds its own on purpose.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: kad-build-${{ github.sha }}
          path: |
            infra/.build/
            packages/client/dist/
          # `.build` is a dotted directory, which upload-artifact v4 skips by
          # default — without this the artifact would silently hold only the
          # client, and the ship-mode guard in deploy.sh would refuse it.
          include-hidden-files: true
          if-no-files-found: error
          # Two weeks bounds how old a one-click redeploy of a past artifact
          # can be; older than that means rebuilding from the commit.
          retention-days: 14

      # The contact sheets are the human gate's input (art-pipeline.md §3.2). They do
      # not gate the build — nothing here decides whether the art looks right — but
      # having them on every run means a reviewer never has to build them by hand.
      - name: Contact sheets
        run: npm run art:sheet

      - name: Upload contact sheets
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: art-review-sheets
          path: art/review/
          if-no-files-found: ignore
          retention-days: 14


  e2e:
    # The roadmap's dev loop says a change isn't done until it has been seen on
    # a TV *and* in three-phone Travel Mode. CI can't hold three phones, so it
    # holds three browser contexts against the real dev server: real room
    # codes, real SSE, real server-rolled dice. It is a separate job because it
    # is minutes rather than seconds, and because a red e2e means something
    # quite different from a red unit test.
    #
    # Sharded across runners, because on one it had grown to 23 minutes of
    # `e2e` plus 3 of `e2e:prod`, back to back, while every other job was done
    # inside 8. Each shard is its own runner with its own dev server, so the
    # suite's one-worker rule (shared server state) still holds inside a shard.
    # `--fully-parallel` lets a shard boundary fall inside a file: Playwright
    # splits by test count, not time, and by file it always put drop-in and
    # first-playable (~8 minutes together) in one shard. Every test builds its
    # own rooms and browser contexts, so none leans on a sibling having run.
    # Ten shards, from six: the suite is about 48 minutes of tests, so a shard
    # is about five, and no single test is longer than four (layout-fit's two
    # longest walks were split for exactly this). A shard's floor is its
    # slowest test, so a new test past four minutes is worth splitting first.
    # The production suite is not sharded: offline.spec is `serial`.
    name: end to end (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard should not hide what the others would have said.
      fail-fast: false
      matrix:
        include:
          - { name: "1/10", id: "1", run: "npm run e2e -- --fully-parallel --shard=1/10" }
          - { name: "2/10", id: "2", run: "npm run e2e -- --fully-parallel --shard=2/10" }
          - { name: "3/10", id: "3", run: "npm run e2e -- --fully-parallel --shard=3/10" }
          - { name: "4/10", id: "4", run: "npm run e2e -- --fully-parallel --shard=4/10" }
          - { name: "5/10", id: "5", run: "npm run e2e -- --fully-parallel --shard=5/10" }
          - { name: "6/10", id: "6", run: "npm run e2e -- --fully-parallel --shard=6/10" }
          - { name: "7/10", id: "7", run: "npm run e2e -- --fully-parallel --shard=7/10" }
          - { name: "8/10", id: "8", run: "npm run e2e -- --fully-parallel --shard=8/10" }
          - { name: "9/10", id: "9", run: "npm run e2e -- --fully-parallel --shard=9/10" }
          - { name: "10/10", id: "10", run: "npm run e2e -- --fully-parallel --shard=10/10" }
          # The adventure book with no signal, and what a phone downloads on a
          # repeat visit. Against a production build and `vite preview`,
          # because the service worker exists nowhere else
          # (playwright.prod.config.ts builds and serves it).
          - { name: "production build", id: "prod", run: "npm run e2e:prod" }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ~1-2 minutes of download per run without the cache. Keyed on the lock
      # file because that is what pins @playwright/test, whose version decides
      # which browser build it wants.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # OS-level deps are not cached with the browser; install them either way.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Each Playwright config starts its own servers and waits for them.
      - name: Play
        run: ${{ matrix.run }}

      - name: Upload traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.id }}
          path: test-results/
          retention-days: 7

  build-result:
    # The check named "typecheck, test, content, art, build", as before this
    # gate existed, so a required check on that name keeps its meaning. A job
    # whose `needs` failed reports as skipped, and skipped satisfies a
    # required check — so without this, a broken `changes` job would wave
    # every pull request through untested. Passes when build passed or when
    # `changes` deliberately skipped it, never when `changes` itself failed.
    name: typecheck, test, content, art, build
    needs: [changes, checks, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::build: the changes job finished with '$CHANGES', so nothing ran"
            exit 1
          fi
          ok=0
          for pair in "checks:$CHECKS" "unit tests:$TESTS" "build:$BUILD"; do
            name="${pair%%:*}"; result="${pair##*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name: finished with '$result'"
              ok=1
            fi
          done
          exit $ok

  e2e-result:
    # The one check named "end to end", as before the suite was sharded, so a
    # required check on that name keeps meaning the whole suite. Passes when
    # every shard passed, or when `changes` skipped them all (and not when
    # `changes` itself failed, which skips them too).
    name: end to end
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::end to end: the changes job finished with '$CHANGES', so no shard ran"
            exit 1
          fi
          if [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]; then exit 0; fi
          echo "::error::end to end: a shard finished with '$RESULT'"
          exit 1

  # A few tables against the dev server, under two minutes (#319). This catches
  # a regression in the load script itself (tools/load/), or in a route it
  # drives, not a capacity problem: the dev server on a CI runner says nothing
  # about API Gateway's limits. The capacity run is by hand against staging
  # (docs/review/load-README.md).
  #
  # Its own job, so it runs beside the others and costs the main job nothing.
  # It needs no browser and no DynamoDB, only node and the dev server.
  load:
    name: load smoke
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Start the dev server
        run: |
          nohup npx tsx packages/server/src/dev-server.ts > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "::error::the dev server never answered on :8787"
          cat dev-server.log
          exit 1

      # --strict fails the step on any error, a room left open, or a run in
      # which no table reached its fight or no phone sent a heartbeat.
      - name: Smoke run
        run: >-
          npm run load --
          --base-url http://localhost:8787
          --tables 4 --duration 60 --spread 5 --think 400
          --strict --out load-smoke.md

      - name: Report
        if: always()
        run: |
          if [ -f load-smoke.md ]; then cat load-smoke.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Dev server log
        if: failure()
        run: tail -n 200 dev-server.log
