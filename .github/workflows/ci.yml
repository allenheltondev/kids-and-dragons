name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.head_ref == 'claude/combat-foundations-dxz34k'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/combat-foundations-dxz34k
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-pr-5.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'")
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end + 1]) + '\n'
          def remove_between(marker, next_marker):
              global script
              at = script.index(marker)
              after = script.index(next_marker, at)
              script = script[:at] + script[after + 1:]
          remove_between("replace_once(\n    engine,\n    '''          ): Presentation | undefined {", "\n# ------------------------------------------------------------------\n# Encounter legality")
          remove_between("replace_once(\n    encounter,\n    '''  } else if (ability.target.kind === \"tile\") {", "\n# ------------------------------------------------------------------\n# Authored Pounce")
          script = script[:script.index('# Authored Pounce')] + 'PY\n'
          Path('/tmp/apply.sh').write_text(script)
          PY
          bash /tmp/apply.sh

          python3 <<'PY'
          import json
          from pathlib import Path

          def exact(path, old, new):
              p = Path(path); text = p.read_text()
              if text.count(old) != 1: raise SystemExit(f'{path}: stable match count {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          exact('packages/shared/src/engine.ts', '''function doUseItem(
            draft: RunState,
            playerId: string,
            itemId: string,
            ctx: EngineContext,
          ): Presentation | undefined {
            const member = memberByPlayer(draft, playerId);
            if (!member) throw new Illegal("NOT_FOUND", `player "${playerId}" is not in this run`);

            const def = ctx.items[itemId];
          ''', '''function doUseItem(
            draft: RunState,
            playerId: string,
            itemId: string,
            ctx: EngineContext,
          ): Presentation | undefined {
            const member = memberByPlayer(draft, playerId);
            if (!member) throw new Illegal("NOT_FOUND", `player "${playerId}" is not in this run`);
            if (draft.encounter) throw new Illegal("ILLEGAL", "items cannot be used during a fight yet");

            const def = ctx.items[itemId];
          ''')

          encounter_path = Path('packages/shared/src/encounter.ts')
          encounter = encounter_path.read_text()
          start = encounter.index('  } else if (ability.target.kind === "tile") {')
          end = encounter.index('\n  }\n\n  const events: EncounterEvent[]', start) + len('\n  }')
          replacement = '''  } else if (ability.target.kind === "tile") {
            const tile = request.targetTile;
            if (!tile || !offered.tiles.some((t) => samePosition(t, tile))) {
              return { ok: false, reason: "that is not a legal tile" };
            }
            point = { x: tile.x, y: tile.y };
            if (ability.target.followUp) {
              const option = offered.tileTargets?.find((entry) => samePosition(entry.tile, tile));
              if (!request.targetId || !option?.targets.includes(request.targetId)) {
                return { ok: false, reason: "that is not a legal target from that tile" };
              }
              targetId = request.targetId;
            }
          }'''
          encounter_path.write_text(encounter[:start] + replacement + encounter[end:])

          p = Path('content/abilities.json'); doc = json.loads(p.read_text()); ability = doc['abilities']['pounce']
          ability['$comment'] = 'Jump to an open tile, then choose and attack one adjacent enemy.'
          ability['target']['followUp'] = {'kind': 'enemy', 'range': 'adjacent'}
          ability['effects'][1].pop('to', None)
          p.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + '\n')

          p = Path('schemas/abilities.schema.json'); schema = json.loads(p.read_text())
          schema['$defs']['targetRule']['properties']['followUp'] = {
            'type': 'object', 'additionalProperties': False, 'required': ['kind'],
            'properties': {'kind': {'enum': ['ally','enemy']}, 'range': {'anyOf': [
              {'type':'integer','minimum':1,'maximum':10}, {'enum':['adjacent','board']} ]},
              'state': {'enum':['down','standing','any']}}
          }
          p.write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n')

          exact('tools/content/validate.mjs', 'if (scopes.has("target") && (t.kind === "none" || t.kind === "tile")) {', 'if (scopes.has("target") && (t.kind === "none" || (t.kind === "tile" && !t.followUp))) {')
          exact('packages/client/src/layout/WorldView.tsx', '  ENCOUNTER_BEGAN: 1200,\n  ATTACK: 700,', '  ENCOUNTER_BEGAN: 1200,\n  COMBAT_SEQUENCE: 700,\n  ATTACK: 700,')

          p = Path('packages/shared/src/encounter.test.ts'); test = p.read_text()
          a = test.index('  pounce: {'); b = test.index('\n  },\n};', a) + len('\n  },')
          block = test[a:b].replace('target: { kind: "tile", range: 6, openTileOnly: true, affects: "enemy" },', 'target: { kind: "tile", range: 6, openTileOnly: true, affects: "enemy", followUp: { kind: "enemy", range: "adjacent" } },').replace('{ effect: { type: "attack", damage: 3 }, to: "adjacent" },', '{ effect: { type: "attack", damage: 3 } },')
          test = test[:a] + block + test[b:]
          test = test.replace('performAction(state, ctxWith(ALWAYS_HIT), { abilityId: "pounce", targetTile: { x: 4, y: 2 } })', 'performAction(state, ctxWith(ALWAYS_HIT), { abilityId: "pounce", targetTile: { x: 4, y: 2 }, targetId: "wisp#1" })', 1)
          p.write_text(test)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run content:validate
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/fix-pr-5.yml
          git add packages/shared/src/engine.ts packages/shared/src/encounter.ts packages/shared/src/types/protocol.ts packages/shared/src/encounter.test.ts packages/client/src/layout/WorldView.tsx content/abilities.json schemas/abilities.schema.json tools/content/validate.mjs .github/workflows/ci.yml
          git commit -m "fix: preserve combat events and action legality"
          git push origin HEAD:claude/combat-foundations-dxz34k
