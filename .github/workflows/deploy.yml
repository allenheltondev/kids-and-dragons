# Deploys.
#
#   pull request   → the **Staging** environment → the `kad-staging` stack
#   push to main   → the **Production** environment → the `kad-prod` stack
#
# Both run `scripts/deploy.sh`, which is the same command you run from a laptop.
# The workflow's only job is to be that laptop: assume a role, install the two
# CLIs, and hand over. A deploy path that exists only in YAML is one nobody can
# reproduce when it breaks at 8pm.
#
# Two names for one thing, deliberately kept apart:
#
#   `Staging` / `Production`   the GitHub environment — where the role ARN and
#                              any protection rules live
#   `staging` / `prod`         the AWS stage — the stack name, the table name,
#                              `StageName` in the template
#
# They are not the same string and pretending otherwise is how the OIDC `sub`
# claim stops matching the trust policy. The mapping happens once, in the
# "Resolve target" step, and everything downstream uses its output.
#
# Credentials come from GitHub's OIDC provider, traded for a short-lived role
# session — there are no AWS keys stored anywhere. The role ARN lives on the
# GitHub environment rather than on the repository, and each role trusts only
# its own environment (`infra/github-oidc.yaml`), so a pull-request deploy
# cannot reach production even if this file were edited in that pull request.
# That last part is the reason the scoping is worth doing: without it, "deploy
# staging on PR" is an arbitrary code execution path into the production
# account.

name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  # For redeploying without a commit — recovering a stack, or applying a
  # parameter change like WebAuthnRelyingPartyId.
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [Staging, Production]
        default: Staging

concurrency:
  # Two deploys of one stack at once is a CloudFormation error at best. Queued
  # rather than cancelled: a half-finished deploy should be allowed to finish.
  group: deploy-${{ github.event_name == 'push' && 'Production' || inputs.environment || 'Staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the OIDC token itself

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || inputs.environment || 'Staging' }}
    runs-on: ubuntu-latest
    # Must match the environment name in Settings → Environments *exactly*, or
    # GitHub quietly creates a new one — which has no secret in it, and the job
    # fails at the credentials step looking like an AWS problem.
    environment: ${{ github.event_name == 'push' && 'Production' || inputs.environment || 'Staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        env:
          ENVIRONMENT: ${{ github.event_name == 'push' && 'Production' || inputs.environment || 'Staging' }}
        run: |
          case "$ENVIRONMENT" in
            Production) STAGE=prod ;;
            Staging)    STAGE=staging ;;
            *) echo "::error::unknown environment '$ENVIRONMENT'"; exit 1 ;;
          esac
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "stack=kad-$STAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying the $ENVIRONMENT environment to the kad-$STAGE stack."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The art gate is Python. `deploy.sh` runs it, and this workflow does not
      # skip the checks — see the note on the deploy step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: kad-deploy-${{ github.run_id }}

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Deploy
        run: ./scripts/deploy.sh ${{ steps.target.outputs.stage }}
        env:
          # `KAD_SKIP_CHECKS` is deliberately *not* set.
          #
          # `ci.yml` runs the same suite on the same commit, so this looks like
          # pure duplication — but the two workflows run in parallel and neither
          # can gate the other. Skipping here would mean a push to main deploys
          # to prod while its tests are still running, and a red test would
          # arrive after the family is already playing the build it failed on.
          #
          # A couple of minutes per deploy buys "nothing reaches a stack that
          # did not pass on that exact commit", which is the whole reason the
          # checks are the first thing `deploy.sh` does.
          #
          # Passkeys are bound to a domain for the life of the credential, and
          # `sam deploy` reverts any parameter it is not given. Set this as an
          # environment *variable* once the distribution exists, or every deploy
          # silently turns passkeys off. Empty is fine and simply means
          # email-code sign-in only.
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}

      - name: Where it went
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.target.outputs.stack }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          {
            echo "### ${{ steps.target.outputs.stack }} is live"
            echo ""
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
