name: Deploy (staging)

# Staging, from every pull request. Mirrors the shape used in
# allenheltondev/content-tracking: one workflow per environment, the role ARN
# on a GitHub environment, OIDC for credentials.
#
# The environment is `Staging` and the AWS stage is `staging` — the same word in
# two different registries. GitHub matches the environment name exactly (a
# mismatch quietly creates a new, empty one), and the OIDC `sub` claim carries
# it verbatim into the role's trust policy.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A single global group, not one per branch: every pull request deploys to the
  # *same* staging stack, so concurrent runs have to queue rather than race two
  # CloudFormation updates against one another.
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  # For the sticky "staging is serving <sha>" comment below — the one write
  # this workflow makes to GitHub.
  pull-requests: write

env:
  AWS_REGION: us-east-1
  # deploy.sh derives the stack and stage from its argument; this copy exists
  # only for the diagnostic and summary steps below.
  STACK_NAME: kad-staging

jobs:
  deploy:
    name: sam deploy staging
    # Dependabot pull requests run with a separate secret store that cannot
    # see the deploy role ARN, so OIDC fails before anything useful happens.
    # CI still gates the merge, and the post-merge production deploy exercises
    # the bump for real.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: Staging
      # Surfaces on the pull request as "Deployed to Staging" with a link, so a
      # reviewer can open the thing rather than reconstruct its URL.
      url: ${{ steps.outputs.outputs.site-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The art gate is Python, and `deploy.sh` runs it — see the note on the
      # deploy step for why the checks are not skipped here.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Show the OIDC subject this job presents
        # Prints the `sub` and `aud` claims — the two things AWS matches a trust
        # policy against — and nothing else. Neither is a secret, and the token
        # itself is never echoed.
        #
        # Worth keeping. `AssumeRoleWithWebIdentity` returns the same "Not
        # authorized" whether the trust policy names a different repository, a
        # different environment, different casing, or the ARN simply has a typo
        # in it — AWS will not say which. Printing the exact string the role has
        # to accept, right above the failure, turns that guess into a diff.
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq -r '"The role trust policy must accept:\n  sub: \(.sub)\n  aud: \(.aud)"'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: GitHubActions-KidsAndDragons-StagingDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Deploy
        # `scripts/deploy.sh` is the same command that runs from a laptop: it
        # runs the checks, bundles the Lambdas, deploys the stack, uploads the
        # client and the art, and invalidates CloudFront — in that order, so a
        # deploy that fails partway leaves the previous version serving.
        #
        # `KAD_SKIP_CHECKS` is deliberately unset. `ci.yml` runs the same suite
        # on the same commit, but in a parallel workflow that cannot gate this
        # one — so skipping would let a red commit reach a stack.
        #
        # `KAD_PREBUILT` is deliberately unset too, for the same structural
        # reason: prod ships the artifact CI uploaded, but this workflow runs
        # *in parallel with* CI on the pull request, so there is no completed
        # run to download from — staging builds its own bytes. The asymmetry is
        # the trade for staging feedback that starts at PR-open rather than
        # after a full CI pass (docs/deploy.md has the longer version).
        run: ./scripts/deploy.sh staging
        env:
          # Passkeys bind to a domain for the life of the credential, and
          # `sam deploy` reverts any parameter it is not given. Empty is a
          # complete state: email-code sign-in only.
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          # The live narration layer (roadmap chapter 7, architecture §6.6) —
          # on, deliberately. The switch stays a real switch: remove this line
          # (or set anything but "true") and the next deploy turns the layer
          # off with no other change, because deploy.sh passes the
          # LiveLlmEnabled parameter on every deploy and reads an absent
          # variable as "false". Needs anthropic.claude-haiku-4-5 enabled
          # under Bedrock > Model access in this account and region.
          LIVE_LLM_ENABLED: "true"

      - name: Diagnose failed deploy
        if: ${{ failure() }}
        run: |
          echo "Deploy failed. CloudFormation diagnostics for ${STACK_NAME}."

          echo "==== describe-stack-events (latest 40) ===="
          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackEvents[:40].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table || true

          echo "==== list-stack-resources ===="
          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "StackResourceSummaries[*].[LogicalResourceId,ResourceType,ResourceStatus]" \
            --output table || true

      - name: Read stack outputs
        id: outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" --output json)
          read_out() { echo "$OUTPUTS" | jq -r --arg k "$1" '.[] | select(.OutputKey==$k) | .OutputValue'; }
          SITE_URL=$(read_out SiteUrl)
          {
            echo "site-url=${SITE_URL}"
            echo "api-endpoint=$(read_out ApiEndpoint)"
            echo "table-name=$(read_out TableName)"
          } >> "$GITHUB_OUTPUT"

          # In the log as well as the summary. The summary is a separate tab and
          # the environment URL is a small link in the sidebar; neither is visible
          # while you are watching the run, which is exactly when you want the
          # address to open on the TV.
          if [ -z "$SITE_URL" ] || [ "$SITE_URL" = "null" ]; then
            echo "::error::the stack has no SiteUrl output — the deploy may have succeeded but there is no address to open"
            exit 1
          fi
          # A stack output proves CloudFormation is happy, not that the site
          # serves. One request through CloudFront catches the bundle that
          # throws on load path zero — before a reviewer opens the link.
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null "$SITE_URL"

          echo "::notice title=Staging is live::${SITE_URL}"
          echo
          echo "  ┌──────────────────────────────────────────────────────────"
          echo "  │  Kids & Dragons — staging"
          echo "  │  ${SITE_URL}"
          echo "  └──────────────────────────────────────────────────────────"
          echo

      # Staging is one shared stack that every pull request updates in place,
      # so with two PRs open a reviewer cannot tell whose bytes are live. This
      # answers on the PR that asks: one comment, found again by its marker and
      # edited rather than re-posted, so a busy PR does not accrete a timeline
      # of them. Skipped on workflow_dispatch — there is no PR to comment on.
      - name: Post the serving SHA on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ steps.outputs.outputs.site-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- kad-staging-status -->";
            const { SITE_URL, HEAD_SHA } = process.env;
            const body = [
              marker,
              `🎭 Staging is serving \`${HEAD_SHA}\` — ${SITE_URL}`,
              "",
              "_One shared staging stack: a later run from any pull request replaces these bytes, and this comment updates in place when it was this PR's._",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Write deployment summary
        run: |
          {
            echo "## Kids & Dragons staging deploy"
            echo
            echo "- **Stack:** \`${STACK_NAME}\`"
            echo "- **Region:** \`${AWS_REGION}\`"
            echo "- **Open it:** ${{ steps.outputs.outputs.site-url }}"
            echo "- **Table:** \`${{ steps.outputs.outputs.table-name }}\`"
            # On pull_request, github.sha is the ephemeral merge commit — a SHA
            # nobody can check out. Report the head of the PR branch instead.
            echo "- **Commit:** \`${{ github.event.pull_request.head.sha || github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
