# The rig motion gate — every clip of every rig, rendered and measured.
#
# Its own workflow rather than a job in ci.yml, for one specific reason:
# prod-deploy.yml triggers on the CI *workflow* completing, so a twenty-minute
# job inside CI would put twenty minutes between a merge to main and the deploy
# of a change that has nothing to do with rigging. Splitting it keeps the deploy
# path fast and lets this one take as long as it needs.
#
# It is the third of the three rig gates, and the split between them is worth
# holding in your head (art-pipeline.md section 3.1):
#
#   art:verify:rig       the .riv as data — clip table, lengths, inputs. In CI's
#                        `build` job, needs nothing but node_modules.
#   art:verify:rig:rest  frame 0 against the approved art — absolute scale and
#                        position, which neither of the others can see. In CI's
#                        `rigs` job, ~40s.
#   art:verify:rig:motion  <- here. Every clip rendered tick by tick: does the
#                        figure sink through the floor, leave the artboard, come
#                        apart at a joint, paint colours that are in no part PNG,
#                        and do the state machine's events actually fire.
#
# On pull requests it runs only when something that could change a rendered frame
# changed — the rigs themselves, the contract they derive from, or the gate. Rigs
# are regenerated rarely and in bulk, so this is nearly always "not this PR", and
# when it is this PR it is exactly the PR you want it on.

name: Rig motion

on:
  push:
    branches: [main]
    paths:
      - "assets/characters/**/rig.riv"
      - "assets/manifest.json"
      - "art/rig/**"
      - "tools/art/verify-rig-motion.mjs"
      - "tools/art/rig_motion.py"
      - ".github/workflows/rig-motion.yml"
  pull_request:
    paths:
      - "assets/characters/**/rig.riv"
      - "assets/manifest.json"
      - "art/rig/**"
      - "tools/art/verify-rig-motion.mjs"
      - "tools/art/rig_motion.py"
      - ".github/workflows/rig-motion.yml"
  workflow_dispatch:

concurrency:
  group: rig-motion-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  motion:
    name: every clip of every rig
    runs-on: ubuntu-latest
    # 24 rigs x 13 clips, ~40s per rig at the default concurrency on a local
    # 4-core box. The ceiling is generous on purpose: a timeout that trips on a
    # slow runner reads as a rig failure, which is the wrong thing to have to
    # rule out first.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Same pin as the `rigs` job in ci.yml, read from the same file. See
      # art/rig/rive-mcp.pin.json for why the renderer is pinned at all.
      # Same reasoning as ci.yml's `rigs` job: a missing or expired secret would
      # otherwise present as "Repository not found".
      - name: Check the rive-mcp token exists
        env:
          TOKEN: ${{ secrets.RIVE_MCP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret RIVE_MCP_TOKEN is not set — see the rigs job in .github/workflows/ci.yml."
            exit 1
          fi

      - name: Read the pinned rive-mcp
        id: pin
        run: |
          ref=$(jq -r '.ref' art/rig/rive-mcp.pin.json)
          if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::art/rig/rive-mcp.pin.json ref is not a full 40-char sha: $ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Same private repo and the same fine-grained PAT as ci.yml's `rigs` job —
      # including the same expiry trap, which is documented there.
      - name: Check out the pinned rive-mcp
        uses: actions/checkout@v7
        with:
          repository: allenheltondev/rive-mcp
          ref: ${{ steps.pin.outputs.ref }}
          path: .rive-mcp
          token: ${{ secrets.RIVE_MCP_TOKEN }}

      - name: Build the Rive CLI
        run: npm ci && npm run build
        working-directory: .rive-mcp

      # Same three steps as ci.yml's `rigs` job, and the reasoning is documented
      # there: install with rive-mcp's own playwright-core so the revision matches
      # what the CLI will ask for, never gate the install on a cache hit, and ask
      # Playwright for the path rather than guessing the directory layout.
      - name: Cache Playwright browsers for the Rive CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: rive-playwright-${{ runner.os }}-${{ hashFiles('.rive-mcp/package-lock.json') }}

      - name: Install Chromium for the Rive CLI
        working-directory: .rive-mcp
        run: npx playwright-core install --with-deps chromium

      - name: Point the CLI at Chromium
        working-directory: .rive-mcp
        run: |
          exe=$(node -e "console.log(require('playwright-core').chromium.executablePath())")
          if [ ! -x "$exe" ]; then
            echo "::error::playwright-core reports its chromium at $exe, and nothing executable is there — the install step above did not complete"
            exit 1
          fi
          echo "RIVE_MCP_CHROME=$exe" >> "$GITHUB_ENV"
          echo "KAD_RIVE_CLI=$GITHUB_WORKSPACE/.rive-mcp/dist/cli.js" >> "$GITHUB_ENV"

      # `--jobs` is left to the tool, which sizes itself to the runner's cores.
      - name: Verify rig motion
        run: npm run art:verify:rig:motion
