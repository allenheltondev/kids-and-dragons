schema_version: "2.0"
document_type: red_sky_geography_canon
title: "The Realm of Red Sky Geography Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for every mapped region, named site,
  geographic feature, and travel route in the Realm of Red Sky. Use this file
  when planning chapters, map interactions, encounter placement, travel
  sequences, spatial relationships, or any content involving where things are.

agent_instructions:
  - A named place appears once in this canon and is referenced elsewhere by id.
  - Places live in biomes.yaml (ecological regions) and locations.yaml (places inside them). This file owns only what is neither: water features and travel routes.
  - A border means overland adjacency, not automatically a safe or maintained route.
  - A route records a meaningful or constrained way to travel between places.
  - Tactical encounter grids remain separate and may be reused by multiple canonical sites.
  - Underground and aerial layers may overlap surface coordinates without being surface neighbors.
  - Approximate anchors may move when the final map art is traced; ids and relationships should remain stable.
  - Coordinates are normalized map-label anchors, not terrain polygons or tactical tiles.
  - Origin is the top-left of the map. X increases east; Y increases south.

controlled_values:
  kind:
    biome_region: "A broad ecological and travel region."
    ocean: "Open water surrounding the landmass."
    aerial_archipelago: "A group of floating or airborne land masses."
    offshore_island_region: "An island or marine area not reachable by overland travel."
    volcanic_landmark_region: "A singular volcanic landmark with its own visual family."
    settlement_region: "A named settlement embedded in a larger region."
    coastal_trade_city: "A trade settlement on the coast."
    river_crossing_settlement: "A settlement at a constrained river crossing."
    offshore_dungeon_landmark: "An offshore or underground landmark site."
    river_source: "The headwaters or origin point of a river."
    major_river: "A continent-scale river and strategic barrier."
    river_branch: "A secondary channel branching from a major river."
    ocean_hazard: "A dangerous oceanic phenomenon."
    bridge: "A constructed river crossing."
    bridge_and_narrow_pass: "A crossing that combines a bridge with terrain constraint."
    overland_road: "A maintained road between locations."
    overland_route: "An unmaintained or informal overland path."
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  map_provenance:
    map_canonical: "Directly placed and labeled on the current map."
    map_canonical_and_biome_matched: "Map-placed and matched to a biome canon entry."
    map_visible_name_pending: "Visible on the map but lacking a canonical proper name."
    map_implied: "Not drawn but implied by adjacency or map logic."
    visible_unlabeled_feature: "Visible on the map but not labeled."
  travel_modes:
    foot: "On foot."
    caravan: "By wagon or trade caravan."
    sea: "By sea vessel."
    aerial: "By flight or aerial transport."
    subterranean: "Through underground passages."
  access_mode:
    aerial: "Reachable only by flight."
    sea: "Reachable only by sea."
    sea_or_subterranean: "Reachable by sea or underground passage."

geography_ids:
  - great_river_source
  - great_river
  - great_river_west_branch
  - eastern_maelstrom
  - northern_river_bridge
  - stone_crossing
  - exchange_to_sunward_fields
  - exchange_to_whispering_marsh

world_metadata:
  id: world.realm_of_red_sky
  title: The Realm of Red Sky
  source_map: "Realm of Red Sky"
  orientation:
    north: up
    east: right
  coordinate_system:
    type: normalized
    origin: top_left
    width: 1000
    height: 1000
    precision: approximate_label_anchor
    note: >-
      Anchors place labels and location markers consistently. They are not biome
      boundaries, collision geometry, or a promise that every point inside an
      illustrated region is traversable.

features:
  - id: feature.great_river_source
    title: Source of the Great River
    kind: river_source
    canon_status: confirmed
    map_provenance: map_canonical
    map_anchor: { x: 720, y: 105 }
    contained_by: biome.glacier_of_origins

  - id: feature.great_river
    title: The Great River
    kind: major_river
    canon_status: confirmed
    map_provenance: map_canonical
    source: feature.great_river_source
    flow_direction: north_to_south
    reaches:
      - biome.glacier_of_origins
      - biome.frostfang_peaks
      - biome.red_sky_foothills
      - biome.eastern_plains
      - biome.plains
      - biome.sunward_fields
    mouth:
      map_anchor: { x: 625, y: 900 }
      between:
        - biome.sunward_fields
        - biome.sallow_wastelands
      near:
        - biome.mermaid_cove
        - location.bone_yard
    crossings:
      - route.northern_river_bridge
      - route.stone_crossing
    notes:
      - The main channel is a strategic barrier between the western-central mainland and the Eastern Plains.
      - Direct crossings should not be invented outside the named routes without updating this canon.
      - In its slow lower reaches through the Sallow Wastelands the river is
        commonly called the Glacierflow, after its source; where the current
        finally fails it lays down the Bone Yard at the mouth.

  - id: feature.great_river_west_branch
    title: Western Branch of the Great River
    kind: river_branch
    canon_status: confirmed
    map_provenance: map_canonical
    parent: feature.great_river
    map_anchor: { x: 390, y: 590 }
    reaches:
      - biome.plains
      - biome.whispering_marsh
    outlet: western_sea
    notes:
      - The map shows a substantial westward branch separating the Plains from the southern lands.
      - Exact tributaries and marsh channels remain intentionally abstract.

  - id: feature.eastern_maelstrom
    title: Eastern Maelstrom
    kind: ocean_hazard
    canon_status: confirmed
    map_provenance: visible_unlabeled_feature
    map_anchor: { x: 950, y: 625 }
    notes:
      - Visible east of the Eastern Plains and north of the Bone Yard.
      - Name is descriptive and should be reviewed before story use.

routes:
  - id: route.northern_river_bridge
    title: Northern River Bridge
    kind: bridge
    canon_status: confirmed
    map_provenance: map_visible_name_pending
    map_anchor: { x: 655, y: 390 }
    crosses: feature.great_river
    connects:
      - biome.red_sky_foothills
      - biome.eastern_plains
    travel_modes: [foot, caravan]
    notes:
      - This is the northern mapped bridge between the Foothills and Eastern Plains.
      - It needs a canonical proper name before a campaign treats it as a named location.

  - id: route.stone_crossing
    title: Stone Crossing Route
    kind: bridge_and_narrow_pass
    canon_status: confirmed
    map_provenance: map_canonical
    map_anchor: { x: 630, y: 680 }
    crosses: feature.great_river
    via: location.stone_crossing
    connects:
      - biome.sunward_fields
      - biome.eastern_plains
    travel_modes: [foot, caravan]
    constraints:
      - The river narrows to a single path.
      - Traffic and danger at the crossing can block east-west travel.

  - id: route.exchange_to_sunward_fields
    title: Exchange–Sunward Road
    kind: overland_road
    canon_status: confirmed
    map_provenance: map_implied
    connects:
      - location.exchange
      - biome.sunward_fields
    travel_modes: [foot, caravan]

  - id: route.exchange_to_whispering_marsh
    title: Exchange–Marsh Approach
    kind: overland_route
    canon_status: confirmed
    map_provenance: map_implied
    connects:
      - location.exchange
      - biome.whispering_marsh
    travel_modes: [foot]
    notes:
      - A route exists by adjacency, but its safety, surface, and exact path are not yet canonized.

canon_reconciliation:
  source_biomes_file:
    exact_map_matches:
      - biome.whispering_marsh
    entries_not_placed_on_surface_map:
      - id: biome.crimson_highlands
        reason: >-
          No exact map label matches. It may be an earlier concept related to the
          Expanse, Mount Red Sky, or Red Sky Foothills, but that should not be assumed.
      - id: biome.crystal_caverns
        reason: >-
          This is an underground biome and therefore may belong to a separate
          subterranean layer rather than the illustrated surface geography.
    map_concepts_missing_from_biomes_file:
      - biome.expanse
      - biome.sky_islands
      - biome.enchanted_woods
      - biome.red_sky_foothills
      - biome.plains
      - biome.sunward_fields
      - biome.eastern_plains
      - biome.glacier_of_origins
      - biome.frostfang_peaks
      - biome.sallow_wastelands
      - biome.mermaid_cove
    site_art_families_not_true_biome_regions:
      - location.mount_red_sky
      - location.mosshome
      - location.exchange
      - location.stone_crossing
      - location.skullwater_cave
    note: >-
      The uploaded biomes file appears to be an earlier or partial canon. This
      geography draft preserves its one exact match and leaves ambiguous concepts
      unresolved rather than silently renaming them.

internal_location_graphs:
  status: not_yet_authored
  model:
    node_fields:
      - id
      - title
      - region
      - kind
      - map_anchor
      - connections
      - visual_identity
      - residents
      - encounter_map_options
      - story_significance
    edge_fields:
      - from
      - to
      - direction
      - route_kind
      - travel_constraints
      - visibility
  recommended_first_region: biome.enchanted_woods
  reason: >-
    The first playable chapter already implies a hedge wall, clearing, path fork,
    mossy stairs, singing stream, wisp thicket, shrine hollow, and hill door. Turning
    those into canonical location nodes would validate this model before expanding
    every region.
