schema_version: "2.0"
document_type: red_sky_item_canon
title: "The Realm of Red Sky Item Canon"
updated: "2026-07-31"

purpose: >-
  Canonical, agent-readable reference for named items, artifacts, and materials
  in the Realm of Red Sky. Use this file when planning loot, crafting systems,
  quest objectives, item artwork, or any game content involving collectible or
  usable objects.

agent_instructions:
  - Items are game objects that exist within the world's internal logic and must maintain consistency with biome, creature, and location canon.
  - Do not invent items that contradict established environmental or creature behavior.
  - Items referencing creatures must use valid creature IDs from the creature canon.
  - Items referencing locations must use valid biome or location IDs.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.
  - An item carries `mechanics` only if a child can pick it up and use it. Lore that exists in the world without existing in a bag has none, and that absence is a claim, not an omission.
  - A prop that exists only because one chapter happened is not canon. Author it in that chapter's `props`, not here. The test is ownership - the world owns a honeycake, a chapter owns the key to its own door.
  - "`mechanics.text` is written for a seven-year-old and says what tapping the item does. `short_description` says what the thing is. They are not interchangeable."

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  category:
    crafting_material: "A raw or processed material used in creation."
    quest_artifact: "A unique object tied to a specific quest or storyline."
    adventuring_gear: "A practical tool or piece of equipment for exploration."
    provision: "Food or drink carried for the road, used once and gone."
    charm: "A small worn token that carries a steady blessing while it is on you."
  rarity:
    common: "Widely available with modest effort."
    uncommon: "Requires specific knowledge or location."
    rare: "Difficult to obtain; limited sources."
    legendary: "Unique or nearly unique; tied to major lore."

