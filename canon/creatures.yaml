creatures:
  # ===== AMBIENT CREATURES =====

  - id: creature.embermoth
    asset_id: embermoth
    title: "Embermoth"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, foothills, volcanic, indicator]
    danger_level: low
    scale: tiny_to_small
    short_description: >-
      Warm-bodied moth with smoky wings and ember-like markings.
    visual_identity: >-
      Broad dark wings edged with orange-red light, soft glow rather than open
      flame, small groups resemble drifting sparks.
    common_story_uses: >-
      Environmental clue, atmospheric artwork, warning that the mountain is changing.
    canon_constraints: >-
      Harmless unless a large frightened swarm obscures vision.
    standard_behavior: >-
      Gathers near warm cracks before noticeable volcanic changes, avoids loud movement.
    relationships:
      primary_locations: [biome.red_sky_foothills, location.mount_red_sky]
      creatures: []
      items: []

  - id: creature.mosshorn
    asset_id: mosshorn
    title: "Mosshorn"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, forest, gentle, indicator]
    danger_level: none
    scale: medium
    short_description: >-
      Gentle deer-like forest animal whose antlers support living moss, ferns, and flowers.
    visual_identity: >-
      Deer-like body with antlers shaped like small living branches, moss and
      seasonal plants grow naturally across the antlers and shoulders.
    common_story_uses: >-
      Guide toward a safe path, sign of ecological trouble, peaceful background creature.
    canon_constraints: >-
      Avoids conflict, leaves areas where forest magic has become damaged.
    standard_behavior: >-
      Follows healthy paths, sometimes approaches calm caretakers.
    relationships:
      primary_locations: [biome.enchanted_woods, location.mosshome]
      creatures: []
      items: []

  - id: creature.jackalope
    asset_id: jackalope
    title: "Jackalope"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, plains, common, fast]
    danger_level: none
    scale: small
    short_description: >-
      Fast rabbit-like plains animal with small branching antlers.
    visual_identity: >-
      Rabbit body, long ears, and delicate antlers. Coat colors reflect grasses,
      soil, and local crops.
    common_story_uses: >-
      Background life, harmless chase, clue that a nearby predator has disturbed a warren.
    canon_constraints: >-
      Flees from danger, investigates unattended food.
    standard_behavior: >-
      Gathers near well-maintained roads where predators are easier to spot.
    relationships:
