creatures:
  # ===== AMBIENT CREATURES =====

  - id: creature.embermoth
    asset_id: embermoth
    title: "Embermoth"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, foothills, volcanic, indicator]
    danger_level: low
    scale: tiny_to_small
    short_description: >-
      Warm-bodied moth with smoky wings and ember-like markings.
    visual_identity: >-
      Broad dark wings edged with orange-red light, soft glow rather than open
      flame, small groups resemble drifting sparks.
    common_story_uses: >-
      Environmental clue, atmospheric artwork, warning that the mountain is changing.
    canon_constraints: >-
      Harmless unless a large frightened swarm obscures vision.
    standard_behavior: >-
      Gathers near warm cracks before noticeable volcanic changes, avoids loud movement.
    lore:
      hook: "The mountain's mood, printed on ten thousand small grey wings."
      story: >-
        Embermoths hatch in the warm cracks of the foothills and spend their
        whole lives migrating from one warmth to the next. Nobody taught them
        to predict eruptions; the moths simply have strong opinions about where
        it is comfortable, and the mountain publishes its plans as heat before
        it publishes them as smoke. Dragonlings learned to read them
        generations ago, and treat a settling swarm the way sailors treat a
        falling barometer.
      pastimes:
        - "Basking in spirals on freshly warmed stone, in strict order of seniority. Nobody knows how the order is decided — not even, apparently, the moths."
        - "Riding cinder wolves between warm patches like slow ferries, which the wolves have agreed to never notice."
        - "Crowding a traveler's lantern in a polite ring, at exactly the distance where nobody's wings catch."
      social: >-
        An embermoth fears nothing that does not stamp. They land on children,
        tools, dragons, and soup, and regard all four as equally good
        perches. A swarm that leaves in a hurry is not being rude; it is being
        a warning.
      likes:
        - of: creature.cinder_wolf
          because: "The warmest fur in the foothills, and it commutes."
        - of: character.dragonling
          because: "They keep warming-stones by their doors and have never once swatted."
      dislikes:
        - of: creature.will_o_wisp
          because: "A light with no heat in it. The moths regard this as a broken promise."
    relationships:
      primary_locations: [biome.red_sky_foothills, location.mount_red_sky]
      creatures: []
      items: []

  - id: creature.mosshorn
    asset_id: mosshorn
    title: "Mosshorn"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, forest, gentle, indicator]
    danger_level: none
    scale: medium
    short_description: >-
      Gentle deer-like forest animal whose antlers support living moss, ferns, and flowers.
    visual_identity: >-
      Deer-like body with antlers shaped like small living branches, moss and
      seasonal plants grow naturally across the antlers and shoulders.
    common_story_uses: >-
      Guide toward a safe path, sign of ecological trouble, peaceful background creature.
    canon_constraints: >-
      Avoids conflict, leaves areas where forest magic has become damaged.
    standard_behavior: >-
      Follows healthy paths, sometimes approaches calm caretakers.
    lore:
      hook: "A walking garden that takes the job as seriously as any gardener."
      story: >-
        A mosshorn's antlers are living wood. Moss, ferns, and whole seasons of
        small flowers grow there, and the oldest of the herd carry gardens that
        predate the towns near them. The forest seems to route its health
        through them: where a mosshorn grazes, things are well, and where a
        mosshorn will not walk, wise travelers also do not.
      pastimes:
        - "Standing very still in the best light so the antler flowers open. The herd would deny this is showing off."
        - "Trading seedlings by gently knocking antlers together, the way other folk clink mugs."
        - "Wading into slow streams and letting minnows shelter in the antler roots until dusk."
      social: >-
        Shy but ceremonious. A mosshorn approaches a calm stranger exactly
        once, inspects them thoroughly, and then either stays forever or was
        never there. There is no appeal process.
      likes:
        - of: npc.harvest_sprite
          because: "The best tenants an antler ever had. They weed."
        - of: character.bigfoot
          because: "They prune with respect, and they always ask first."
        - of: character.unicorn
          because: "Where a glade is hurt, they mend it, and the grazing comes back."
      dislikes:
        - of: creature.will_o_wisp
          because: "The lights lead calves off the safe paths, and the herd has no way to say no to a light."
    relationships:
      primary_locations: [biome.enchanted_woods, location.mosshome]
      creatures: []
      items: []

  - id: creature.jackalope
    asset_id: jackalope
    title: "Jackalope"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, plains, common, fast]
    danger_level: none
    scale: small
    short_description: >-
      Fast rabbit-like plains animal with small branching antlers.
    visual_identity: >-
      Rabbit body, long ears, and delicate antlers. Coat colors reflect grasses,
      soil, and local crops.
    common_story_uses: >-
      Background life, harmless chase, clue that a nearby predator has disturbed a warren.
    canon_constraints: >-
      Flees from danger, investigates unattended food.
    standard_behavior: >-
      Gathers near well-maintained roads where predators are easier to spot.
    lore:
      hook: "The fastest thing on the plains, and it needs you to know it."
      story: >-
        Nobody knows whether the antlers came first or the attitude. Jackalopes
        treat the realm's road network as a racetrack built specifically for
        them, and a caravan crossing the Plains is, whether it knows it or not,
        competing. The jackalope always wins, usually on a technicality only
        the jackalope understands.
      pastimes:
        - "Racing caravans. The caravan is not always aware it has entered a race; this does not affect the standings."
        - "Antler-hooking contests over windfall apples, best of five, no biting."
        - "Assembling in perfect silence to watch travelers do absolutely anything at all."
      social: >-
        Bold at a distance, gone up close. A warren that lets you get near is
        telling you the neighbourhood is safe; an empty stretch of good road is
        telling you something else.
      likes:
        - of: npc.centaur
          because: "They keep the roads flat and fast, and they pretend not to race back."
        - of: npc.faun
          because: "Orchard windfalls, and nobody ever counts them."
      dislikes:
        - of: creature.cinder_wolf
          because: "Fair enough, being a wolf. But a wolf ruins a perfectly good straightaway."
        - of: character.kitsune
          because: "Raced one once. It turned out to be three of them, or possibly none. The warren has not recovered."
    relationships:
      primary_locations: [biome.plains, biome.sunward_fields, biome.eastern_plains]
      creatures: []
      items: []

  - id: creature.cloud_whale
    asset_id: cloud_whale
    title: "Cloud Whale"
    canon_status: confirmed
    classification: ambient_creature
    sapience: semi_sapient
    featured: true
    tags: [ambient, sky, majestic, semi_sapient]
    danger_level: low
    scale: colossal
    short_description: >-
      Enormous gentle sky-swimmer that follows the same high wind currents as the
      drifting islands.
    visual_identity: >-
      Whale-like form adapted to the sky with broad fins and cloud-soft edges,
      subtle star, rain, or wind markings.
    common_story_uses: >-
      Majestic background creature, navigation clue, rescue or migration story.
    canon_constraints: >-
      Cloud whales are not mounts, pets, or ordinary combat opponents.
    standard_behavior: >-
      Follows predictable seasonal currents, sings near storms, avoids settlements,
      occasionally shelters smaller fliers in its wake.
    lore:
      hook: "Too big to land. Too gentle to mind."
      story: >-
        Cloud whales swim the same high currents that carry the Sky Islands,
        and have been swimming them since before the islands had names. They
        sing near storms — not to calm them, as far as anyone can tell, but
        about them, the way sailors sing about the sea. Kitsune navigators
        write the songs down and steer by them, which the whales either do not
        know or do not mind.
      pastimes:
        - "Composing storm-songs that take three days to finish. The storm is usually gone by the second verse. The song continues."
        - "Drifting through the islands' wake to feel the hanging roots comb along their backs."
        - "Letting smaller fliers rest in the calm behind their fins, and pretending very hard not to notice them."
      social: >-
        A cloud whale acknowledges a ship, an island, or a griffin with one
        slow pass and considers the relationship established for life. They
        remember individual travelers for decades and are mildly hurt when the
        reverse is not true.
      likes:
        - of: character.kitsune
          because: "The little navigators sing back. Off-key, but sincerely."
        - of: character.griffin
          because: "They carry the stranded into its wake, where the wind is kind. It approves of this use of itself."
      dislikes:
        - of: creature.legend_dragon
          because: "One wingbeat unsettles a week of wind, and it has never once apologized."
    relationships:
      primary_locations: [biome.sky_islands]
      creatures: []
      items: []

  - id: creature.snowhorn_goat
    asset_id: snowhorn_goat
    title: "Snowhorn Goat"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, mountain, climbing, indicator]
    danger_level: low
    scale: medium
    short_description: >-
      Sure-footed mountain goat with translucent ice-colored horns.
    visual_identity: >-
      Dense pale coat and glassy blue-white horns, compact powerful legs and
      oversized climbing hooves.
    common_story_uses: >-
      Trail clue, rescue target, peaceful mountain scene.
    canon_constraints: >-
      Defends young with short charges, abandons routes before avalanches.
    standard_behavior: >-
      Follows safe mountain lines, abandons routes before avalanches or ice breaks.
    lore:
      hook: "It has never once been wrong about an avalanche, and it is not going to start explaining itself now."
      story: >-
        Snowhorn goats walk lines through the Frostfang that no map holds,
        passed from nanny to kid over generations of hard winters. When a herd
        abandons a slope, the slope fails within the day — every time, without
        exception, and without comment. The mountain peoples long ago stopped
        asking how the goats know and started simply watching where they stand.
      pastimes:
        - "Standing on the most impossible point available, for no reason anyone has ever established. It may be art."
        - "Leaving winter-shed horn where a traveler will find it, then watching from somewhere above while they do."
        - "Staring contests with griffins. The goats claim an unbroken record. The griffins claim not to be playing."
      social: >-
        A snowhorn tolerates climbers who follow its line and despairs,
        visibly, of those who do not. It will not lead you anywhere, but it
        will let you notice where it is going, which it considers more than
        generous.
      likes:
        - of: npc.yeti
          because: "They remember where the good lichen was frozen two hundred years ago, and they walk slowly enough to follow."
        - of: character.griffin
          because: "When the herd reroutes, the griffins call the warning down the valley. A good division of labor: the goats know, the griffins are loud."
      dislikes:
        - of: creature.frost_wyrm
          because: "It collapses in one morning what took the herd generations to map."
    relationships:
      primary_locations: [biome.frostfang_peaks, biome.glacier_of_origins]
      creatures: []
      items: []

  - id: creature.silver_otter
    asset_id: silver_otter
    title: "Silver Otter"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, river, playful, indicator]
    danger_level: none
    scale: small
    short_description: >-
      Playful river otter with water-shedding silver-blue fur.
    visual_identity: >-
      Sleek otter form with silver or blue highlights, often carries a favorite
      polished stone or shell.
    common_story_uses: >-
      River health clue, lighthearted interaction, finder of a small lost object.
    canon_constraints: >-
      Avoids polluted or magically disturbed water.
    standard_behavior: >-
      Plays in safe currents, collects polished objects, sometimes returns dropped items.
    lore:
      hook: "Keeper of the river's lost-and-found. The administration fee is usually nothing."
      story: >-
        Every silver otter keeps a hoard-shelf under a root somewhere: polished
        stones, dropped buttons, one perfect shell, arranged and rearranged
        over a lifetime. They return lost things to travelers not out of duty
        but because returning a thing makes you part of its story, and an otter
        would rather be in the story than own the button.
      pastimes:
        - "Stone-polishing in the eddies under bridge pilings, where the current does most of the work and takes none of the credit."
        - "Elaborate mudslide runs, redesigned every season, graded harshly by the juveniles."
        - "Silent riverside trade meets with boggarts, where nothing is said and everything is appraised."
      social: >-
        Playful with anyone who is near water and not currently a hazard. An
        otter that surfaces holding something you lost last week is not magic;
        it is thoroughness.
      likes:
        - of: npc.frogfolk
          because: "Pole boats are diving platforms, and a frogfolk pole has never once come down on an otter."
        - of: npc.boggart
          because: "The only people who understand the true worth of a really good button."
        - of: npc.stone_troll
          because: "It drops pebbles off the bridge on purpose and calls it maintenance."
      dislikes:
        - of: creature.river_drake
          because: "It claims the deepest pool and the toll. An otter's stones should not count as cargo."
    relationships:
      primary_locations: [location.stone_crossing, biome.mermaid_cove]
      creatures: []
      items: []

  - id: creature.reefglider
    asset_id: reefglider
    title: "Reefglider"
    canon_status: confirmed
    classification: ambient_creature
    sapience: animal
    featured: false
    tags: [ambient, ocean, reef, indicator]
    danger_level: none
    scale: medium
    short_description: >-
      Bright manta-like reef animal that glides through warm currents in
      coordinated groups.
    visual_identity: >-
      Broad ray-like body with colorful coral patterns, trailing luminous fins
      used for group signaling.
    common_story_uses: >-
      Underwater atmosphere, current warning, guide toward healthy coral.
    canon_constraints: >-
      A sudden mass departure signals danger or reef damage.
    standard_behavior: >-
      Circles healthy reefs, avoids violent currents, gathers near merfolk song circles.
    lore:
      hook: "A kite the sea flies for itself."
      story: >-
        Reefgliders are the cove's weather, its festival, and its early-warning
        system in one slow-turning body of light. The patterns on their backs
        match the coral they grew up over, and their formation-signals are old
        enough that merfolk song borrows phrases from them rather than the
        other way around.
      pastimes:
        - "Formation-flying through the reef arches in patterns that take a whole tide to complete."
        - "Orbiting merfolk song circles like a slow mobile, keeping time with their fins."
        - "Riding the front edge of a storm current the long way around the cove, apparently for the view."
      social: >-
        Reefgliders have no known dislikes, which the merfolk privately find
        suspicious. They investigate everything new by circling it at a
        courteous distance for exactly one afternoon, after which it is
        considered part of the reef.
      likes:
        - of: npc.merfolk
          because: "The song circles. The singers pretend not to be flattered by the audience, and fail."
        - of: npc.selkie
          because: "Their wakes are the best game in the cove, and the selkies swim like they know it."
      dislikes: []
    relationships:
      primary_locations: [biome.mermaid_cove]
      creatures: []
      items: []

  # ===== DANGEROUS CREATURES =====

  - id: creature.glassback_crab
    asset_id: glassback_crab
    title: "Glassback Crab"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, foothills, territorial, burrower]
    danger_level: moderate
    scale: medium_to_large
    short_description: >-
      Large territorial crab-like burrower with a translucent mineral shell.
    visual_identity: >-
      Broad crab body with a crystal-like shell that refracts nearby color, heavy
      digging claws and heat-darkened legs.
    common_story_uses: >-
      Cave obstacle, mistaken gemstone formation, sign of a newly warmed tunnel.
    canon_constraints: >-
      Threatens before charging, usually stops pursuing once intruder leaves territory.
    standard_behavior: >-
      Defends warm burrows and exposed mineral deposits.
    lore:
      hook: "The most patient misunderstanding in the foothills."
      story: >-
        A glassback's shell refracts whatever color is nearby, which in the
        foothills is usually gemstone, which is why every treasure rush in
        history has included somebody trying to mine one. The crab minds
        enormously. It gives one warning, which is more than most prospectors
        deserve, and it holds no grudge afterward — off its warm ground, you
        have never existed.
      pastimes:
        - "Rearranging the mineral garden at its burrow mouth. Taste in arrangement appears to be hereditary."
        - "Following embermoth swarms to freshly warmed ground, like a prospector who reads the news."
        - "Holding threat displays at boulders that turned out not to be rival crabs. It takes a while to be sure."
      social: >-
        Solitary and formal. Neighbouring crabs maintain exact, invisible
        borders that are renegotiated once a year in a ceremony that looks
        exactly like two rocks facing each other for a day.
      likes:
        - of: creature.embermoth
          because: "It finds the warm ground first and charges nothing for the information."
        - of: character.dragonling
          because: "They knock on the burrow stone and wait. The only people who do."
      dislikes:
        - of: creature.cinder_wolf
          because: "In deep winter a pack will dig into someone else's warm burrow without so much as a wave."
    relationships:
      primary_locations: [biome.red_sky_foothills, location.mount_red_sky]
      creatures: []
      items: []

    encounter:
      band: brute
      resolutions:
        - kind: observation
          stat: clever
          difficulty: easy
          text: >-
            It threatens before it charges, so the warning is the whole
            encounter if somebody reads it.
        - kind: escape
          stat: quick
          difficulty: normal
          text: >-
            It stops pursuing once you are off its patch of warm ground.

  - id: creature.cinder_wolf
    asset_id: cinder_wolf
    title: "Cinder Wolf"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, foothills, pack, predator]
    danger_level: moderate
    scale: medium
    short_description: >-
      Lean pack predator with ash-dark fur and heat glowing faintly beneath its coat.
    visual_identity: >-
      Wolf-like form with charcoal fur, ember-colored eyes, and faint cracks of
      warm light.
    common_story_uses: >-
      Displaced predator, night pursuit, evidence of volcanic disruption.
    canon_constraints: >-
      Cinder wolves are animals, not servants of an evil force by default.
    standard_behavior: >-
      Avoids settled areas when prey is plentiful. Tremors or loss of habitat can
      drive packs toward roads.
    lore:
      hook: "Not a monster. Cold, mostly, and a long way from home."
      story: >-
        Cinder wolves carry banked heat under their coats the way other packs
        carry nothing at all — a shared hearth that never quite goes out, fed
        by closeness. A pack sleeping is one animal with twelve legs. When the
        mountain grumbles and the prey moves, whole packs are pushed onto the
        roads with their hearth and their hunger, and neither one is malice.
      pastimes:
        - "Heat-lounging in stacked piles, bottom position rotated by some fairness system no observer has cracked."
        - "Pounce-games with embermoth swarms. No moth has ever been harmed; the game is the swirl."
        - "Howling at the mountain in long complaints, which dragonling children insist they can translate."
      social: >-
        A cinder wolf pack wants nothing to do with you, and a pack that is
        near you anyway is a pack whose home has stopped working. Feeding one
        does not tame it; it does, however, get remembered.
      likes:
        - of: creature.embermoth
          because: "A coatful of passengers, and the glow makes the den look lived-in."
      dislikes:
        - of: creature.legend_dragon
          because: "When it turns over in its sleep, the prey moves east and nobody eats for a week."
    relationships:
      primary_locations: [biome.red_sky_foothills, biome.plains]
      creatures: []
      items: []

    encounter:
      band: skirmisher
      resolutions:
        - kind: distraction
          stat: clever
          difficulty: normal
          text: >-
            A pack on a road is a pack that has run out of prey. Give them
            easier prey and the road stops being interesting.
        - kind: escape
          stat: quick
          difficulty: hard
          text: >-
            They are faster than you and they hunt together, so leaving is
            harder than it looks.

  - id: creature.mire_mimic
    asset_id: mire_mimic
    title: "Mire Mimic"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, marsh, ambush, camouflage]
    danger_level: moderate
    scale: medium_to_large
    short_description: >-
      Patient marsh predator that resembles a safe patch of ground, log, or
      abandoned boat.
    visual_identity: >-
      Low mud-and-root body capable of flattening into familiar marsh shapes,
      small eye clusters and reed-like sensory whiskers.
    common_story_uses: >-
      Navigation hazard, rescue encounter, reason a familiar route has been closed.
    canon_constraints: >-
      Remains motionless beside frequently used paths, retreats from fire and
      strong vibration.
    standard_behavior: >-
      Remains motionless, abandons hunting sites repeatedly marked by frogfolk.
    lore:
      hook: "The marsh's most committed method actor, currently appearing in the role of 'ground.'"
      story: >-
        Nobody knows whether the mire mimic thinks of itself as a hunter or as
        a performance. It has been a log, a jetty, three different abandoned
        boats, and once — memorably — a small footbridge, for eleven years,
        during which it let every school child in the marsh cross safely and
        ate exactly one tax collector's satchel. Its impressions improve with
        study; the newest boats have a smell.
      pastimes:
        - "Rehearsing. A mimic between hunts will practice being things it has no intention of ambushing anyone as."
        - "Collecting compliments it overhears about scenery it is currently being."
        - "Sulking, flatly and at length, after being identified in public."
      social: >-
        Solitary, patient, and quietly vain. Mimics encounter each other
        rarely, and what happens then is not well understood, though one
        frogfolk account describes two stretches of identical shoreline facing
        each other for a month in what may have been a competition.
      likes:
        - of: creature.will_o_wisp
          because: "It walks the audience straight to the stage, free of charge, and never once learns."
      dislikes:
        - of: npc.frogfolk
          because: "The marking poles are reviews, and the reviews are always bad."
        - of: npc.boggart
          because: "They treat its staging area as a lost-and-found and its props as inventory."
        - of: creature.loftmire
          because: "A dusting, and the ground it is currently being begins to hover. There is no worse thing that can happen to a performance."
    relationships:
      primary_locations: [biome.whispering_marsh]
      creatures: []
      items: []

    encounter:
      band: lurker
      resolutions:
        - kind: observation
          stat: clever
          difficulty: normal
          text: >-
            It only works while it is mistaken for the ground. Naming it ends
            the ambush.
        - kind: distraction
          stat: might
          difficulty: normal
          text: >-
            Strong vibration moves it off a hunting site — stamping works as
            well as anything.

  - id: creature.frost_wyrm
    asset_id: frost_wyrm
    title: "Frost Wyrm"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, mountain, ice, predator]
    danger_level: high
    scale: large
    short_description: >-
      Large serpentine ice predator that burrows through deep snow and fractured
      glacier ice.
    visual_identity: >-
      Long low body, digging forelimbs, ice-ridged scales, and a wedge-shaped head.
    common_story_uses: >-
      Mountain chase, blocked pass, sign that the glacier is warming or shifting.
    canon_constraints: >-
      Avoids griffin aeries, defends nesting tunnels aggressively.
    standard_behavior: >-
      Avoids griffin aeries but defends nesting tunnels aggressively. Unusual
      warmth can force them onto paths.
    lore:
      hook: "The glacier's other tenant. It was here first, and the receipts are frozen."
      story: >-
        Frost wyrms tunnel the deep ice along seams older than any map,
        spiraling their nests around things frozen far below — whether they
        guard those things or simply like the company is one of the north's
        politely unasked questions. A wyrm's whole idea of a good year is one
        in which nothing at all happens near its tunnel, and it enforces this
        idea with total commitment.
      pastimes:
        - "Coiling beneath the yetis' singing halls to feel the low notes come down through forty feet of ice. The yetis do not know. The wyrm is counting on that."
        - "Polishing tunnel walls to glass with its ridged scales, for reasons that may be maintenance and may be pride."
        - "Sleeping through entire seasons, on purpose, starting from a good one."
      social: >-
        A frost wyrm defends the tunnel, never the mountain. It holds no
        grudges because it takes no notes: leave, and you have solved the
        entire relationship.
      likes:
        - of: npc.yeti
          because: "Their songs carry through the ice. It has opinions on the repertoire, all favorable, none shared."
      dislikes:
        - of: character.griffin
          because: "A shadow crossing the snow is the one shape it has never argued with."
    relationships:
      primary_locations: [biome.frostfang_peaks, biome.glacier_of_origins]
      creatures: []
      items: []

    encounter:
      band: sentinel
      behavior: holds_ground
      resolutions:
        - kind: escape
          stat: quick
          difficulty: normal
          text: >-
            It defends the tunnel, not the mountain. Leave the tunnel and it
            stops.
        - kind: observation
          stat: clever
          difficulty: hard
          text: >-
            Telling a nesting tunnel from an ordinary one, before you are
            standing in it.

  - id: creature.river_drake
    asset_id: river_drake
    title: "River Drake"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: semi_sapient
    featured: false
    tags: [dangerous, river, semi_sapient, territorial]
    danger_level: moderate
    scale: large
    short_description: >-
      Long-bodied freshwater drake that claims deep pools, bridge shadows, and
      narrow currents.
    visual_identity: >-
      Sleek amphibious dragon-like body with fins, short limbs, and river-stone
      coloring.
    common_story_uses: >-
      Bridge complication, river rescue, creature displaced by changed currents.
    canon_constraints: >-
      Smaller and less powerful than a legendary dragon, can learn routines.
    standard_behavior: >-
      Defends deep water and favorite resting shelves, may block boats or demand
      dropped food.
    lore:
      hook: "The river's self-appointed toll collector. The river has not confirmed the appointment."
      story: >-
        A river drake claims a stretch of deep water the way other folk claim a
        trade, and it works the position with genuine professionalism: it knows
        the ferry schedule better than the ferryman, adjusts its rates by
        cargo, weather, and how the day is going, and never takes more than the
        toll. Where the toll came from, and by what authority, are questions
        the drake considers closed.
      pastimes:
        - "Rearranging the hoard shelf: fish bones, boat fittings, and one perfect otter-polished stone it will not discuss."
        - "Timing the caravan queue from underwater and surfacing at the exact moment it is longest."
        - "Napping in the bridge's shadow with one eye open, which it considers being at work."
      social: >-
        Semi-sapient and thoroughly transactional. A drake learns individual
        faces, individual boats, and individual grudges, and its regulars are
        waved through in a way that first-timers find infuriating.
      likes:
        - of: npc.stone_troll
          because: "A colleague in the crossing trade. They have never spoken. The tolls are honored between professionals."
        - of: individual.old_ossley
          because: "The one ferryman who pays without arguing, and who once threw in a honeycake unprompted."
      dislikes:
        - of: creature.silver_otter
          because: "They call the toll 'borrowing.' It is not borrowing."
    relationships:
      primary_locations: [location.stone_crossing]
      creatures: []
      items: []

    encounter:
      band: brute
      resolutions:
        - kind: bargaining
          stat: heart
          difficulty: normal
          text: >-
            It blocks boats and demands dropped food. Paying the toll is a
            complete answer.
        - kind: conversation
          stat: clever
          difficulty: hard
          text: >-
            It learns routines, so it can be talked into a different one.

  - id: creature.bone_crawler
    asset_id: bone_crawler
    title: "Bone Crawler"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, bone_yard, scavenger, swarm]
    danger_level: moderate
    scale: small_to_medium
    short_description: >-
      Pale scavenger that constructs protective shells from loose fossil fragments.
    visual_identity: >-
      Low many-legged body mostly hidden beneath an irregular shell of old bone.
    common_story_uses: >-
      Bone Yard atmosphere, swarm obstacle, indicator that new magical energy
      entered the island.
    canon_constraints: >-
      Does not intentionally animate bones. Shell looks assembled, not like an
      animated skeleton.
    standard_behavior: >-
      Hides from large creatures, defends feeding sites, swarms objects carrying
      fresh magical energy.
    lore:
      hook: "A hermit crab that moved into history."
      story: >-
        A bone crawler's shell is generations of borrowed fossil, fitted and
        refitted until it is more heirloom than armor. When a crawler outgrows
        its shell it leaves the whole assembly standing on the sand, and a
        younger crawler moves in the way a child inherits a coat — sleeves too
        long, dignity enormous. The Bone Yard's oldest shells have housed forty
        owners and are considered fine addresses.
      pastimes:
        - "Shell-fitting, which is never finished. There is always one fragment that would sit better a little to the left."
        - "Parading after the Restless Remains whenever the big bones walk. Chips fall like festival coins."
        - "Arranging spare fragments in spirals on the tideline. No explanation has ever been offered."
      social: >-
        Timid alone, bold in a clatter, and entirely without enemies it is
        aware of — everything it ought to fear is far too old to bother with
        it. A swarm converging on your pack is not an attack; something in the
        pack is humming with magic, and they would like it very much.
      likes:
        - of: creature.restless_remains
          because: "A walking quarry and a parade in one. The crawlers attend every manifestation."
      dislikes: []
    relationships:
      primary_locations: [location.bone_yard]
      creatures: []
      items: []

    encounter:
      band: skirmisher
      resolutions:
        - kind: distraction
          stat: clever
          difficulty: normal
          text: >-
            It swarms whatever carries fresh magical energy. Throw the glowing
            thing somewhere you are not.
        - kind: escape
          stat: quick
          difficulty: normal
          text: >-
            It hides from anything large, so standing tall and leaving loudly
            usually works.

  - id: creature.echo_hunter
    asset_id: echo_hunter
    title: "Echo Hunter"
    canon_status: confirmed
    classification: dangerous_creature
    sapience: animal
    featured: false
    tags: [dangerous, underground, blind, predator]
    danger_level: high
    scale: large
    short_description: >-
      Blind underground predator that maps tunnels and tracks movement through sound.
    visual_identity: >-
      Pale low-slung body, no functional eyes, broad listening frills, and long
      gripping limbs.
    common_story_uses: >-
      Stealth encounter, evidence of pressure from deeper underground, guardian
      of an abandoned tunnel.
    canon_constraints: >-
      Designed for darkness without gore or grotesque human features.
    standard_behavior: >-
      Remains still while listening, investigates repeated sounds, retreats from
      overwhelming layered noise.
    lore:
      hook: "It has never seen anything in its life, and it knows the tunnels better than you know your own name."
      story: >-
        An echo hunter's memory is a library of sound: every drip, every
        chamber, every visitor filed by footfall. It does not patrol so much as
        proofread — a new sound in a known tunnel is an error in the text, and
        the hunter will keep returning to the sentence until it parses. It is
        not cruel. It is thorough, in the dark, which can amount to the same
        thing for the unprepared.
      pastimes:
        - "Re-listening to favorite chambers the way a person rereads a good book."
        - "Adjusting a tunnel's drip pattern, one moved pebble at a time, until the chamber sounds right. This can take years. The hunter has years."
        - "Following an interesting new sound for days at a courteous distance, cataloguing."
      social: >-
        Entirely solitary, and by its own lights entirely polite. Approach
        making steady, unhurried sounds and it files you under known;
        approach in chaos and you are a problem the dark now needs to solve.
      likes:
        - of: npc.stone_troll
          because: "They knock on stone before entering a passage — in its language, the height of good manners."
      dislikes:
        - of: creature.bone_crawler
          because: "A crowd of clattering shells is a paragraph with no punctuation. It cannot bear it."
    relationships:
      primary_locations: [location.skullwater_cave]
      creatures: []
      items: []

  # ===== SUPERNATURAL MANIFESTATIONS =====

    encounter:
      band: sentinel
      resolutions:
        - kind: distraction
          stat: clever
          difficulty: normal
          text: >-
            It hunts one repeated sound and retreats from many at once. Make
            the dark noisy.
        - kind: escape
          stat: quick
          difficulty: hard
          text: >-
            Leaving in silence, which is harder than leaving.

  - id: creature.will_o_wisp
    asset_id: will_o_wisp
    title: "Will-o'-Wisp"
    canon_status: confirmed
    classification: supernatural_manifestation
    sapience: variable
    featured: false
    tags: [supernatural, marsh, memory, misdirection]
    danger_level: moderate
    scale: tiny
    short_description: >-
      A floating light formed when a strong memory becomes tangled in marsh magic.
    visual_identity: >-
      Small floating light with a shifting center that may briefly suggest a
      face, object, or scene.
    common_story_uses: >-
      Misdirection, emotional clue, fragment of an older event, a game that has
      forgotten it ended.
    canon_constraints: >-
      Not automatically the ghost of a dead person. Regional nicknames name where
      a wisp manifests, not a second species.
    standard_behavior: >-
      Some repeat a memory harmlessly. Others lure travelers toward connected
      places even when the route is unsafe.
    lore:
      hook: "A memory that got loose, and is still trying to finish itself."
      story: >-
        When a memory matters enough — a way home, a hiding place, a game
        interrupted at the best part — it can tangle in marsh magic and keep
        going without its person. That is a wisp: one moment, replaying. Some
        glow through it quietly forever. Others need a witness, and will lead
        anyone who follows toward the place where the moment lived, without
        ever checking whether the route still exists.
      pastimes:
        - "Replaying the good part."
        - "Leading anything that will follow — travelers, moths, other wisps — toward the remembered place."
        - "Hovering at the edge of frogfolk lantern festivals, at exactly the distance of an uninvited guest."
      social: >-
        A wisp cannot converse, exactly, but it responds — to patience, to
        being walked with instead of away from, and above all to please,
        which in the entire recorded history of the marsh almost nobody has
        tried.
      likes:
        - of: npc.boggart
          because: "They listen to the whole memory, every single time, and they write it down."
        - of: npc.witch_order
          because: "Once in a while, one of them can untangle the memory and let it finish. The wisp-equivalent of going home."
        - of: creature.loftmire
          because: "Drift inside one and you come out somewhere you have never been. It is the only thing in the marsh that has ever given a wisp a new route."
      dislikes:
        - of: creature.mire_mimic
          because: "It keeps eating the audience in the middle of the story."
    relationships:
      primary_locations: [biome.whispering_marsh, biome.enchanted_woods]
      creatures: []
      items: []

    encounter:
      band: skirmisher
      resolutions:
        - kind: conversation
          stat: heart
          difficulty: normal
          text: >-
            Nobody has ever said please to a wisp before. It is not ready for
            it.
        - kind: observation
          stat: clever
          difficulty: normal
          text: >-
            Noticing that the route it is offering is not a route.

  - id: creature.restless_remains
    asset_id: restless_remains
    title: "Restless Remains"
    canon_status: confirmed
    classification: supernatural_manifestation
    sapience: variable
    featured: false
    tags: [supernatural, bone_yard, rare, guardian]
    danger_level: high
    scale: variable
    short_description: >-
      Ancient bones temporarily animated when the Bone Yard's rest is seriously
      disturbed.
    visual_identity: >-
      Movement assembled from existing enormous remains, magic appears as current,
      vibration, light, or shadow joining the bones.
    common_story_uses: >-
      Guardian encounter, consequence of grave disturbance, puzzle to resolve.
    canon_constraints: >-
      Stays dormant under normal conditions. Each manifestation reflects the
      remains and cause involved.
    standard_behavior: >-
      When awakened by grave magic or theft, moves to remove, reclaim, expose, or
      stop the cause.
    lore:
      hook: "Not a monster. A grievance, wearing whatever was available."
      story: >-
        The Bone Yard mostly sleeps, and prefers to. But when the rest is
        seriously disturbed, something rises in whichever remains are nearest —
        not the dead themselves, but the cause: the taken thing, the broken
        promise, given shape and momentum until it is put right. It does not
        chase you out of the Yard. It walks toward the wrong until the wrong
        stops, and then, with visible relief, it lies back down.
      pastimes:
        - "Being still. Between manifestations it is nothing at all, which every account agrees is how it prefers things."
        - "Settling back down in a slightly different arrangement each time, to the lasting despair of everyone who maps the Yard."
        - "Listening, if bones can listen, to merfolk song carrying over calm water. The Yard is measurably quieter on singing nights."
      social: >-
        It answers a wrong, not a person. Put back what was taken and it
        settles mid-stride; speak gently and there is sometimes enough of
        someone left in it to answer. It has never once pursued anyone past
        the water line.
      likes:
        - of: npc.merfolk
          because: "The songs reach across the water on still nights, and the bones settle a little lower for hearing them."
      dislikes:
        - of: creature.bone_crawler
          because: "Borrowing pieces from the dead is precisely the category of thing it exists to object to. But they are very small. The grievance is noted, indefinitely."
    relationships:
      primary_locations: [location.bone_yard]
      creatures: []
      items: []

    encounter:
      band: brute
      behavior: guards_its_cause
      resolutions:
        - kind: restoring_habitat
          stat: heart
          difficulty: normal
          text: >-
            It woke because something was taken or disturbed. Put it back and
            it settles.
        - kind: conversation
          stat: heart
          difficulty: hard
          text: >-
            There is enough of a person left to answer, if you are gentle
            about asking.

  - id: creature.loftmire
    title: "Loftmire"
    canon_status: newly_defined
    classification: supernatural_manifestation
    sapience: unknown
    featured: false
    tags: [supernatural, marsh, mist, hazard, drift, lost_things]
    danger_level: moderate
    scale: variable
    short_description: >-
      A low drifting cloud that sheds a fine sand which falls upward, lifting
      whatever it settles on toward the cloud the sand is trying to get back to.
    visual_identity: >-
      A flat-bottomed cloud hanging a few feet off the water, pale and slow and
      wider than a barn, with a faint grit coming out of its underside that
      drifts the wrong way. Reeds beneath it stand straight up. The water under
      it dimples upward. Its interior, glimpsed from below, is furnished —
      rope, a lit lantern, boots, somebody's washing, all floating at whatever
      height their weight decided on.
    common_story_uses: >-
      A hazard the party can see coming and steer, separation of the party,
      recovery of a thing lost years ago, hauling something too heavy to drag,
      and a stray met far from home that needs walking back.
    canon_constraints: >-
      It never hunts, chases, or targets a person. It follows its own sand,
      which is a different sentence and the one to write. It does not injure,
      crush, drown, or drop anything it has lifted. Its sand cannot be
      contained, stored, or carried as equipment — it is always leaving, and a
      jar of it is a jar with a cloud coming after it. Strays outside the marsh
      are rare and are always lost; they are never a population.
    standard_behavior: >-
      Drifts at walking pace, cannot turn, and sheds grit continuously. Sand
      that lands on something living or something carried begins pulling it
      toward the cloud, as hard as the dose is large — a dusting makes a
      traveler light on their feet, a pocketful takes them off the ground. The
      pull leans toward the cloud rather than straight up, so the first sign is
      usually a party all tilting the same way. Brushing, wetting, or muddying
      the sand ends it. The cloud thins over moving water and open sun, and
      sets down everything it holds, gently, heaviest first.
    lore:
      hook: "It is not chasing you. It is collecting."
      story: >-
        Nobody agrees what a loftmire is, which is why nobody agrees what to
        call one. The witches say loftmire and have a theory. The frogfolk say
        the low sky, because that is what fits on a chart. Boggarts say the
        shelf, and something taken by one has been shelved. The Exchange
        writes lifter on the paperwork and marks the cargo gone up. Everybody
        else, including every child in the marsh, says upfall.
        What is agreed is the sand. It comes out of the cloud and it is trying
        to get home, and a grain on its own manages it in a minute and nobody
        notices. A grain stuck to a sleeve is a very small thing pulling on a
        very large one, and losing. Enough grains stop losing. The cloud is
        never where the danger is; its dust is, and the cloud is only where the
        dust is going.
      pastimes:
        - "Shedding, reclaiming, and shedding again, which appears to be the whole of it and has never been observed to stop."
        - "Standing over one bend of a channel for a whole afternoon, for no reason anybody has established, though everybody has a theory."
        - "Coming back. Whatever leaves with its sand on it will be followed, at walking pace, for as long as it takes."
      social: >-
        Two loftmires that meet drift through one another and come out the
        far side having exchanged some unknowable fraction of their sand, after
        which each spends a season retrieving grains that are arguably no
        longer theirs. The frogfolk consider this the single most tedious
        event in the marsh and reroute around it.
      likes:
        - of: npc.boggart
          because: "Boggarts are the only people in the marsh who reliably give it back. They are also the sole reason it is now three miles from where it started."
        - of: creature.will_o_wisp
          because: "A wisp that drifts inside becomes the lighting. It is also the only thing that ever hands a wisp a route it does not remember."
      dislikes:
        - of: npc.frogfolk
          because: "They weight the poles, brush the coats, chart the drift, and give it nothing. A frogfolk channel is the emptiest crossing in the marsh."
    relationships:
      primary_locations: [biome.whispering_marsh]
      creatures: []
      items: []
    notes:
      - >-
        Five peoples, five names, and the disagreement is the point: it is
        downstream of the marsh's older argument about whether the thing
        chooses anything at all. A chapter may use whichever name its narrator
        would use. "Upfall" is the one to put on a card.
      - >-
        No asset_id yet. It is weather rather than a figure, so its art is
        likelier to be a biome effect than an entry in assets/entities/.
    encounter:
      # No band. There is nothing here to hit — see D18. What the party does
      # instead is the whole encounter, so all five ways past are load-bearing.
      resolutions:
        - kind: observation
          stat: clever
          difficulty: normal
          text: >-
            The reeds under it stand straight up and the water dimples upward.
            Read that, and read who in the party is already carrying how much.
        - kind: escape
          stat: quick
          difficulty: normal
          text: >-
            Get out from under it before the dose matters. It drifts at walking
            pace and it cannot turn.
        - kind: rescue
          stat: might
          difficulty: normal
          text: >-
            Someone going up can be held and brushed down. Two hands beat one,
            and the pull is gentle — it is only constant.
        - kind: environmental_problem_solving
          stat: clever
          difficulty: hard
          text: >-
            Carry a doseful and it follows. Walk it over the stuck barge, off
            the channel the children use, or away from the village — then put
            the sand down somewhere that does not matter, and go.
        - kind: restoring_habitat
          stat: heart
          difficulty: normal
          text: >-
            A stray followed something too far and cannot find the marsh. Getting
            it home is the same trick as luring it anywhere else, done kindly and
            for much longer.

  # ===== LEGENDARY BEASTS =====

  - id: creature.legend_dragon
    asset_id: legend_dragon
    title: "Legend Dragon"
    canon_status: confirmed
    classification: legendary_beast
    sapience: sapient
    featured: false
    tags: [legendary, volcano, sapient, ancient]
    danger_level: legendary
    scale: colossal
    short_description: >-
      An ancient, solitary dragon powerful enough to claim territory on or
      beneath Mount RedSky.
    visual_identity: >-
      Enormous dragon silhouette shaped by age and volcanic surroundings, scales
      may show heat, ash, mineral, or gemstone effects.
    common_story_uses: >-
      Legendary guardian, dangerous source of ancient knowledge, powerful
      individual whose goals are not understood.
    canon_constraints: >-
      Not the rulers or parents of dragonling society. No specific legend dragon
      has yet been named or designed.
    standard_behavior: >-
      Guards a claimed lair or purpose, monitors intrusions, may warn, test,
      bargain with, or attack depending on individual.
    lore:
      hook: "The mountain has a tenant. Nobody has read the lease."
      story: >-
        A legend dragon is less a species than an event that keeps happening to
        Mount Red Sky. Each one is singular, ancient, and organized around a
        purpose it has never seen the need to explain; whatever it keeps
        beneath the mountain, it has kept since before anyone now living could
        ask. Dragonling fireside stories claim kinship. The dragon has heard
        the stories. It has not commented.
      pastimes:
        - "Rearranging the hoard by systems that take decades to complete. The current arrangement is believed to be by weight. The previous one may have been by regret."
        - "Listening to the mountain. It is possible this is a conversation."
        - "Testing visitors with questions it already knows the answers to, and grading generously when surprised."
      social: >-
        It may warn, test, bargain, or attack, and which one is a fact about
        the individual, not the species. What every account agrees on: it
        notices everything, forgets nothing, and finds almost all of it
        beneath comment.
      likes:
        - of: creature.cloud_whale
          because: "Something else old and slow that sings. The whales will not come near it, which it has decided not to notice."
        - of: creature.embermoth
          because: "The only living things permitted in the lair. They dust the scales, and they know the mountain's moods almost as well as it does."
      dislikes:
        - of: faction.deep_hollow_cult
          because: "They keep knocking."
    relationships:
      primary_locations: [location.mount_red_sky]
      creatures: []
      items: []
    encounter:
      band: legend
      stats: { hp: 36, guard: 16, quick: 2, steps: 4, attack: 5 }
      xp: 50
      footprint: 4
      behavior: holds_ground
      resolutions:
        - kind: bargaining
          stat: heart
          difficulty: hard
          text: >-
            It may warn, test, or bargain before it attacks. Which one is a
            fact about the individual, not the species.
        - kind: conversation
          stat: clever
          difficulty: hard
          text: >-
            It is guarding a purpose. Working out which one is most of the
            conversation.
