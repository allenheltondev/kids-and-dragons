schema_version: "2.0"
document_type: red_sky_creature_canon
title: "The Realm of Red Sky Creature Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for every non-playable fauna species in
  the Realm of Red Sky. Use this file when planning encounters, creature artwork,
  environmental storytelling, ambient wildlife, regional atmosphere, or any game
  content involving non-player creatures.

agent_instructions:
  - Dangerous creatures are dangerous because of predation, territoriality, magical instability, or environmental pressure; they are not morally evil by default.
  - Species does not determine morality. Villains should be named individuals, mixed-species factions, or supernatural threats defined by choices and goals.
  - The child-hero tone requires danger, loss, and frightening mysteries to remain suitable for a child-centered adventure. Emphasize courage, curiosity, consequences, cooperation, and repair over gore or cruelty.
  - Encounters should usually permit more than combat. Appropriate alternatives include observation, conversation, bargaining, rescue, distraction, escape, environmental problem-solving, and restoring a damaged habitat.
  - Mount RedSky is not a dragonling homeland or civilization. Adult dragons on Mount RedSky are rare, solitary legendary beasts and are not automatically related to dragonlings.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Creature ids must not be invented outside this file or docs/red-sky-creature-canon.yaml.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  classification:
    ambient_creature: "Non-sapient or semi-sapient wildlife that normally avoids conflict."
    dangerous_creature: "Non-sapient or semi-sapient creature likely to create danger."
    supernatural_manifestation: "A magical event or animated phenomenon rather than a biological species."
    legendary_beast: "Rare, individually significant creature; usually not a population."
  danger_level:
    none: "Not normally dangerous."
    low: "May inconvenience or frighten but rarely causes serious harm."
    moderate: "Can harm unprepared travelers."
    high: "A serious threat requiring planning, escape, or cooperation."
    legendary: "Potentially realm-changing or suitable for a major story climax."
    unknown: "Deliberately not established."
  sapience:
    animal: "Wildlife-level cognition."
    semi_sapient: "Problem solving and communication beyond ordinary wildlife without a full civilization."
    sapient: "Person-level intelligence, language, culture, and moral agency."
    variable: "Varies by individual, age, or manifestation."
    unknown: "Not established."
  scale:
    tiny: "Fits in cupped hands."
    tiny_to_small: "Between hands and knee height."
    small: "Knee height on a person."
    small_to_medium: "Between knee and waist height."
    medium: "Person-sized."
    medium_to_large: "Between person and horse sized."
    large: "Horse-to-wagon sized."
    very_large: "Fills a clearing; too big for a single combat tile."
    colossal: "Landscape-scale. Never a combat actor."
    variable: "Size depends on the individual or manifestation."

