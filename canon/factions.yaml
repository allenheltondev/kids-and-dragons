schema_version: "2.0"
document_type: red_sky_faction_canon
title: "The Realm of Red Sky Faction Canon"
updated: "2026-07-31"

purpose: >-
  Canonical, agent-readable reference for organized groups and factions in the
  Realm of Red Sky. Use this file when planning faction interactions, political
  storylines, membership, or any game content involving organized groups. Note
  that per creature canon rules, named individuals, villainous factions, and
  political governments are not yet canon.

agent_instructions:
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - These faction entries are placeholder designs pending explicit canon approval. They may be used for chapter-scoped content but carry no canon weight outside that scope.
  - Do not treat faction membership, hierarchy, or named leaders as established canon.
  - Factions should not be portrayed as uniformly good or evil without individual moral agency.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  faction_type:
    military_order: "An organized group with martial purpose and hierarchy."
    secret_society: "A hidden group operating through cells and indirect communication."
  alignment:
    lawful_neutral: "Follows a strict code without inherent moral bias."
    chaotic_neutral: "Prioritizes individual freedom and unconventional methods."

faction_ids:
  - skywardens
  - deep_hollow_cult

factions:
  - id: faction.skywardens
    asset_id: skywardens
    title: "The Skywardens"
    canon_status: intentionally_undefined
    canon_note: >-
      Per creature canon rules, named factions and political governments are not
      yet canon. This entry is a placeholder design for chapter-scoped content.
    faction_type: military_order
    alignment: lawful_neutral
    featured: true
    tags: [military, order, protectors, highlands]
    short_description: >-
      An ancient order of knights sworn to watch the red sky and protect the
      realm from what lies beyond it.
    visual_identity: >-
      Silver and violet armor, crimson cloaks, tower shield emblems.
    common_story_uses: >-
      Player faction, quest givers, moral authority, military support.
    canon_constraints: >-
      Honorable but rigid. Will sacrifice individuals for the greater good.
    standard_behavior: >-
      Patrol the highlands, maintain fortifications, train recruits.
    lore:
      hook: "Sworn to watch the sky. Proudest log entry in four centuries: 'nothing.'"
      story: >-
        The Skywardens were founded to watch the red sky and answer whatever
        finally comes out of it, and the order's deepest doctrine is that the
        watch being boring is the watch working. Recruits arrive dreaming of
        battle and are handed a ledger; the ones who come to love the ledger
        stay. Every warden knows the founding oath by heart and no warden
        knows what, precisely, it was first sworn against, which the order
        regards not as a gap in the records but as the records doing their job.
      pastimes:
        - "Watch-games: competitive cloud identification, governed by four centuries of accumulated house rules."
        - "Forge nights at the citadel, where the smithing is real and the storytelling is quality-controlled."
        - "Sky-cartography — charting a thing that will not hold still, revised nightly, bound annually, shelved forever."
      social: >-
        Formal, reliable, and rigid in exactly the way that makes them
        excellent in a crisis and exhausting at a festival. A warden's word is
        a load-bearing structure. The order will spend individuals for the
        realm and has never pretended otherwise, which is the coldest thing
        about it and the most honest.
      likes:
        - of: character.griffin
          because: "The northern watch shares its logs. Half of warden doctrine is griffin weather."
        - of: npc.centaur
          because: "The roads are the realm's nervous system, and the centaurs run it faster than any signal tower."
      dislikes:
        - of: faction.deep_hollow_cult
          because: "The sky is watched so that nobody has to find out. The cult wants to find out."
        - of: creature.legend_dragon
          because: "An unaccountable power seated exactly where the watch points. Not an enemy. Somehow worse."
    relationships:
      headquarters: [location.redspire_citadel]
      territory: [biome.red_sky_foothills]
      enemies: [faction.deep_hollow_cult]
      quests: [quest.shattered_sky_rite]
      campaigns: [campaign.dawn_of_the_red_sky]
      members: []

  - id: faction.deep_hollow_cult
    asset_id: deep_hollow_cult
    title: "The Deep Hollow Cult"
    canon_status: intentionally_undefined
    canon_note: >-
      Per creature canon rules, named factions and political governments are not
      yet canon. This entry is a placeholder design for chapter-scoped content.
    faction_type: secret_society
    alignment: chaotic_neutral
    featured: false
    tags: [cult, underground, mystical, antagonist]
    short_description: >-
      A secretive group of scholars and mystics who believe the Crystal Heart
      holds the key to rewriting the world's broken laws.
    visual_identity: >-
      Dark robes with glowing crystal inlays, faceless masks with a single eye
      slit.
    common_story_uses: >-
      Antagonist faction, knowledge brokers, morally grey opposition.
    canon_constraints: >-
      Not purely evil — motivated by a desire to fix the world. Methods are
      extreme.
    standard_behavior: >-
      Operate in cells, communicate through crystal resonance, recruit the
      desperate.
    lore:
      hook: "They looked at the red sky and asked the question everyone else is sworn not to."
      story: >-
        The Deep Hollow Cult began as scholars who concluded, from evidence
        they will happily show you, that the world's laws are broken — the sky
        is the wrong color, memories walk the marsh, the dead do not always
        rest — and that somewhere beneath the realm is the power to set them
        right. In their own telling they are not villains but the only people
        brave enough to fix what everyone else has agreed to merely survive.
        The methods are where the telling and the truth part company.
      pastimes:
        - "Resonance choirs: chords rung through crystal that carry farther than voices, which is communication, worship, and — the cult insists — tuning."
        - "Evidence-collecting. Wisp sightings, restless-remains reports, tremor logs: annotated, cross-referenced, alarmingly thorough."
        - "Recruiting by kindness — finding the desperate before anyone else bothers to, which would be admirable if it stopped there."
      social: >-
        Cells, masks, and patience. A cult member met in daylight is likely
        the most sympathetic person in the room: curious, generous, and
        certain. The certainty is the tell. They do not argue that the world
        is broken; they wait for the day your own life demonstrates it, and
        they are always, unfailingly, there that day.
      likes:
        - of: creature.will_o_wisp
          because: "Exhibit A: a law of the world, visibly broken, wandering the marsh in public."
        - of: creature.restless_remains
          because: "Exhibit B, with footnotes."
      dislikes:
        - of: faction.skywardens
          because: "Watchers who guard a question instead of answering it."
        - of: npc.witch_order
          because: "The question-first rule — which the cult calls cowardice dressed as ethics, and the witches call the whole difference between them."
    relationships:
      headquarters: []
      territory: [location.skullwater_cave]
      enemies: [faction.skywardens]
      quests: [quest.crystal_heart_retrieval]
      campaigns: [campaign.echoes_beneath]
      items: [item.crystal_heart]
      members: []
