      dangerous_creatures: []
      legendary_beings: []
      supernatural_manifestations: []
    relationships:
      locations: [biome.open_sea]
      factions: []
      items: []
    notes:
      - "The islands drift, so their anchor represents their normal map area rather than a permanent position."
      - "They are not considered adjacent to the western coast for ordinary overland travel."

  - id: biome.enchanted_woods
