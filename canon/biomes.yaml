    map_label: "Enchanted Woods"
    canon_status: confirmed
    environment_type: biome_region
    climate: >-
      Temperate and humid beneath a dense canopy, with localized magical weather
      and light.
    danger_level: moderate
    featured: true
    tags: [ancient_forest, living_magic, changing_paths, memory, hidden_glades]
    map_provenance: map_canonical
    map_anchor: { x: 220, y: 395 }
    relative_position: west_central
    short_description: >-
      An ancient living forest whose paths, clearings, and hidden places respond
      to memory, promises, damage, and the behavior of those who enter.
    visual_identity: >-
      Immense layered trees, luminous knots and hollows, blue-green magical
      lights, tangled roots, mossy paths, hidden shrines, and depth that feels
      older than the surrounding realm.
    common_story_uses: >-
      Lost paths, remembered promises, damaged magic, old shrines, hidden
      communities, ecological mysteries, and choices where kindness changes the
      route.
    canon_constraints: >-
      The forest is responsive, not randomly hostile. It remembers treatment but
      does not assign morality by species. MossHome is inside the wider Woods and
      is not interchangeable with the whole region.
    standard_behavior: >-
      Paths shift gradually, magical disturbances echo through plants and
      wildlife, and the forest tends to reveal safer routes to travelers who
      repair harm or honor commitments.
