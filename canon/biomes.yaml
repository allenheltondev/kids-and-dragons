schema_version: "2.0"
document_type: red_sky_biome_canon
title: "The Realm of Red Sky Biome Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for every named environment shown on the
  current Realm of Red Sky world map. Use this file when planning chapters,
  locations, encounter themes, environmental storytelling, regional artwork,
  music, ambient behavior, or biome-specific game content.

agent_instructions:
  - Treat the current illustrated Realm of Red Sky map as the naming source of truth.
  - Every map label represented by an environmental art package appears exactly once in this file.
  - Preserve the distinctions between the Plains, Eastern Plains, and Sunward Fields.
  - Preserve the distinction between the Enchanted Woods and MossHome.
  - Mount Red Sky is not the dragonling homeland; dragonlings are native to the Red Sky Foothills.
  - The Exchange has no native or dominant people.
  - The Bone Yard has no ordinary permanent settlement.
  - The Expanse is intentionally unknown. Do not populate or explain it without an explicit canon decision.
  - An entry may be an environment used by the game without being a broad ecological biome.
  - Geography, borders, routes, and coordinates belong to the geography canon. This file owns environmental identity.
  - Creature ids reference red-sky-creature-canon.yaml and must not be invented here.
  - Empty inhabitant lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  map_provenance:
    map_canonical: "Directly placed and labeled on the current map."
    map_canonical_and_biome_matched: "Map-placed and matched to a biome canon entry."
    map_visible_name_pending: "Visible on the map but lacking a canonical proper name."
    map_implied: "Not drawn but implied by adjacency or map logic."
    visible_unlabeled_feature: "Visible on the map but not labeled."
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  environment_type:
    biome_region: "A broad ecological and travel region."
    aerial_region: "A broad region not fixed to the surface."
    offshore_region: "A broad island, reef, or marine environment."
    settlement_environment: "A named settlement with its own visual and encounter identity."
    landmark_environment: "A singular landmark or constrained area with its own environmental identity."
    gateway_environment: "An entrance to another world layer or much larger environment."
  danger_level:
    low: "Ordinary travel is usually safe with basic preparation."
    moderate: "Unprepared travelers can be harmed or stranded."
    high: "Travel normally requires planning, local knowledge, or protection."
    legendary: "The environment itself can support realm-scale threats or major campaign climaxes."
    unknown: "Danger is intentionally not established."

map_environment_ids:
  - sky_islands
  - enchanted_woods
  - mosshome
  - whispering_marsh
  - exchange
  - sunward_fields
  - plains
  - eastern_plains
  - stone_crossing
  - red_sky_foothills
  - mount_red_sky
  - expanse
  - frostfang_peaks
  - glacier_of_origins
  - skullwater_cave
  - mermaid_cove
  - bone_yard

biomes:
  - id: biome.sky_islands
    asset_id: sky_islands
    title: "Sky Islands"
    map_label: "Sky Islands"
    canon_status: confirmed
    environment_type: aerial_region
    climate: >-
      Cool, bright, and highly changeable; wind and cloud conditions matter more
      than seasons.
    danger_level: moderate
    featured: true
    tags: [aerial, drifting_islands, wind, temples, open_sky]
    map_provenance: map_canonical
    map_anchor: { x: 165, y: 235 }
    relative_position: west_offshore
    short_description: >-
      An archipelago of inhabited islands that drift across the western sky on
      recurring but imperfect wind routes.
    visual_identity: >-
      Floating stone islands, gold-roofed temple settlements, hanging roots, cloud
      banks, open blue distance, wind banners, and narrow aerial approaches.
    common_story_uses: >-
      Navigation, separated communities, changing routes, messenger journeys,
      weather emergencies, and stories whose destination is defined by when it can
      be reached rather than only where it is.
    canon_constraints: >-
      The islands move. Do not give them permanent surface borders or ordinary
      road connections. Do not portray every kitsune as deceptive.
    standard_behavior: >-
      Wind routes shift, island communities prepare for storms, and navigation
      depends on stars, recurring air currents, signals, and shared stories.
    borders: []
    access:
      mode: aerial
      fixed_routes: false
    inhabitants:
