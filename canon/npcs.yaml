schema_version: "2.0"
document_type: red_sky_supporting_people_canon
title: "The Realm of Red Sky Supporting Peoples"
updated: "2026-07-31"

purpose: >-
  Canonical, agent-readable reference for every sapient non-playable people and
  cultural order in the Realm of Red Sky. Use this file when planning NPC
  encounters, dialogue, regional population, cultural details, artwork, or any
  game content involving supporting peoples.

agent_instructions:
  - Do not portray an entire sapient people as inherently good, evil, hostile, foolish, or untrustworthy.
  - For sapient peoples, standard_behavior describes common cultural practices, not mandatory personality traits.
  - A homeland identifies cultural origin and population concentration, not an absolute border. Individuals may live, work, study, or travel elsewhere.
  - Species does not determine morality.
  - The Exchange has no native or dominant people.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.
  - Cultural orders are learned roles, not species or moral alignments.
  - "`speech_register` describes how a people generally sounds, not how any one of them must. It is there so a frogfolk met in chapter one and a frogfolk met in chapter six belong to the same civilization."
  - "This file holds *kinds* of person. One named person is an `individual` in individuals.yaml, and canon only has them when a location owns them - see that file's rules."
  - "`lore` describes the culture, not a mandate for any individual. `likes` and `dislikes` are history between kinds with a required `because` - a specific grievance or fondness a chapter can use, never a moral verdict about a people."

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  classification:
    supporting_people: "Sapient people used primarily for NPCs and world population."
    cultural_order: "A learned role or tradition that can include members of multiple peoples."
  sapience:
    sapient: "Person-level intelligence, language, culture, and moral agency."
    semi_sapient: "Problem solving and communication beyond ordinary wildlife without a full civilization."
  scale:
    tiny: "Fits in cupped hands."
    small: "Knee height on a person."
    small_to_medium: "Between knee and waist height."
    medium: "Person-sized."
    large: "Horse-to-wagon sized."
    very_large: "Fills a clearing; too big for a single combat tile."
    variable: "Size depends on the individual or manifestation."

people_ids:
  - centaur
  - faun
  - harvest_sprite
  - frogfolk
  - boggart
  - yeti
  - merfolk
  - selkie
  - stone_troll
  - witch_order

npcs:
  - id: npc.centaur
    asset_id: centaur
    title: "Centaur"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, plains, caravan, guide]
    scale: large
    short_description: >-
      Traveling plains people who guide caravans and preserve the realm's oldest
      overland routes.
    visual_identity: >-
      Humanoid upper body and equine lower body. Travel gear, route maps,
      messenger packs, and caravan colors.
    common_story_uses: >-
      Guide, courier, witness to trouble along the roads.
    canon_constraints: >-
      A homeland identifies cultural origin, not an absolute border. Individuals
      may live elsewhere.
    speech_register: >-
      Unhurried and factual. States distances, weather and trouble in the same
      tone. Does not repeat a warning twice.
    standard_behavior: >-
      Guides travelers, carries news, maintains camps and road markers, redirects
      caravans when routes change.
    lore:
      hook: "Ask one how far. You will get the distance, the weather, and one warning, once."
      story: >-
        Centaurs have walked the roads since before the roads were roads, and
        the old routes are taught to foals as songs — one verse per landmark,
        with the hazards in the chorus so nobody forgets them. A centaur's
        caravan sash is also a map, embroidered a stitch at a time over a
        working life, and reading a stranger's sash is how centaurs shake
        hands.
      pastimes:
        - "Sash embroidery. A route walked is a route stitched, and an elder's sash is a life you can read."
        - "Relay runs for the joy of it: how fast can news cross the realm? The record is disputed, loudly, at every campfire."
        - "The Shortcut Debate — a nine-generation argument about one hypothetical route through the foothills. No centaur alive believes it exists. No centaur alive will concede."
      social: >-
        Unhurried, factual, and impossible to alarm. A centaur states the
        distance, the weather, and the trouble in the same level tone, and
        never repeats a warning — the road is honest, and expects the same of
        you.
      likes:
        - of: creature.jackalope
          because: "A warren by the roadside means the road is healthy. Also, they pace the caravans, and nobody has ever admitted to racing back."
        - of: character.manticore
          because: "East of the river the road is theirs, and it is in good hands."
        - of: npc.stone_troll
          because: "A bridge kept is worth a hundred fords."
      dislikes:
        - of: creature.will_o_wisp
          because: "A light that moves travelers off the road is the exact opposite of a road marker."
    relationships:
      primary_locations: [biome.plains]
      secondary_locations: [biome.eastern_plains, biome.sunward_fields, location.exchange, location.stone_crossing]
      creatures: []
      items: []

  - id: npc.faun
    asset_id: faun
    title: "Faun"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, fields, farming, music]
    scale: medium
    short_description: >-
      Hooved farming people associated with orchards, music, communal work, and
      seasonal celebrations.
    visual_identity: >-
      Humanoid form with goat-like legs, ears, and variable horns. Practical farm
      clothing, tools, instruments, and sun motifs.
    common_story_uses: >-
      Farmer, festival organizer, neighbor facing a practical local problem.
    canon_constraints: >-
      Species does not determine morality.
    speech_register: >-
      Warm and rhythmic, forever half-singing. Turns any exchange into an
      invitation and any answer into an anecdote.
    standard_behavior: >-
      Plants, harvests, repairs irrigation, organizes shared meals, uses music to
      coordinate work.
    lore:
      hook: "The harvest is a song, and everyone is in the chorus whether they know it or not."
      story: >-
        Fauns farm the Sunward Fields in cooperatives older than money, and
        their music is not decoration — the beat is the schedule, the harmony
        is the division of labor, and a field's work-song tells you what stage
        the season is in from half a mile away. A faun who stops singing
        mid-verse has seen something worth stopping for, and every hand in
        earshot knows it.
      pastimes:
        - "Festival-inventing. First frost, last frost, a notably good pumpkin: the calendar has more festivals than days, which the fauns consider a scheduling triumph."
        - "Building instruments out of farm surplus — gourd-drums, seed-shakers, and the irrigation flute, which waters a row while you play it."
        - "Competitive pie diplomacy. Recipes are state secrets. Judges are bribed openly, in pie."
      social: >-
        Warm, rhythmic, and incapable of letting a stranger stand at the edge
        of anything. Every exchange becomes an invitation and every answer an
        anecdote; being adopted by a faun village takes roughly one meal.
      likes:
        - of: npc.harvest_sprite
          because: "The fields' other workers. A faun leaves the corner rows unpicked, and both parties call it good manners."
        - of: npc.centaur
          because: "The harvest goes somewhere and the news comes back. Also they can carry a drum you can climb inside."
        - of: creature.jackalope
          because: "The orchard's least useful employees, kept on for morale."
      dislikes:
        - of: npc.boggart
          because: "Every festival, exactly one pie. Always exactly one. They bake an extra now and set it slightly apart, and everyone involved maintains the fiction."
    relationships:
      primary_locations: [biome.sunward_fields]
      secondary_locations: [biome.plains, location.exchange, biome.enchanted_woods]
      creatures: []
      items: []

  - id: npc.harvest_sprite
    asset_id: harvest_sprite
    title: "Harvest Sprite"
    canon_status: confirmed
    classification: supporting_people
    sapience: semi_sapient
    featured: false
    tags: [supporting_people, fields, tiny, semi_sapient]
    scale: tiny
    short_description: >-
      Tiny field spirits who tend overlooked plants and reward careful stewardship.
    visual_identity: >-
      Tiny luminous or plant-like figures. Features and colors change with crop
      and season.
    common_story_uses: >-
      Environmental clue, tiny helper, indicator of a field's health.
    canon_constraints: >-
      Semi-sapient, not fully sapient. Hides from careless workers.
    speech_register: >-
      Small, earnest and over-explaining. Offers things nobody asked for and
      takes a refusal personally for about four seconds.
    standard_behavior: >-
      Tends unharvested patches, recovers dropped seeds, assists communities that
      leave food for small creatures.
    lore:
      hook: "The realm's smallest professionals, and by a wide margin its most serious."
      story: >-
        Harvest sprites tend everything the big folk overlook: the crooked
        row, the dropped seed, the plant behind the barn that nobody planted.
        No sprite has ever explained the arrangement, but communities that
        leave a little food out for small creatures find their fields doing
        better than arithmetic says they should, and no sprite will confirm
        the connection while sober enough to be quoted.
      pastimes:
        - "Competitive tidying. Two sprites, one messy row: it is a race now, and it was always a race."
        - "Riding jackalopes. Without the jackalope's knowledge. Briefly."
        - "Award ceremonies for plants. The season's best beetroot receives a small woven medal. Attendance is mandatory."
      social: >-
        Earnest, over-explaining, and heartbroken by refusal for about four
        seconds at a time. A sprite offers help nobody asked for, takes
        enormous pride in work nobody sees, and remembers every person who
        ever said thank you to something smaller than themselves.
      likes:
        - of: npc.faun
          because: "The only big folk whose work-songs have a verse for the small workers."
        - of: creature.mosshorn
          because: "An antler posting is the profession's highest honor: a garden that walks, with tenure."
      dislikes:
        - of: creature.jackalope
          because: "It eats the overlooked plants. The overlooked plants are the entire jurisdiction."
        - of: npc.boggart
          because: "Recovered items keep un-recovering. The paperwork is endless, and the paperwork is imaginary, and it is still endless."
    relationships:
      primary_locations: [biome.sunward_fields]
      secondary_locations: [biome.enchanted_woods, biome.plains]
      creatures: []
      items: []

  - id: npc.frogfolk
    asset_id: frogfolk
    title: "Frogfolk"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, marsh, amphibious, navigator]
    scale: small_to_medium
    short_description: >-
      Amphibious marsh people who maintain safe channels, reed settlements, and
      mist markers.
    visual_identity: >-
      Amphibious humanoid form with broad eyes and varied frog-like colors.
      Reed-woven clothing, pole boats, and mist lanterns.
    common_story_uses: >-
      Marsh guide, boat keeper, first witness to a changed waterway.
    canon_constraints: >-
      Closes routes when the whispers grow dangerous.
    speech_register: >-
      Very few words and long pauses that are not hesitation. Answers the
      question you meant instead of the one you asked.
    standard_behavior: >-
      Marks safe channels, monitors water levels, collects useful marsh plants,
      guides respectful travelers.
    lore:
      hook: "They know where the ground actually is. This is rarer than it sounds."
      story: >-
        The marsh is passable because frogfolk make it so: safe channels
        marked, mist lanterns kept, and routes closed the day the whispers
        change — not the day after. A frogfolk pause is not hesitation; it is
        the size of the true answer being checked before it is issued. They
        say little because the marsh says a great deal, and someone has to be
        listening.
      pastimes:
        - "Channel races, poled standing, no wakes allowed. Wakes wake things."
        - "Mist-lantern festivals on new-moon nights, when the marsh is darkest and, by long observation, at its most polite."
        - "Collecting rain-sounds. A really good roof is famous for three villages in every direction."
      social: >-
        Reserved and precise, with a hospitality that consists of getting you
        where you are going alive rather than telling you about it. A
        frogfolk who answers the question you meant instead of the one you
        asked is not being difficult; they are being efficient.
      likes:
        - of: creature.silver_otter
          because: "The river's other honest professionals. Boats and otters have traded right-of-way for a hundred years without one collision."
        - of: npc.stone_troll
          because: "Water people who keep their crossings. A kinship of maintenance."
        - of: npc.boggart
          because: "Neighbours. The frogfolk keep the paths; the boggarts keep everything that leaves them. The marsh works because both halves are done."
      dislikes:
        - of: creature.mire_mimic
          because: "Every marked channel it imitates is a review of frogfolk work, and the review is a trap."
    relationships:
      primary_locations: [biome.whispering_marsh]
      secondary_locations: [location.exchange]
      creatures: []
      items: []

  - id: npc.boggart
    asset_id: boggart
    title: "Boggart"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, marsh, collector, secretive]
    scale: small
    short_description: >-
      Small marsh-dwelling people who collect lost objects, secrets, and unusual
      sounds.
    visual_identity: >-
      Small, wiry silhouettes with marsh-colored skin, fur, or plant-like
      coverings. Collections of buttons, keys, shells, bells.
    common_story_uses: >-
      Unreliable-looking but truthful witness, keeper of a missing object,
      information trader.
    canon_constraints: >-
      Boggarts may be secretive or irritating, but they are not inherently
      malicious.
    speech_register: >-
      Sidelong and delighted. Trades in what it has overheard, never states a
      thing plainly when a hint will do.
    standard_behavior: >-
      Collects things the marsh has swallowed, trades information indirectly,
      tests whether strangers pay attention.
    lore:
      hook: "Nothing in the marsh is lost. It has simply changed management."
      story: >-
        Boggarts collect what the world drops: buttons, keys, bells, sounds,
        secrets. A boggart's collection is its memoir — ask about any button
        and you will get the story, though not necessarily the story you
        wanted, and never in order. They do not steal, a distinction boggarts
        consider obvious and everyone else considers ongoing: a thing on the
        ground has been filed under ground, and filing is a service.
      pastimes:
        - "Cataloguing, by systems that change weekly, are internally perfect, and have never once been explained to an outsider."
        - "Connoisseurship of overheard sentences. A really good one is retold at boggart gatherings for years, with attribution."
        - "Silent trade meets with silver otters, where nothing is said and everything is appraised."
      social: >-
        Sidelong, delighted, and constitutionally allergic to stating a thing
        plainly when a hint will do. A boggart tests whether you pay attention
        and rewards you in exact proportion to the result — which makes them
        the marsh's most honest people, hidden inside its most annoying ones.
      likes:
        - of: creature.will_o_wisp
          because: "A secret that tells itself, on schedule. Boggarts attend with notebooks."
        - of: creature.silver_otter
          because: "A fellow collector with excellent taste and no small talk."
        - of: character.kitsune
          because: "Stories with missing pieces — the collector's favorite kind. The trades are legendary and nobody has ever agreed on who won."
      dislikes:
        - of: npc.harvest_sprite
          because: "They return found things to their owners. On purpose. The waste is unspeakable."
        - of: creature.mire_mimic
          because: "It sits on the best salvage and pretends to be it."
    relationships:
      primary_locations: [biome.whispering_marsh]
      secondary_locations: [biome.enchanted_woods, location.exchange]
      creatures: []
      items: []

  - id: npc.yeti
    asset_id: yeti
    title: "Yeti"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, glacier, memory_keeper, patient]
    scale: large
    short_description: >-
      Patient ice-dwelling people who preserve and interpret memories trapped in
      the glacier.
    visual_identity: >-
      Large fur-covered form adapted to snow and ice. Layered cold-weather wraps,
      memory tokens, ice tools, and carved walking staffs.
    common_story_uses: >-
      Keeper of old knowledge, glacier guide, interpreter of an incomplete memory.
    canon_constraints: >-
      Deliberates carefully before acting.
    speech_register: >-
      Slow and enormous and gentle. Talks about people long dead as though
      they left the room a moment ago.
    standard_behavior: >-
      Inspects the glacier for exposed memories, guides visitors away from
      unstable ice, preserves old accounts.
    lore:
      hook: "The glacier remembers everything. The yetis are its reading room."
      story: >-
        Yetis read the ice. Memories catch in the glacier the way leaves catch
        in amber, and the yetis' whole slow civilization is arranged around
        finding them, interpreting them, and keeping them company. They speak
        of the long-dead as though they stepped out a moment ago because, from
        the glacier's point of view, they did — and a yeti sees no reason to
        take a shorter view than the thing it lives on.
      pastimes:
        - "Singing in halls carved from the ice — low songs, felt through the feet more than heard, some of them older than their words."
        - "Memory-walks: retracing a preserved moment on the surface where it happened, at the original pace, in the original weather if it can be arranged."
        - "Tea. Brewed from meltwater of a specific named year, for occasions that have earned it."
      social: >-
        Slow, enormous, and gentle, with a courtesy built for centuries: a
        yeti deliberates before speaking because it intends to stand by the
        sentence for a hundred years. Visitors are guided, fed, and remembered
        in unnerving detail on the next visit, forty years later.
      likes:
        - of: creature.snowhorn_goat
          because: "The mountains' own surveyors. When the herd reroutes, the yetis annotate."
        - of: character.griffin
          because: "The other half of every mountain rescue, and the fast half, which the yetis acknowledge without envy."
        - of: creature.will_o_wisp
          because: "A memory that got up and walked away. Professionally fascinating. Every one deserves an interview."
      dislikes:
        - of: creature.frost_wyrm
          because: "A thousand years of stratigraphy, ruined by one nest. The wyrms are ancient too, which somehow makes it worse."
    relationships:
      primary_locations: [biome.glacier_of_origins]
      secondary_locations: [biome.frostfang_peaks]
      creatures: []
      items: []

  - id: npc.merfolk
    asset_id: merfolk
    title: "Merfolk"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, ocean, reef, alliance]
    scale: medium
    short_description: >-
      Aquatic reef people who maintain Mermaid Cove and uphold an ancient
      alliance with the land.
    visual_identity: >-
      Aquatic humanoid form with fish-like tail and broad regional variation.
      Coral, shell, woven kelp motifs.
    common_story_uses: >-
      Reef guardian, keeper of an old treaty, messenger warning of a changed
      current.
    canon_constraints: >-
      Limited land mobility unless aided by established magic or equipment.
    speech_register: >-
      Formal, courteous, and precise about promises. Treats a casual agreement
      as binding and expects the same back.
    standard_behavior: >-
      Patrols reefs, rescues swimmers, repairs coral, participates in songs that
      help prevent the whirlpool from widening.
    lore:
      hook: "An alliance is not a mood. They will keep the agreement; that is what agreements are for."
      story: >-
        Merfolk keep Mermaid Cove, its reefs, and an alliance older than any
        surviving record of what, exactly, it was made against. The song
        circles are the center of everything — part choir, part civic
        engineering — and the old verses are sung precisely because nobody
        remembers what they hold shut, which the merfolk consider the strongest
        possible argument for not missing a night.
      pastimes:
        - "Song circles, nightly, attendance a joy and also the infrastructure."
        - "Reef-gardening: coral grown into archways, nurseries, and — for a visiting dignitary — furniture."
        - "The formal receiving of guests, an art form with tides in it. Rescued swimmers are technically guests, which surprises the swimmers."
      social: >-
        Courteous, precise about promises, and quietly warm underneath the
        protocol. A casual agreement is binding; they assume yours is too, and
        the resulting misunderstandings are the source of half the treaty's
        amendments. The merfolk keep a formal registry of grievances. It is
        currently empty. It is reviewed annually.
      likes:
        - of: npc.selkie
          because: "Treaty kin who take nothing seriously except the things that matter, in exactly the right order."
        - of: creature.reefglider
          because: "The song circles' faithful orbit. The singers pretend not to be flattered."
      dislikes: []
    relationships:
      primary_locations: [biome.mermaid_cove]
      secondary_locations: [location.exchange]
      creatures: []
      items: []

  - id: npc.selkie
    asset_id: selkie
    title: "Selkie"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: false
    tags: [supporting_people, coastal, shapeshifter, courier]
    scale: medium
    short_description: >-
      Seal-shifting coastal people who move easily between sea communities and
      the land.
    visual_identity: >-
      Seal form and land-going form connected by a personally significant seal
      coat. Travel-worn coastal clothing.
    common_story_uses: >-
      Sea-land courier, guide along the coast, witness connecting two communities.
    canon_constraints: >-
      A selkie's coat is part of their autonomy and must not be treated casually.
    speech_register: >-
      Easy and quick, switching register with the company. Tells the truth in
      a way that sounds like a joke.
    standard_behavior: >-
      Carries messages between sea and land, observes coastal changes, assists
      stranded travelers, carefully guards their coat.
    lore:
      hook: "Two shapes, one joke, always delivered on time."
      story: >-
        Selkies are the realm's couriers between two worlds that would
        otherwise only wave at each other. The coat is not a garment but a
        self, and everything in selkie culture flows from that one fact: where
        it hangs, who may touch it (no one), and the exact height of shelf
        that means I trust this house. A selkie tells the truth in a way that
        sounds like a joke, which keeps the truth portable.
      pastimes:
        - "Trading jokes up and down the coast. A joke's worth is measured in how far it traveled to reach you, and a really good one arrives salt-stained."
        - "Message-racing the tide: the letter must beat the water to the third rock. The letter usually wins. The occasions it did not are famous."
        - "Storm-swimming for fun, an activity every other people on the coast has independently classified as a rescue situation."
      social: >-
        Easy, quick, and register-shifting — a selkie talks to a merfolk
        elder, a dockhand, and a child in three different voices inside one
        minute, and means every word in all three. Their friendship is loyal
        and their coat is not a topic.
      likes:
        - of: npc.merfolk
          because: "Kin by treaty and temperament, the temperament being reliability. With jokes."
        - of: creature.silver_otter
          because: "Kindred spirits: swimmers who understand that an errand is improved by a detour."
      dislikes:
        - of: npc.boggart
          because: "No boggart has ever taken a coat. Every selkie hangs it higher near one anyway, and both peoples know it is not fair, and the shelf stays where it is."
    relationships:
      primary_locations: [biome.mermaid_cove]
      secondary_locations: [location.exchange]
      creatures: []
      items: []

  - id: npc.stone_troll
    asset_id: stone_troll
    title: "Stone Troll"
    canon_status: confirmed
    classification: supporting_people
    sapience: sapient
    featured: true
    tags: [supporting_people, river, bridgekeeper, masonry]
    scale: very_large
    short_description: >-
      Massive stone-skinned people known for patient judgment, masonry,
      bridgekeeping, and gateway stewardship.
    visual_identity: >-
      Large humanoid form with stone-like skin, lichen, cracks, and mineral
      variation. Masonry tools and carved tokens.
    common_story_uses: >-
      Bridgekeeper, patient judge, guardian who requires a non-monetary toll.
    canon_constraints: >-
      Stone trolls are not default enemies and do not habitually eat travelers.
    speech_register: >-
      Immensely slow to begin and then complete. Weighs a question out loud
      before answering it, and the answer is final.
    standard_behavior: >-
      Inspects bridges, repairs stonework, monitors river currents, requests
      stories or riddles as tolls.
    lore:
      hook: "The bridge stands because someone patient is under it. This is not a metaphor."
      story: >-
        Stone trolls keep the crossings — the masonry, the current-watch, and
        the judgment about who crosses and what it costs. The toll is never
        money and never cruel: a story, a riddle, a promise sized to the
        crosser, because a troll's real ledger is made of what people are
        carrying that isn't cargo. A troll begins a sentence the way other
        people begin a journey, and finishes it the same way: completely.
      pastimes:
        - "The riddle account with the manticore prides, maintained for generations and lovingly disputed from both ends of the bridge."
        - "Stone-listening: one palm flat on the bridge tells the day's whole traffic, and a good bridge is reread like a favorite book."
        - "Games of strategy played across seasons, one move per market day. Spectators bring grandchildren, then great-grandchildren."
      social: >-
        Immensely slow to begin and then complete. A troll weighs a question
        out loud before answering, and the answer is final — not from
        stubbornness, but because it was weighed. They are not default
        enemies, do not eat travelers, and are politely tired of the question.
      likes:
        - of: character.manticore
          because: "The riddle account, faithfully honored from both ends."
        - of: creature.echo_hunter
          because: "The deep tunnels' politest neighbor. They have never once met in a hurry."
        - of: creature.river_drake
          because: "A colleague in the crossing trade. The rates differ; the principle does not."
      dislikes:
        - of: creature.will_o_wisp
          because: "A bridge's entire argument is that the way is known. A light that argues otherwise makes work."
    relationships:
      primary_locations: [location.stone_crossing, location.skullwater_cave]
