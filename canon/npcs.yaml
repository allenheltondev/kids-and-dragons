  - id: npc.witch_order
    asset_id: witch_order
    title: "Witches"
    canon_status: confirmed
    classification: cultural_order
    sapience: sapient
    featured: false
    tags: [cultural_order, cross_species, magic, tradition]
    scale: variable
    short_description: >-
      A cross-species magical tradition rather than a separate people.
    visual_identity: >-
      No required body type; a witch may belong to any sapient people. Personal
      tools, ingredients, notebooks, charms.
    common_story_uses: >-
      Expert with incomplete knowledge, mentor, rival practitioner, cause or
      solver of a magical problem.
    canon_constraints: >-
      Witch is a learned role, not a species, gender, or moral alignment.
    speech_register: >-
      Careful and instructive. Asks what you actually want before saying what
      is possible, and never promises the first thing.
    standard_behavior: >-
      Studies specific forms of magic, trades remedies, investigates supernatural
      disruptions, disagrees about responsible practice.
    lore:
      hook: "Magic answers anyone who studies. This is the problem, and the witches are the ones who take it seriously."
      story: >-
        Witchcraft is a tradition, not a people: any of the realm's folk may
        learn, and the pointed hat fits every head that earns it. The real
        discipline is not the spellwork but the question asked before it —
        what do you actually want? — because most of the trouble a witch is
        called to fix began as an answer somebody skipped. Witches disagree
        with each other constantly, in the margins of each other's notebooks,
        as a form of quality control and, plainly, of affection.
      pastimes:
        - "Remedy fairs: part market, part conference, part elaborate excuse to read everyone else's annotations."
        - "Ingredient walks that take the long way, because the long way is where the ingredients are and the gossip is."
        - "Wisp-sitting: the practice of keeping a tangled memory company. Unglamorous, unpaid, and considered the truest work in the craft."
      social: >-
        Careful and instructive. A witch asks what you actually want before
        saying what is possible, never promises the first thing, and delivers
        exactly what was agreed — which is why people trust witches and why
        people are also slightly afraid of them, and why witches consider both
        reactions correct.
      likes:
        - of: creature.will_o_wisp
          because: "A patient, in the oldest sense. Some can be untangled and allowed to finish, and there is no better feeling in the craft."
        - of: npc.boggart
          because: "Suppliers of ingredients, rumors, and — twice now, at the exact crucial moment — a button."
        - of: npc.yeti
          because: "Fellow keepers of the principle that knowing something makes you responsible for it."
      dislikes:
        - of: faction.deep_hollow_cult
          because: "They skip the question. All of them. Every time."
    relationships:
      primary_locations: [biome.whispering_marsh]
      secondary_locations: [biome.enchanted_woods, location.exchange, biome.sunward_fields]
      creatures: []
      items: []
