schema_version: "2.0"
document_type: red_sky_campaign_canon
title: "The Realm of Red Sky Campaign Canon"
updated: "2026-07-31"

purpose: >-
  Canonical, agent-readable reference for campaign arcs in the Realm of Red Sky.
  Use this file when planning campaign structure, chapter progression, narrative
  arcs, or any game content involving the overarching player experience across
  multiple quests and locations.

agent_instructions:
  - Campaigns structure the player experience across multiple quests, locations, and factions.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - These campaign entries are placeholder designs pending explicit canon approval. They may be used for chapter-scoped content but carry no canon weight outside that scope.
  - Campaign narratives should support the child-hero tone: danger, loss, and mystery are appropriate, but emphasize courage, curiosity, consequences, cooperation, and repair.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  campaign_type:
    main_story_arc: "The primary narrative campaign."
    side_story_arc: "An optional campaign providing additional depth."

campaign_ids:
  - dawn_of_the_red_sky
  - echoes_beneath
  - gemfall

campaigns:
  - id: campaign.dawn_of_the_red_sky
    asset_id: dawn_of_the_red_sky
    title: "Dawn of the Red Sky"
    canon_status: intentionally_undefined
    canon_note: >-
      This campaign references non-canon factions and named characters. It is a
      placeholder design for chapter-scoped content pending canon approval.
    campaign_type: main_story_arc
    chapter_count: 5
    featured: true
    tags: [main_campaign, highlands, epic, skywardens]
    short_description: >-
      The primary campaign following a hero's journey to uncover why the sky
      turned red and whether it can be restored.
    visual_identity: >-
      Epic vista of the foothills with a highland fortress silhouetted against a
      blood-red sky.
    common_story_uses: >-
      Core narrative backbone, faction introduction, world-building vehicle.
    canon_constraints: >-
      Must be completable regardless of faction choices. The sky's origin is
      revealed in chapter 4.
    standard_behavior: >-
      Linear progression with branching side content per chapter.
    relationships:
      factions: [faction.skywardens]
      quests: [quest.shattered_sky_rite]
      locations: [location.redspire_citadel]
      biomes: [biome.red_sky_foothills]
      items: [item.crimson_shard]
      creatures: []

  - id: campaign.echoes_beneath
    asset_id: echoes_beneath
    title: "Echoes Beneath"
    canon_status: intentionally_undefined
    canon_note: >-
      This campaign references non-canon factions and named characters. It is a
      placeholder design for chapter-scoped content pending canon approval.
    campaign_type: side_story_arc
    chapter_count: 3
    featured: false
    tags: [side_campaign, underground, mystery, cult]
    short_description: >-
      A darker campaign exploring the deep caverns and a secretive group's plan
      to use the Crystal Heart to reshape reality.
    visual_identity: >-
      Underground cathedral of crystals with ritualists performing a ceremony
      around the floating Crystal Heart.
    common_story_uses: >-
      Alternative perspective, antagonist backstory, moral complexity.
    canon_constraints: >-
      Can be played alongside or after the main campaign. Reveals antagonist
      motivations as sympathetic.
    standard_behavior: >-
      Non-linear exploration with reputation-gated content.
    relationships:
      factions: [faction.deep_hollow_cult]
      quests: [quest.crystal_heart_retrieval]
      locations: [location.skullwater_cave]
      biomes: []
      items: [item.crystal_heart]
      creatures: []

  - id: campaign.gemfall
    asset_id: gemfall
    title: "Gemfall"
    canon_status: newly_defined
    canon_note: >-
      The authored main arc for the treasure-rush storyline. The titan beneath
      Mount Red Sky and the exact nature of the seal are campaign-scoped
      mysteries pending full canon approval; the chapter breakdown lives in
      docs/campaigns/gemfall.md and considers the lore blocks authored across
      the canon corpus.
    campaign_type: main_story_arc
    chapter_count: 8
    featured: true
    tags: [main_campaign, treasure_rush, mount_red_sky, seal, exchange, gemfall]
    short_description: >-
      A violent eruption from Mount Red Sky scatters powerful gemstones across
      the realm and launches the largest treasure rush in living memory - but
      the stones are fragments of an ancient seal, and every one carried away
      weakens it.
    visual_identity: >-
      A red-lit eruption raining gem-light across the realm while caravans and
      ships converge on a coastal city below; late chapters trade gold-rush
      bustle for ash, tremor light, and the inside of the mountain.
    common_story_uses: >-
      The realm-spanning main arc: a treasure hunt that becomes a race to
      understand the treasure, crossing five biomes and ending inside Mount Red
      Sky with a choice that renames the party for good.
    canon_constraints: >-
      The party begins ordinary - no chosen heroes. The Hollow Gate cannot be
      opened in this arc; it foreshadows. Factions and named leads remain
      chapter-scoped per faction canon. Whether history remembers the party as
      the Heroes of Red Sky or the treasure hunters who woke the mountain is
      decided by play, not by the script.
    standard_behavior: >-
      Linear chapter spine with a branching middle: the Stone Crossing outcome
      changes how the marsh chapter begins, not whether the story continues.
      Failure reroutes; it never stops the campaign.
    relationships:
      biomes:
        - biome.sunward_fields
        - biome.plains
        - biome.whispering_marsh
        - biome.enchanted_woods
        - biome.red_sky_foothills
        - biome.eastern_plains
      locations:
        - location.exchange
        - location.bramblewood
        - location.stone_crossing
        - location.hollow_gate
        - location.mosshome
        - location.redspire_citadel
        - location.mount_red_sky
      creatures:
        - creature.river_drake
        - creature.mire_mimic
        - creature.will_o_wisp
        - creature.cinder_wolf
        - creature.embermoth
        - creature.glassback_crab
        - creature.legend_dragon
      factions:
        - faction.skywardens
        - faction.deep_hollow_cult
      items:
        - item.crimson_shard
      quests: []
