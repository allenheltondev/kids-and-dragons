    danger_level: high
    featured: true
    tags: [offshore_cave, underground_gateway, skull_rock, caverns, unknown_depths]
    map_provenance: map_canonical
    map_anchor: { x: 945, y: 370 }
    relative_position: east_offshore
    short_description: >-
      A skull-shaped offshore opening that leads into a much larger underground
      world whose full extent has not yet been canonized.
    visual_identity: >-
      A single colossal skull-shaped rock, dark cave mouth, slick ledges, breaking
      waves, deep interior shadows, mineral reflections, and passages disappearing
      underground.
    common_story_uses: >-
      Descent into the underground, missing expeditions, echoes, hidden passages,
      creatures moving between layers, rescue, and campaign transitions into a
      separate subterranean geography.
    canon_constraints: >-
      The skull is one continuous rock formation, not a pile of skulls. Do not
      define the entire underground world through this entry; it requires its own
      geography layer and future canon.
    standard_behavior: >-
      Tides affect the entrance, sound travels unpredictably, and deeper passages
      should feel larger than the visible island mouth implies.
