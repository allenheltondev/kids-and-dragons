  - id: location.redspire_citadel
    asset_id: redspire_citadel
    title: "Redspire Citadel"
    canon_status: intentionally_undefined
    canon_note: >-
      This location is tied to the Skywardens faction which is not yet canon. The
      location design is a placeholder for chapter-scoped content.
    location_type: fortress
    parent_biome: biome.red_sky_foothills
    featured: true
    tags: [fortress, skywardens, highlands, hub]
    short_description: >-
      A towering obsidian fortress perched on the highest peak of the foothills,
      headquarters of the Skywardens.
    visual_identity: >-
      Black stone tower with violet-lit windows, crimson banners, lightning rods
      crackling with energy.
    common_story_uses: >-
      Hub location, quest start and end point, safe haven, faction headquarters.
    canon_constraints: >-
      Always accessible to players. Cannot be destroyed in narrative.
    standard_behavior: >-
      Bustling with activity during day, eerily quiet at night except for the
      forge.
    lore:
      origin: >-
        As the wardens tell it, the citadel was raised on the highest peak of
        the foothills for one purpose - to watch the red sky - and every stone
        of it faces upward. Records of the construction itself are sparse,
        which the order attributes to the builders having been busy.
      recorded_history: >-
        Four centuries of watch rotations, forge-nights, and ledgers - above
        all the ledgers. The citadel's history is deliberately uneventful, and
        the order maintains that this is the finest record any fortress has
        ever compiled.
      cultural_significance: >-
        The foothills' fixed point: caravans navigate by its silhouette,
        locals set their clocks by the watch-horns, and the whole region
        sleeps a little easier for the violet windows burning overnight -
        without, if pressed, being able to say precisely what the wardens are
        watching for. Neither, precisely, can the wardens.
      common_beliefs:
        - "As long as the forge smoke rises, the realm is fine. The day it stops, ask questions."
        - "Somewhere below the citadel is a sealed vault the oaths are about. Wardens neither confirm nor deny, mostly because they were recruits once and would also like to know."
      disputed_beliefs:
        - "What the founding oath was first sworn against. The order's own records decline to say, and the order regards the declining as the records doing their job."
      hidden_truths: []
      regional_relationships:
        - place: biome.red_sky_foothills
          relationship: >-
            Protector and tenant: the citadel watches the sky for the region,
            and the region keeps the citadel fed, informed, and supplied with
            recruits who think the job is about swords.
        - place: location.mount_red_sky
          relationship: >-
            The watch points at the sky, but the windows face the mountain
            too. The order has never said whether that is architecture or
            policy.
      current_tensions:
        - "Gemfall has stretched the patrols thin exactly when the foothills got crowded, and the order is discovering that a boom is harder to watch than a mystery."
      historical_hooks:
        - "One year's ledger is bound in a different color and reads, in its entirety, like every other year's. The one question every recruit asks about it receives the traditional answer: 'nothing.'"
        - "An ember storm is due - the old hands can feel it - and the last one is just far enough back that only the ledgers remember what the rite requires."
    relationships:
      biome: [biome.red_sky_foothills]
      factions: [faction.skywardens]
      quests: [quest.shattered_sky_rite]
      campaigns: [campaign.dawn_of_the_red_sky]
      creatures: []
      items: []

  - id: location.hollow_gate
    asset_id: hollow_gate
    title: "The Hollow Gate"
    canon_status: intentionally_undefined
    canon_note: >-
      An unresolved mystery location. Its purpose and history are intentionally
      protected pending future canon development.
    location_type: ancient_ruins
    parent_biome: biome.whispering_marsh
    featured: false
    tags: [ruins, marsh, portal, mysterious]
    short_description: >-
      A crumbling stone archway in the heart of the Whispering Marsh, said to be a
      sealed portal to the world before the red sky.
    visual_identity: >-
      Moss-covered stone arch with faintly glowing runes, surrounded by dead trees
      in a circle of still water.
    common_story_uses: >-
      Mystery location, late-game revelation, lore discovery, potential future
      content.
    canon_constraints: >-
      Cannot be opened in current campaign arc. Serves as foreshadowing only.
    standard_behavior: >-
      Runes glow brighter when the red sky intensifies, whispers grow louder near
      it.
    lore:
      origin: >-
        Not established, and carefully so. The arch was already ancient when
        the marsh first had visitors to notice it, and every attempt to date
        it has concluded, in more careful words, "before us." The whispers
        pile up near the arch, which is how it was found and why it is
        avoided.
      recorded_history: >-
        The Gate's recorded history is a record of nothing happening, kept
        nervously: it has never opened, never moved, and never done anything
        but glow - and the glow keeping time with the red sky is the most
        thoroughly studied non-event in the realm.
      cultural_significance: >-
        The realm's most respected closed door. Witches study it from a
        distance, frogfolk route the channels around it, and the phrase "said
        to be" does more work in sentences about the Gate than anywhere else
        in the realm.
      common_beliefs:
        - "It is a sealed portal to the world before the red sky. This is what everyone says, and what nobody can source."
        - "You do not knock. Whatever the Gate is, the one thing every people agrees on is that it is not to be knocked on."
      disputed_beliefs:
        - "Door, warning, monument, or lock - and if a lock, on which side. The theories are ancient, incompatible, and equally unencumbered by evidence."
      hidden_truths: []
      regional_relationships:
        - place: biome.whispering_marsh
          relationship: >-
            The marsh holds the Gate the way one holds a thing whose owner may
            return: channels routed around it, whispers thickest near it, and
            the frogfolk's markers giving it the widest, politest berth in the
            marsh.
      current_tensions:
        - "The runes have been brighter this year, and the whispers near the arch have changed pitch - facts nobody connects out loud, and everyone connects."
        - "Since the Gemfall, more than one visitor has noticed that the runes' hum and the scattered gemstones' hum are the same hum. The witches took notes. The notes are not circulating."
      historical_hooks:
        - "The circle of still water around the arch does not flood, freeze, or drain, whatever the marsh does around it - a fact so old it reads as scenery, until you think about it."
    relationships:
      biome: [biome.whispering_marsh]
      factions: []
      quests: []
      campaigns: []
      creatures: []
      items: [item.hollow_crown_shard]

