schema_version: "2.0"
document_type: red_sky_location_canon
title: "The Realm of Red Sky Location Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for named locations within biomes of the
  Realm of Red Sky. Use this file when planning dungeon layouts, points of
  interest, quest destinations, location artwork, or any game content involving
  specific named places that exist within the broader biome regions.

agent_instructions:
  - Locations exist within biomes; the biome canon owns environmental identity and ecology.
  - Do not invent new locations without explicit canon approval.
  - Locations controlled by non-canon factions inherit the faction's intentionally_undefined status.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  map_provenance:
    map_canonical: "Directly placed and labeled on the current map."
    map_canonical_and_biome_matched: "Map-placed and matched to a biome canon entry."
    map_visible_name_pending: "Visible on the map but lacking a canonical proper name."
    map_implied: "Not drawn but implied by adjacency or map logic."
    visible_unlabeled_feature: "Visible on the map but not labeled."
  danger_level:
    none: "Not normally dangerous."
    low: "May inconvenience or frighten but rarely causes serious harm."
    moderate: "Can harm unprepared travelers."
    high: "A serious threat requiring planning, escape, or cooperation."
    legendary: "Potentially realm-changing or suitable for a major story climax."
    unknown: "Deliberately not established."
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  location_type:
    settlement_region: "A named settlement embedded in a larger region."
    coastal_trade_city: "A trade settlement on the coast."
    river_crossing_settlement: "A settlement at a constrained river crossing."
    offshore_dungeon_landmark: "An offshore or underground landmark site."
    volcanic_landmark_region: "A singular volcanic landmark with its own visual family."
    town: "A settled community people live in, smaller than a city."
    ocean_hazard: "A dangerous water feature that behaves as a place."
    fortress: "A defensible structure or military installation."
    underground_sanctum: "A hidden or subterranean sacred space."
    ancient_ruins: "Remnants of an older civilization or structure."
    river_mouth_landmark: "A landmark built by normal river and coastal deposition where a river meets the sea."

location_ids:
  - redspire_citadel
  - hollow_gate
  - bone_yard

