schema_version: "2.0"
document_type: red_sky_location_canon
title: "The Realm of Red Sky Location Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for named locations within biomes of the
  Realm of Red Sky. Use this file when planning dungeon layouts, points of
  interest, quest destinations, location artwork, or any game content involving
  specific named places that exist within the broader biome regions.

agent_instructions:
  - Locations exist within biomes; the biome canon owns environmental identity and ecology.
  - Do not invent new locations without explicit canon approval.
  - Locations controlled by non-canon factions inherit the faction's intentionally_undefined status.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.

controlled_values:
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  location_type:
    town: "A settled community people live in, smaller than a city."
    ocean_hazard: "A dangerous water feature that behaves as a place."
    fortress: "A defensible structure or military installation."
    underground_sanctum: "A hidden or subterranean sacred space."
    ancient_ruins: "Remnants of an older civilization or structure."

location_ids:
  - redspire_citadel
  - crystal_font
  - hollow_gate

locations:
  - id: location.redspire_citadel
    asset_id: redspire_citadel
    title: "Redspire Citadel"
    canon_status: intentionally_undefined
    canon_note: >-
      This location is tied to the Skywardens faction which is not yet canon.
      The location design is a placeholder for chapter-scoped content.
    location_type: fortress
    parent_biome: biome.red_sky_foothills
    featured: true
    tags: [fortress, skywardens, highlands, hub]
    short_description: >-
      A towering obsidian fortress perched on the highest peak of the foothills,
      headquarters of the Skywardens.
    visual_identity: >-
      Black stone tower with violet-lit windows, crimson banners, lightning rods
      crackling with energy.
    common_story_uses: >-
      Hub location, quest start and end point, safe haven, faction headquarters.
    canon_constraints: >-
      Always accessible to players. Cannot be destroyed in narrative.
    standard_behavior: >-
      Bustling with activity during day, eerily quiet at night except for the forge.
    relationships:
      biome: [biome.red_sky_foothills]
      factions: [faction.skywardens]
      quests: [quest.shattered_sky_rite]
      campaigns: [campaign.dawn_of_the_red_sky]
      creatures: []
      items: []

  - id: location.crystal_font
    asset_id: crystal_font
    title: "The Crystal Font"
    canon_status: intentionally_undefined
    canon_note: >-
      This location is tied to the Deep Hollow Cult faction which is not yet
      canon. The location design is a placeholder for chapter-scoped content.
    location_type: underground_sanctum
    parent_biome: biome.skullwater_cave
    featured: false
    tags: [underground, sacred, crystal, cult_base]
    short_description: >-
      A hidden cathedral deep within the caverns where resonance rituals are
      conducted.
    visual_identity: >-
      Vast cavern with a central crystal fountain emanating violet light,
      surrounded by carved pillars.
    common_story_uses: >-
      Dungeon location, quest objective, faction base, boss arena.
    canon_constraints: >-
      Hidden — requires navigation or guidance to find. Magical wards prevent
      scrying.
    standard_behavior: >-
      Crystal formations here grow faster than elsewhere, reshaping the space
      over weeks.
    relationships:
      biome: [biome.skullwater_cave]
      factions: [faction.deep_hollow_cult]
      quests: [quest.crystal_heart_retrieval]
      campaigns: [campaign.echoes_beneath]
      creatures: []
      items: [item.crystal_heart]

  - id: location.hollow_gate
    asset_id: hollow_gate
    title: "The Hollow Gate"
    canon_status: intentionally_undefined
    canon_note: >-
      An unresolved mystery location. Its purpose and history are intentionally
      protected pending future canon development.
    location_type: ancient_ruins
    parent_biome: biome.whispering_marsh
    featured: false
    tags: [ruins, marsh, portal, mysterious]
    short_description: >-
      A crumbling stone archway in the heart of the Whispering Marsh, said to be
      a sealed portal to the world before the red sky.
    visual_identity: >-
      Moss-covered stone arch with faintly glowing runes, surrounded by dead
      trees in a circle of still water.
    common_story_uses: >-
      Mystery location, late-game revelation, lore discovery, potential future
      content.
    canon_constraints: >-
      Cannot be opened in current campaign arc. Serves as foreshadowing only.
    standard_behavior: >-
      Runes glow brighter when the red sky intensifies, whispers grow louder
      near it.
    relationships:
      biome: [biome.whispering_marsh]
      factions: []
      quests: []
      campaigns: []
      creatures: []
      items: []

  - id: location.the_whirlpool
    title: "The Whirlpool"
    canon_status: newly_defined
    location_type: ocean_hazard
    parent_biome: biome.open_sea
    featured: false
    tags: [ocean, hazard, current, offshore]
    short_description: >-
      A standing spiral of water offshore, visible from the Bone Yard and Mermaid
      Cove coasts.
    visual_identity: >-
      A wide turning ring of dark water, calm at its rim and loud at its centre.
    common_story_uses: >-
      A hazard to cross or go around, something that carries a boat somewhere it
      did not mean to go, a landmark visible from two coasts.
    canon_constraints: >-
      Dangerous by current, not by intent. It is a place, not a creature.
    standard_behavior: >-
      Turns steadily; strengthens with weather and tide.
    relationships:
      biome: [biome.open_sea]
      creatures: []
      factions: []
      items: []
      quests: []
      campaigns: []

  - id: location.bramblewood
    title: "Bramblewood"
    canon_status: newly_defined
    location_type: town
    parent_biome: biome.sunward_fields
    featured: false
    tags: [town, hedges, sunward_fields, waystop]
    short_description: >-
      A hedged town about two thirds of the way through the Sunward Fields,
      furthest from the Exchange.
    visual_identity: >-
      Thorn hedges grown into walls and doorways, roofs showing above them, paths
      that turn more often than they need to.
    common_story_uses: >-
      A first waystop, somewhere to be let into, a town whose hedges decide who
      gets through.
    canon_constraints: >-
      The hedges are grown and tended, not wild. Bramblewood is a place people
      live, not a wood with a name.
    standard_behavior: >-
      The hedges are kept by the people who live behind them, and the paths
      through them change with the season.
    relationships:
      biome: [biome.sunward_fields]
      creatures: []
      factions: []
      items: []
      quests: []
      campaigns: []
