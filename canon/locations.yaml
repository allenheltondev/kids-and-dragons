schema_version: "2.0"
document_type: red_sky_location_canon
title: "The Realm of Red Sky Location Canon"
updated: "2026-08-01"

purpose: >-
  Canonical, agent-readable reference for named locations within biomes of the
  Realm of Red Sky. Use this file when planning dungeon layouts, points of
  interest, quest destinations, location artwork, or any game content involving
  specific named places that exist within the broader biome regions.

agent_instructions:
  - Locations exist within biomes; the biome canon owns environmental identity and ecology.
  - Do not invent new locations without explicit canon approval.
  - Locations controlled by non-canon factions inherit the faction's intentionally_undefined status.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version.
  - Empty relationship lists are deliberate; they do not authorize an agent to fill the gap.
  - "`lore` is the storyteller's half of a place: its accepted origin, its recorded past, and its reputation. `origin`, `recorded_history`, and `cultural_significance` are in-world common knowledge. `common_beliefs` and `disputed_beliefs` are what people *say*, and are allowed to be wrong - a superstition is canon about the believers, not the place. `hidden_truths` are creator canon: a story may build toward one, but no NPC recites one, and on an `intentionally_undefined` entry the list stays empty so the protected mystery stays protected. `regional_relationships.place` is a validated reference; the `relationship` prose is the story hook."

controlled_values:
  map_provenance:
    map_canonical: "Directly placed and labeled on the current map."
    map_canonical_and_biome_matched: "Map-placed and matched to a biome canon entry."
    map_visible_name_pending: "Visible on the map but lacking a canonical proper name."
    map_implied: "Not drawn but implied by adjacency or map logic."
    visible_unlabeled_feature: "Visible on the map but not labeled."
  danger_level:
    none: "Not normally dangerous."
    low: "May inconvenience or frighten but rarely causes serious harm."
    moderate: "Can harm unprepared travelers."
    high: "A serious threat requiring planning, escape, or cooperation."
    legendary: "Potentially realm-changing or suitable for a major story climax."
    unknown: "Deliberately not established."
  canon_status:
    confirmed: "Directly established by worldbuilding decisions and prior canon."
    newly_defined: "Added as canon in this inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  location_type:
    settlement_region: "A named settlement embedded in a larger region."
    coastal_trade_city: "A trade settlement on the coast."
    river_crossing_settlement: "A settlement at a constrained river crossing."
    offshore_dungeon_landmark: "An offshore or underground landmark site."
    volcanic_landmark_region: "A singular volcanic landmark with its own visual family."
    town: "A settled community people live in, smaller than a city."
    ocean_hazard: "A dangerous water feature that behaves as a place."
    fortress: "A defensible structure or military installation."
    underground_sanctum: "A hidden or subterranean sacred space."
    ancient_ruins: "Remnants of an older civilization or structure."
    river_mouth_landmark: "A landmark built by normal river and coastal deposition where a river meets the sea."

location_ids:
  - redspire_citadel
  - hollow_gate
  - bone_yard

locations:
  - id: location.mosshome
    asset_id: mosshome
    title: "MossHome"
    map_label: "MossHome"
    canon_status: confirmed
    location_type: settlement_region
    parent_biome: biome.enchanted_woods
    climate: Sheltered, damp, and mild beneath the oldest western trees.
    danger_level: low
    featured: true
    tags: [forest_settlement, living_architecture, bigfoot, cultivated_moss, ancient_trees]
    map_provenance: map_canonical
    map_anchor: { x: 115, y: 525 }
    short_description: >-
      The principal Bigfoot settlement, built into and alongside ancient living
      trees without severing the forest systems that support it.
    visual_identity: >-
      Tall wooden and stone structures woven into trunks and roots, cultivated
      moss gardens, suspended walkways, natural archives, and warm lights beneath
      the canopy.
    common_story_uses: >-
      Research, healing, historical discovery, community preparation, ecological
      investigation, and a safe home that can reveal changes elsewhere in the
      forest.
    canon_constraints: >-
      MossHome is a settlement, not a separate wilderness biome. Bigfoots are not
      primitive or universally reclusive, and the settlement should look designed,
      maintained, and knowledgeable.
    standard_behavior: >-
      Residents maintain living structures, paths, gardens, historical records,
      and observation stations while monitoring changes in the wider Enchanted
      Woods.
    lore:
      origin: >-
        The accepted account, preserved in the settlement's own archive, is
        that the first bigfoot families asked the trees, and the asking took
        forty years. The founding agreement survives in full, and visitors are
        sometimes disappointed to learn that its clauses are mostly about
        compost.
      recorded_history: >-
        MossHome's history is the archive: path-records, plant journals,
        weather memory, and the settlement's own growth rings, kept
        continuously since founding. The famous entry is the Reshelving -
        every path in the Woods moved in one night, and the archive's marginal
        note, in an unidentified hand, reads "expected."
      cultural_significance: >-
        The realm's memory of the west. Healers, historians, and the politely
        desperate come to consult records nobody else thought to keep: which
        winters the moths came early, what the marsh whispered forty years
        ago, how long a promise has left to run.
      common_beliefs:
        - "Do not eat the record. The calendar gardens are the week, the month, and dessert only by archival approval."
        - "A door grown shut is an answer. You may ask again next season."
        - "If a mosshorn naps against your work, the work is good. This is peer review, and it is binding."
      disputed_beliefs:
        - "Whether the settlement chose the site or the site chose the settlement. The archive holds both accounts, in different hands, dated the same day."
      hidden_truths:
        - "One shelf of the archive is written in cultivated moss - living documents that must be watered to stay legible. One is in a strain nobody now living can read, and it is watered anyway, on schedule, because you do not let a book die for being difficult."
      regional_relationships:
        - place: biome.enchanted_woods
          relationship: >-
            Steward and tenant at once: MossHome keeps the forest's records
            and the forest keeps MossHome, and the founding agreement is
            honored so thoroughly that neither party has needed to reread it.
        - place: biome.whispering_marsh
          relationship: >-
            Downhill neighbors and professional colleagues: marsh herbs come
            up, remedies and flood-warnings go down, and the archivists trade
            notes with the witches in the margins of each other's books.
        - place: location.exchange
          relationship: >-
            The city sends its unanswerable questions west by caravan, and
            MossHome sends back answers, corrections, and the occasional
            polite observation that the question was wrong.
      current_tensions:
        - "Gemfall expeditions keep arriving with maps of the Woods that MossHome did not draw, asking for corrections the archivists are not sure the forest wants made."
        - "A chair has come out wrong. Nine years of growing, and it leans. The grower insists the tree did it on purpose, and the archive has opened a file."
      historical_hooks:
        - "The founding agreement's compost clauses include one measure that has never once been invoked. The elders know it by heart and do not say it aloud."
        - "The unreadable moss document has begun, for the first time in the records, to flower."
    adjacent_to: [biome.whispering_marsh]
    inhabitants:
      primary_peoples: [character.bigfoot]
      supporting_peoples: []
      cultural_orders: []
      ambient_creatures: [creature.mosshorn]
      dangerous_creatures: []
      legendary_beings: []
      supernatural_manifestations: []
    relationships:
      locations: [biome.enchanted_woods]
      factions: []
      items: []
      biome: [biome.enchanted_woods]
      creatures: []
      quests: []
      campaigns: []
    notes:
      - Home of the Bigfoot.
      - "It is geographically embedded in the western ancient forest rather than a separate continent-scale biome."

  - id: location.mount_red_sky
    asset_id: mount_red_sky
    title: "Mount Red Sky"
    map_label: "Mount Red Sky"
    canon_status: confirmed
    location_type: volcanic_landmark_region
    parent_biome: biome.red_sky_foothills
    climate: >-
      Extreme heat, ash, volcanic gases, and rapidly changing local conditions.
    danger_level: legendary
    featured: true
    tags: [active_volcano, gemfalls, legendary, ash, lava, unstable_power]
    map_provenance: map_canonical
    map_anchor: { x: 465, y: 325 }
    short_description: >-
      The active volcano at the center of the realm, source of the Gemfalls and
      territory of rare solitary legendary beasts.
    visual_identity: >-
      Towering volcanic cone, orange lava channels, black ridges, smoke column,
      gemstone flashes, ash-darkened sky, and terrain that visibly radiates power.
    common_story_uses: >-
      Major campaign climaxes, legendary-beast encounters, eruption mysteries,
      dangerous rescues, gemstone events, and consequences that affect several
      regions.
    canon_constraints: >-
      Mount Red Sky is not a dragonling city or homeland. Adult legend dragons are
      rare solitary beings and are not automatically ancestors or rulers of
      dragonlings.
    standard_behavior: >-
      Activity changes through tremors, smoke, heat, Gemfalls, and lava movement.
      Calm periods remain tense because the mountain is never treated as
      permanently dormant.
    lore:
      origin: >-
        The accepted account is that the mountain is where the realm keeps its
        fire, and that it was burning before there was anyone to name it. It
        named the realm rather than the other way around, and everything else
        about its origin is told in stories that begin with "they say" and end
        a safe distance away.
      recorded_history: >-
        The mountain's history is kept by its neighbors: the dragonlings'
        eruption tallies, the gatherers' records of Gemfalls, and four
        centuries of watch ledgers observing, in essence, that it is still
        there. The mountain itself keeps no records that anyone has read.
      cultural_significance: >-
        The center of the realm by geography, gravity, and reputation. Its
        Gemfalls fund the foothills, its moods set the region's calendar, and
        its silhouette is the first thing every mapmaker draws and the last
        thing every traveler stops checking over their shoulder.
      common_beliefs:
        - "The mountain drops what it means to drop. Everything else, it is holding."
        - "Never thank the mountain out loud. It might take an interest."
        - "A Gemfall is taken with open hands or not at all. A closed fist on the mountain is the oldest bad luck there is."
      disputed_beliefs:
        - "Whether the legend dragon is the mountain's tenant, warden, or prisoner. All three theories are held with confidence. The dragon has heard all three and commented on none."
      hidden_truths:
        - "The only living things permitted in the dragon's lair are the embermoths, who dust its scales. The moths have seen more of the mountain's inside than every expedition in history combined."
      regional_relationships:
        - place: biome.red_sky_foothills
          relationship: >-
            The mountain provides gemstones, warning tremors, and the weather;
            the foothills provide gathering law, the moth-watch, and an
            audience. It is the realm's longest-running relationship between
            unequals, and it works because the smaller party does all the
            thinking for both.
        - place: biome.expanse
          relationship: >-
            The mountain closes the plateau's southern edge. Which of them is
            guarding which is a question the realm prefers not to need
            answered.
      current_tensions:
        - "Since the great eruption, the Gemfalls have not returned to their old rhythm, and the tally-keepers are running out of margin to disagree politely in."
        - "Expeditions keep aiming for the summit with Gemfall money and borrowed courage, and the foothill grandmothers have taken to meeting them on the way up."
      historical_hooks:
        - "Somewhere on the mountain is the entrance every treasure story agrees on and no returning expedition has ever confirmed. The stories are all secondhand. They are also all identical."
        - "The foothill bells have one ring that has never been used. Everyone knows what it would mean. Nobody has ever said it aloud."
    adjacent_to: [biome.expanse]
    access_from: [biome.red_sky_foothills]
    inhabitants:
      primary_peoples: []
      supporting_peoples: []
      cultural_orders: []
      ambient_creatures: [creature.embermoth]
      dangerous_creatures: [creature.glassback_crab]
      legendary_beings: [creature.legend_dragon]
      supernatural_manifestations: []
    relationships:
      locations: [biome.red_sky_foothills]
      factions: []
      items: []
      biome: [biome.red_sky_foothills]
      creatures: []
      quests: []
      campaigns: []
    notes:
      - "The mountain is a singular landmark with its own visual family, not a world-scale travel grid."
      - "Legendary beasts may inhabit it; dragonlings do not treat it as a normal homeland."

  - id: location.exchange
    asset_id: exchange
    title: "The Exchange"
    map_label: "The Exchange"
    canon_status: confirmed
    location_type: coastal_trade_city
    parent_biome: biome.sunward_fields
    climate: >-
      Mild coastal weather shaped by sea wind, river traffic, and seasonal storms.
    danger_level: low
    featured: true
    tags: [coastal_city, trade, crossroads, docks, mixed_population, stories]
    map_provenance: map_canonical
    map_anchor: { x: 350, y: 855 }
    short_description: >-
      A neutral coastal city where roads, ships, peoples, trade, news, and
      opportunities from across the realm converge.
    visual_identity: >-
      Dense towers and halls built along cliffs, bridges, layered docks, ships,
      market awnings, signs from many cultures, crowded paths, and constant
      movement.
    common_story_uses: >-
      Campaign beginnings, reunions, contracts, rumors, investigation, trade,
      political tension between individuals, missing cargo, and stories that bring
      distant regions into contact.
    canon_constraints: >-
      The Exchange has no native or dominant people. Do not give one species
      ownership of the city or reduce it to a marketplace without homes,
      institutions, stories, and ordinary life.
    standard_behavior: >-
      Ships arrive, caravans turn over cargo, travelers exchange news, and the
      city continuously adapts to disruptions in roads, rivers, weather, and
      distant regions.
    lore:
      origin: >-
        The accepted account is that the Exchange began as a seasonal market
        that failed to disperse. The stalls wintered over, the docks grew to
        meet the stalls, and by the time anyone thought to ask whose city it
        was, the honest answer was everyone's - which the city has kept as
        policy ever since.
      recorded_history: >-
        The city's history is commercial and proud of it: the first winter
        market, the building of the cliff docks, and a long tradition of
        absorbing every crisis in the realm as a change in prices. Seventeen
        founding plaques stand around the harbor, each sincere, each naming a
        different founder, all polished by the same civic fund.
      cultural_significance: >-
        Where the realm meets itself. News, cargo, reunions, and campaigns all
        begin at the Exchange, and every people in the realm can find a meal
        here that tastes of home and a rumor that does not.
      common_beliefs:
        - "Anything lost anywhere in the realm surfaces at the Exchange within the year, priced fairly."
        - "Never ask a dock merchant where something came from. Ask where it is going - the answer is more honest and the story is better."
        - "The empty chair at an Exchange table is for whoever arrives next. Keeping it empty is not superstition; it is advertising."
      disputed_beliefs:
        - "Which people founded the city. Every people has a version placing themselves first, the seventeen plaques disagree in detail, and the dispute is considered part of the city's charm and is fanned accordingly."
      hidden_truths:
        - "The lost-and-found stalls' best supplier is a standing arrangement with the marsh boggarts. Neither side has ever put it in words, which both sides consider the strongest clause in it."
      regional_relationships:
        - place: biome.sunward_fields
          relationship: >-
            The Fields feed the city and the city pays for the Fields; each
            assumes the other would collapse first, and neither wants to
            check.
        - place: biome.whispering_marsh
          relationship: >-
            The marsh approach delivers remedies, guides, boggart salvage, and
            customers who prefer not to say which of those they came for.
        - place: biome.open_sea
          relationship: >-
            The docks are the city's fortune and its weathervane: whatever the
            sea is doing to shipping, the Exchange knows it by lunch and has
            priced it by dinner.
      current_tensions:
        - "The Gemfall rush made the Exchange its front door, and the city is now housing, feeding, and pricing a boom it publicly insists it planned for."
        - "The docks have outgrown the cliffs, and every expansion proposal involves somebody's ancestral mooring and everybody's opinion."
      historical_hooks:
        - "An eighteenth founding plaque was commissioned, delivered, and never installed. It is in a warehouse. The name on it is a matter of intense civic non-discussion."
        - "The sea-returns shelf - things the ocean gave back decades late - includes one item the city's records list as delivered before it was lost. The clerk who filed it stands by the paperwork."
    adjacent_to: [biome.whispering_marsh, biome.sunward_fields]
    coast: southwestern_sea
    inhabitants:
      primary_peoples: []
      supporting_peoples: []
      cultural_orders: []
      ambient_creatures: []
      dangerous_creatures: []
      legendary_beings: []
      supernatural_manifestations: []
      population_rule: Mixed population with no native or dominant people.
    relationships:
      locations: [biome.sunward_fields, biome.whispering_marsh, biome.open_sea]
      factions: []
      items: []
      biome: [biome.sunward_fields]
      creatures: []
      quests: []
      campaigns: []
    notes:
      - The Exchange is a settlement and transport hub.
      - "Its docks imply sea access, but destinations and shipping routes are not yet canonized."

  - id: location.stone_crossing
    asset_id: stone_crossing
    title: "Stone Crossing"
    map_label: "Stone Crossing"
    canon_status: confirmed
    location_type: river_crossing_settlement
    parent_biome: biome.eastern_plains
    climate: >-
      River-cooled and windy, with conditions changing sharply after northern melt
      or storms.
    danger_level: moderate
    featured: true
    tags: [river_crossing, bridge, bottleneck, current, trade_route]
    map_provenance: map_canonical
    map_anchor: { x: 710, y: 655 }
    short_description: >-
      A narrow, strategically important crossing where the Great River compresses
      travel between the Sunward Fields and Eastern Plains into a single route.
    visual_identity: >-
      Fast blue water, stone and timber bridgework, steep banks, weathered route
      structures, waiting caravans, river spray, and a clear sense of constrained
      passage.
    common_story_uses: >-
      Blocked travel, bridge defense, rescues from the current, negotiations,
      caravan queues, missing cargo, river creatures, and choices where every
      traveler must pass through the same place.
    canon_constraints: >-
      Stone Crossing is a location and transition environment, not a broad
      grassland biome. The current is a real hazard, and alternate nearby
      crossings should not be invented casually.
    standard_behavior: >-
      Traffic, river level, weather, maintenance, and danger can change whether
      the crossing is open, delayed, or impassable.
    lore:
      origin: >-
        The accepted account is that the trolls built the bridge because the
        river was being unreasonable, and that the settlement is, at bottom, a
        queue that put down roots.
      recorded_history: >-
        Crossing history is toll history: generations of stories, riddles, and
        promises paid at the bridge, the long riddle account with the eastern
        prides, and a flood-roll of the years the stones went under - when the
        ferry becomes, briefly and repeatedly, the realm's most important
        vessel.
      cultural_significance: >-
        The realm's bottleneck, and proud of it: every eastern story crosses
        here eventually, pays something that is not money, and leaves a little
        better told.
      common_beliefs:
        - "Pay the drake, answer the troll, and tip the ferryman in song. The crossing is cheap if you count right."
        - "A riddle owed at the bridge is a debt. The interest is embarrassment."
        - "Never brag about the current. It auditions people."
      disputed_beliefs:
        - "Whether the troll and the drake operate the crossing in partnership. Travelers assume a cartel; regulars point out that the rates have never once been coordinated."
      hidden_truths:
        - "The troll and the drake have never exchanged a single word. Each privately believes the other founded the arrangement, and is too professional to raise the subject now."
      regional_relationships:
        - place: feature.great_river
          relationship: >-
            The river is the reason, the obstacle, and the business model. The
            crossing exists because the Great River narrows here once,
            briefly, and has never been talked into doing it anywhere else.
        - place: biome.sunward_fields
          relationship: >-
            The western approach is Fields country, and a long queue at the
            bridge is the best market day the nearby cooperatives get.
        - place: biome.eastern_plains
          relationship: >-
            The eastern side is pride country, where escorts begin and end and
            the riddle account is honored; the bridge is the seam between two
            halves of the realm, stitched daily.
      current_tensions:
        - "Gemfall traffic has produced the longest queues in the crossing's history, and the petition for a second bridge has reached the troll, who is weighing the question aloud. Estimates for the answer run from seasons to decades."
        - "The drake has raised its rates, citing volume. The queue's opinion of this is loud; the drake's opinion of the queue's opinion is underwater."
      historical_hooks:
        - "The bridge's central span contains one stone that matches no local rock, and the troll, asked about it, begins the answer so slowly that no traveler has yet had time to hear the end."
        - "The sixty-year riddle on the pride account is the troll's to answer, and the troll is still weighing it, one word per season. Both ends of the bridge agree that whoever interrupts will carry the blame forever."
    connects: [biome.sunward_fields, biome.eastern_plains]
    spans: feature.great_river
    inhabitants:
      primary_peoples: []
      supporting_peoples: [npc.stone_troll, npc.centaur]
      cultural_orders: []
      ambient_creatures: [creature.silver_otter]
      dangerous_creatures: [creature.river_drake]
      legendary_beings: []
      supernatural_manifestations: []
    relationships:
      locations: [feature.great_river, biome.sunward_fields, biome.eastern_plains]
      factions: []
      items: []
      biome: [biome.eastern_plains]
      creatures: []
      quests: []
      campaigns: []
    notes:
      - This is the named southern crossing where the Great River narrows.
      - The crossing is both a site and a constrained route.

  - id: location.skullwater_cave
    asset_id: skullwater_cave
    title: "Skullwater Cave"
    map_label: "Skullwater Cave"
    canon_status: confirmed
    location_type: offshore_dungeon_landmark
    parent_biome: biome.open_sea
    climate: >-
      Cold, wet, echoing, and increasingly disconnected from surface weather with
      depth.
    danger_level: high
    featured: true
    tags: [offshore_cave, underground_gateway, skull_rock, caverns, unknown_depths]
    map_provenance: map_canonical
    map_anchor: { x: 945, y: 370 }
    relative_position: east_offshore
    short_description: >-
      A skull-shaped offshore opening that leads into a much larger underground
      world whose full extent has not yet been canonized.
    visual_identity: >-
      A single colossal skull-shaped rock, dark cave mouth, slick ledges, breaking
      waves, deep interior shadows, mineral reflections, and passages disappearing
      underground.
    common_story_uses: >-
      Descent into the underground, missing expeditions, echoes, hidden passages,
      creatures moving between layers, rescue, and campaign transitions into a
      separate subterranean geography.
    canon_constraints: >-
      The skull is one continuous rock formation, not a pile of skulls. Do not
      define the entire underground world through this entry; it requires its own
      geography layer and future canon.
    standard_behavior: >-
      Tides affect the entrance, sound travels unpredictably, and deeper passages
      should feel larger than the visible island mouth implies.
    lore:
      origin: >-
        No accepted account survives contact with the rock itself: sailors say
        the sea carved a lucky likeness, cave-divers say no current carves eye
        sockets level, and the stone trolls, who keep the outer galleries, say
        only that it was already old when their oldest stories were young.
      recorded_history: >-
        The cave's recorded history is a list of thresholds: how far the
        mapped galleries reach, and the dates each expedition pushed the map
        one chamber deeper or declined to. The deep record is mostly names,
        dates, and the phrase "turned back," written in every era's
        handwriting.
      cultural_significance: >-
        The realm's agreed front door to the underground, and the reason
        coastal charts mark depth in two directions. Sailors give the skull a
        courteous margin, and the trolls give it maintenance - the only
        attention it has ever visibly accepted.
      common_beliefs:
        - "Knock before entering. It is not superstition, it is manners, and something in there keeps track of manners."
        - "Steady in, steady out. The cave dislikes surprises more than it dislikes visitors."
        - "The tide decides your visiting hours. Argue with the tide, not with the cave."
      disputed_beliefs:
        - "Whether the skull resembles any creature that ever lived. Scholars have compared it to every remains in the Bone Yard and matched nothing, which has settled the question for nobody."
      hidden_truths:
        - "Parts of the cave sound designed because they are. The echo hunter has spent lifetimes adjusting drips and moving pebbles until its chambers ring true - the deep galleries are one creature's centuries-long housekeeping, a fact that would comfort no expedition."
      regional_relationships:
        - place: biome.open_sea
          relationship: >-
            The sea is the doorstep and the doorman: every approach is by
            water, and the water sets the schedule.
        - place: biome.frostfang_peaks
          relationship: >-
            The aeries watch the skull from their coast and give it
            flight-rule distance; griffin manners, like troll manners, extend
            to doors.
        - place: location.bone_yard
          relationship: >-
            The realm's two great deposits of enormous old bone, forever
            compared by scholars and never yet matched; whatever the skull
            was, the Yard did not bury its relatives.
      current_tensions:
        - "Unfamiliar lanterns have been seen in the outer galleries at hours no expedition claims, and the trolls have begun greeting visitors with one more question than usual."
        - "The last two mapping expeditions came back early, in agreement that the deep chambers sounded 'rearranged,' and in disagreement about everything else."
      historical_hooks:
        - "The oldest troll story about the cave calls it a door without saying to where, and troll stories are not known for leaving out the important part by accident."
        - "A missing expedition's ledger washed out of the cave mouth a year after they went in - dry, complete, and one entry longer than when it went in."
    access:
      mode: sea_or_subterranean
      fixed_routes: false
    coast_near: [biome.frostfang_peaks, biome.eastern_plains]
    inhabitants:
      primary_peoples: []
      supporting_peoples: [npc.stone_troll]
      cultural_orders: []
      ambient_creatures: []
      dangerous_creatures: [creature.echo_hunter]
      legendary_beings: []
      supernatural_manifestations: []
    relationships:
      locations: [biome.open_sea]
      factions: []
      items: []
