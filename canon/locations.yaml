  - id: location.bone_yard
    asset_id: bone_yard
    title: "The Bone Yard"
    map_label: "The Bone Yard"
    canon_status: confirmed
    location_type: river_mouth_landmark
    parent_biome: biome.sallow_wastelands
    map_provenance: map_canonical
    map_anchor: { x: 875, y: 805 }
    danger_level: high
    featured: true
    relative_position: southeast_coastal
    tags: [ancient_remains, forbidden, supernatural, river_mouth, saltrot]
    short_description: >-
      The place at the mouth of the Glacierflow where the current finally loses
      its strength and lays down everything it carried across the continent -
      sediment, uprooted trees, animal remains, wreckage, and ruins - and where
      the bones of enormous ancient creatures collect, settle, and sometimes
      refuse to remain entirely still.
    visual_identity: >-
      Colossal ribs, skulls, and vertebrae rising out of mudbanks and shallow
      braided channels; dark sediment, pale bone fields, driftwood tangles,
      sparse stunted growth, and an irregular shoreline built by deposition -
      no ordinary settlement anywhere in sight.
    common_story_uses: >-
      Ancient-remains mysteries, supernatural disturbances, retrieval with moral
      consequences, rescue, dangerous tides, forbidden expeditions, and stories
      about allowing the dead to rest.
    canon_constraints: >-
      The Bone Yard has no normal permanent settlement. Do not make it a generic
      graveyard, battlefield, or source of consequence-free crafting materials.
      Its shape comes from normal river and coastal accumulation - it is not a
      V-shaped island, not a fixed island, and not an unnaturally clean delta.
      Shallows, muddy channels, and irregular shoreline features are in; tidy
      geometry is out.
    standard_behavior: >-
      River deposits and tides rearrange smaller remains, supernatural activity
      may animate or echo through the bones, and safe paths can change.
    lore:
      origin: >-
        The accepted account is the visible one: the Glacierflow ends here and
        lays down everything it carried, and among the silt and driftwood, the
        bones of enormous creatures no bestiary can name have been collecting
        since long before anyone was watching.
      recorded_history: >-
        The Yard's history is a ledger of visits and consequences: expeditions
        in, remains rising, things taken and - eventually, invariably -
        returned. The guides' accounts agree on the pattern and on the moral,
        which is the same one every time, and still needs relearning every
        generation.
      cultural_significance: >-
        The realm's resting place for its oldest dead, and its longest-running
        lesson in leaving things be. Forbidden in the way that matters: not by
        law, but by everyone who has been there once.
      common_beliefs:
        - "Take nothing, hum something, and leave before the tide turns."
        - "The bones are not angry. They are tired, and there is a difference, and you do not want to be the one who teaches them the first thing."
        - "Speak low. Not because the bones hear - because you do not know that they don't."
      disputed_beliefs:
        - "What the enormous creatures were. No living species matches, the skull rock offshore matches nothing here either, and the realm's scholars have agreed to keep disagreeing rather than dig for the answer."
      hidden_truths:
        - "No object taken from the Yard has ever stayed sold. Every one has found its way back - returned by tide, by conscience, or by a buyer who could not sleep near it. The 'genuine Bone Yard relics' in circulation at the Exchange are hand-me-down crawler shells, every one."
      regional_relationships:
        - place: biome.sallow_wastelands
          relationship: >-
            The flats are the Yard's threshold: reaching the bones takes
            effort, the effort is the point, and the guides who provide it
            double as the Yard's unofficial doorkeepers.
        - place: feature.great_river
          relationship: >-
            The river built the Yard and staffs it still, delivering silt,
            driftwood, and the occasional new resident with every flood.
        - place: biome.mermaid_cove
          relationship: >-
            The song circles carry across the water on still nights, and the
            Yard is measurably quieter for it - the realm's gentlest ongoing
            act of neighborliness, unacknowledged from both shores.
      current_tensions:
        - "Gemfall rumor insists that gemstones washed downriver into the bones, and the restless remains have risen twice this season - which the guides report in the tone of people watching a lesson approach on schedule."
      historical_hooks:
        - "Something taken generations ago has never come back, and old accounts say the Yard has been slightly restless ever since - one wrong, patiently outstanding."
        - "Among the enormous remains is one small, ordinary grave, marked and maintained by nobody knows whom. The bones nearest it never rise."
    access:
      mode: overland_and_water
      fixed_routes: false
    inhabitants:
      primary_peoples: []
      supporting_peoples: []
      cultural_orders: []
      ambient_creatures: []
      dangerous_creatures: [creature.bone_crawler]
      legendary_beings: []
      supernatural_manifestations: [creature.restless_remains]
    relationships:
      biome: [biome.sallow_wastelands]
      locations: [feature.great_river, biome.open_sea, location.the_whirlpool]
      creatures: []
      factions: []
      items: []
      quests: []
      campaigns: []
    notes:
      - No permanent bridge or causeway is shown; approach is by water or
        across the flats, and neither is dependable.

  - id: location.bramblewood
    title: "Bramblewood"
    canon_status: newly_defined
    location_type: town
    parent_biome: biome.sunward_fields
    featured: false
    tags: [town, hedges, sunward_fields, waystop]
    short_description: >-
      A hedged town about two thirds of the way through the Sunward Fields,
      furthest from the Exchange.
    visual_identity: >-
      Thorn hedges grown into walls and doorways, roofs showing above them, paths
      that turn more often than they need to.
    common_story_uses: >-
      A first waystop, somewhere to be let into, a town whose hedges decide who
      gets through.
    canon_constraints: >-
      The hedges are grown and tended, not wild. Bramblewood is a place people
      live, not a wood with a name.
    standard_behavior: >-
      The hedges are kept by the people who live behind them, and the paths
      through them change with the season.
    lore:
      origin: >-
        The accepted account is that the founders wanted neighbors, but with
        notice, and planted accordingly. The hedges came first and the town
        grew inside them - grown thick, grown tall, and, the founders' one
        indulgence, grown opinionated.
      recorded_history: >-
        Town history is hedge history: plantings, graftings, the season the
        paths first changed on their own, and the long friendly record of
        keepers learning that tending the hedges and commanding them are
        different jobs.
      cultural_significance: >-
        The Sunward Fields' far waystop and its filter: the first roof after
        the bridge road or the last one before it, depending on your
        direction, and a town that decides - or whose hedges decide - who gets
        through.
      common_beliefs:
        - "The hedge hears offers. Flattery gets you nowhere; sincerity gets you the short path."
        - "If today's path through the hedges is longer, it is for a reason. If it is shorter, check what you are carrying."
        - "Never prune anything yourself. That is the keepers' whole job, and the hedge's whole sense of humor."
      disputed_beliefs:
        - "Whether the hedges decide who gets through or the keepers do. Visitors assume the keepers. The keepers, notably, do not."
      hidden_truths:
        - "The hedges decide. The keepers advocate, negotiate, and occasionally plead, but the hedges genuinely do not listen to anyone who has not been let in properly - including, on bad days, the keepers."
      regional_relationships:
        - place: biome.sunward_fields
          relationship: >-
            A Fields town to the bone - cooperative, festival-keeping, fed by
            the same harvest road it watches over; waystop duty is its
            contribution to the cooperatives.
        - place: location.stone_crossing
          relationship: >-
            Bridge news arrives with every wagon, and a queue at the crossing
            is a full inn at Bramblewood.
        - place: location.exchange
          relationship: >-
            Far ends of the same road: the city sends travelers, prices, and
            fashion; Bramblewood sends produce, gossip with the mud still on
            it, and travelers it has already vetted.
      current_tensions:
        - "Gemfall traffic wants through the hedges in a hurry, and the hedges do not do hurry; the inn is full, the paths are long, and the queue outside the north gap has developed its own economy."
      historical_hooks:
        - "Once in the town's history the hedges opened a path straight through - both gaps, one line, no turns. Nobody now living knows for whom, and the keepers' records note only the date and, underneath, 'as agreed.'"
        - "A door-sized gap in the oldest hedge wall has been sealed with thorns as long as anyone remembers. The hedge maintains it - the way you maintain a thing you intend to use again."
    relationships:
      biome: [biome.sunward_fields]
      creatures: []
      factions: []
      items: []
      quests: []
      campaigns: []
