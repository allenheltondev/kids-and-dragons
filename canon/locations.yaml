      A hedged town about two thirds of the way through the Sunward Fields,
      furthest from the Exchange.
    visual_identity: >-
      Thorn hedges grown into walls and doorways, roofs showing above them, paths
      that turn more often than they need to.
    common_story_uses: >-
      A first waystop, somewhere to be let into, a town whose hedges decide who
      gets through.
    canon_constraints: >-
