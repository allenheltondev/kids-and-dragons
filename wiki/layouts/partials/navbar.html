<header class="wiki-navbar" id="wiki-navbar">
  <nav class="wiki-navbar__inner" aria-label="Main navigation">
    <!-- Left: Site title -->
    <a href="{{ "/" | relURL }}" class="wiki-navbar__title">{{ .Site.Title }}</a>

    <!-- Center: Pagefind search (hidden on mobile via CSS, replaced by icon) -->
    <div class="wiki-navbar__search" id="navbar-search">
      <div class="wiki-navbar__search-input" id="navbar-search-container">
        <!-- Pagefind UI injected here -->
      </div>
    </div>

    <!-- Right: Controls -->
    <div class="wiki-navbar__controls">
      <!-- Mobile search toggle (visible < 768px) -->
      <button class="wiki-navbar__search-toggle" id="search-toggle"
              aria-label="Toggle search" aria-expanded="false">
        <svg class="wiki-navbar__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <!-- Theme toggle -->
      {{ partial "theme-toggle.html" . }}
      <!-- Mobile hamburger (visible < 768px) -->
      <button class="wiki-navbar__hamburger" id="sidebar-toggle"
              aria-label="Toggle navigation menu" aria-expanded="false">
        <svg class="wiki-navbar__icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile search overlay (hidden by default) -->
  <div class="wiki-navbar__search-overlay" id="search-overlay" hidden>
    <div id="search-overlay-container">
      <!-- Pagefind UI for mobile -->
    </div>
  </div>
</header>
