{{ define "main" }}
<article class="entity-page{{ with .Params.type }} entity-type-{{ . }}{{ end }}">
  <div class="entity-content">
    <h1>{{ .Title }}</h1>

    {{ with .Params.tags }}
    <div class="entity-tags" aria-label="Tags">
      {{ range . }}
      <span class="wiki-tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}

    {{ $content := .Content }}
    {{ $content = replaceRE `(?s)<!-- BEGIN GENERATED: ai_context -->.*?<!-- END GENERATED: ai_context -->` "" $content }}
    {{ $content | safeHTML }}

    {{/* Hidden AI context for AI tools */}}
    {{ partial "ai-context.html" . }}
  </div>
</article>
{{ end }}
