{{ define "main" }}
<div class="section-index">
  <h1>{{ .Title }}</h1>

  {{ with .Content }}
  <div class="section-description">
    {{ . }}
  </div>
  {{ end }}

  {{ $pages := .Pages.ByTitle }}
  {{ if $pages }}
  <ul class="wiki-entity-list">
    {{ range $pages }}
    <li class="wiki-entity-list__item">
      <div class="wiki-entity-list__info">
        <span class="wiki-entity-list__name">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </span>
        {{ with .Params.type }}
        <span class="wiki-entity-list__meta">
          <span class="wiki-badge wiki-badge--{{ . }}">{{ . }}</span>
        </span>
        {{ end }}
      </div>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p class="text-secondary">No pages in this section yet.</p>
  {{ end }}
</div>
{{ end }}
