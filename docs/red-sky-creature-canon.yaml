  - "No named individual characters are canon. Chapter-scoped characters exist in content (Pib the bramble sprite in bramblewood-01) and stay chapter-scoped; 'bramble sprite' reads as a local name for a harvest-sprite-like woodland spirit until a future version canonizes it."
  - "The Hollow Crown — the campaign's namesake artifact (content/campaigns/the-hollow-crown.json, hollow_crown_shard in items.json) — has no canon entry. When canonized it should build on forest_memory and the unicorn's role in repairing broken trust, which is the ground the chapter's shrine material already stands on."
  - "No villainous faction is canon."
  - "No formal governments or political borders are canon."
  - "No exact population numbers are canon."
  - "No exact biological relationship between dragonlings and legend dragons is canon."
  - "The established player-character artwork remains authoritative for anatomy not specified here."
