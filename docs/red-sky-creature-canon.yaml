schema_version: "1.0"
document_type: red_sky_creature_canon
title: "The Realm of Red Sky Creature Canon"
updated: "2026-07-30"

purpose: >-
  Canonical, agent-readable reference for the peoples, creatures, legendary
  beings, and unresolved inhabitants of the Realm of Red Sky. Use this file
  when planning stories, encounters, dialogue, character artwork, creature
  artwork, regional scenes, or game content.

agent_instructions:
  - Treat entries with canon_status "confirmed" or "newly_defined" as canon.
  - Treat entries with canon_status "intentionally_undefined" as protected mysteries. Do not supply an answer unless explicitly asked to develop that mystery.
  - Do not invent additional homelands for playable peoples.
  - Do not portray an entire sapient people as inherently good, evil, hostile, foolish, or untrustworthy.
  - For sapient peoples, standard_behavior describes common cultural practices, not mandatory personality traits.
  - Dangerous creatures are dangerous because of predation, territoriality, magical instability, or environmental pressure; they are not morally evil by default.
  - Mount RedSky is not a dragonling homeland or civilization.
  - Adult dragons on Mount RedSky are rare, solitary legendary beasts and are not automatically related to dragonlings.
  - The Exchange has no native or dominant people.
  - The Bone Yard has no normal permanent settlement.
  - Preserve the distinctions between MossHome and the wider Enchanted Woods.
  - Preserve the distinctions between the central Plains, Eastern Plains, and Sunward Fields.
  - Named individuals, villainous factions, and political governments are not yet canon unless added in a future version. Chapters may introduce named characters (bramblewood-01's Pib, for example); they are chapter-scoped and carry no canon weight outside the chapter that names them.

# Four location ids shorten when they become asset directories. This is the
# whole transform — every other id is identical in both registries — and it is
# written down because manifest.entities carries both spellings in one object
# (`primaryBiome` uses the asset id, `canonicalLocations` the canon id), and
# nothing else said which was which.
asset_biome_ids:
  mount_redsky: mount_red_sky
  the_expanse: expanse
  the_plains: plains
  the_exchange: exchange

controlled_values:
  canon_status:
    confirmed: "Established through direct worldbuilding decisions."
    newly_defined: "Added as canon in this creature inventory."
    intentionally_undefined: "A protected mystery or open design slot."
  classification:
    playable_people: "Sapient people available as a player-character species."
    supporting_people: "Sapient people used primarily for NPCs and world population."
    cultural_order: "A learned role or tradition that can include members of multiple peoples."
    legendary_beast: "Rare, individually significant creature; usually not a population."
    ambient_creature: "Non-sapient or semi-sapient wildlife that normally avoids conflict."
    dangerous_creature: "Non-sapient or semi-sapient creature likely to create danger."
    supernatural_manifestation: "A magical event or animated phenomenon rather than a biological species."
    unresolved: "Intentionally unspecified entity or population."
  sapience:
    sapient: "Person-level intelligence, language, culture, and moral agency."
    semi_sapient: "Problem solving and communication beyond ordinary wildlife without a full civilization."
    animal: "Wildlife-level cognition."
    variable: "Varies by individual, age, or manifestation."
    unknown: "Not established."
  danger_level:
    none: "Not normally dangerous."
    low: "May inconvenience or frighten but rarely causes serious harm."
    moderate: "Can harm unprepared travelers."
    high: "A serious threat requiring planning, escape, or cooperation."
    legendary: "Potentially realm-changing or suitable for a major story climax."
    unknown: "Deliberately not established."
  scale:
    # Every value `scale` uses, closed like the other vocabularies — an entity
    # with a size not on this list is a canon edit, not a new adjective.
    # asset-brief.md §9.5 maps the five starred values to on-canvas pixel
    # heights for commissioning; the others describe creatures that are not
    # one-tile combat actors and take their size from their story use.
    tiny: "Fits in cupped hands. *"
    tiny_to_small: "Between hands and knee height."
    small: "Knee height on a person."
    small_to_medium: "Between knee and waist height. *"
    medium: "Person-sized. *"
    medium_to_large: "Between person and horse sized. *"
    large: "Horse-to-wagon sized. *"
    very_large: "Fills a clearing; too big for a single combat tile."
    colossal: "Landscape-scale. Never a combat actor."
    variable: "Size depends on the individual or manifestation."

world_rules:
  moral_alignment: >-
    Species does not determine morality. Villains should be named individuals,
    mixed-species factions, or supernatural threats defined by choices and goals.
  travel_and_migration: >-
    A homeland identifies cultural origin and population concentration, not an
    absolute border. Individuals may live, work, study, or travel elsewhere.
  conflict_design: >-
    Encounters should usually permit more than combat. Appropriate alternatives
    include observation, conversation, bargaining, rescue, distraction, escape,
    environmental problem-solving, and restoring a damaged habitat.
  child_hero_tone: >-
    The realm can contain danger, loss, and frightening mysteries, but descriptions
    should remain suitable for a child-centered adventure. Emphasize courage,
    curiosity, consequences, cooperation, and repair over gore or cruelty.

locations:
  - id: sky_islands
    name: "Sky Islands"
    location_type: region
    canon_note: "Drifting islands whose cultures navigate by wind, stars, and recurring routes."

  - id: enchanted_woods
    name: "Enchanted Woods"
    location_type: region
    canon_note: "Ancient living forest that remembers how visitors treat it."

  - id: mosshome
    name: "MossHome"
    location_type: settlement
    parent_location: enchanted_woods
    canon_note: "Bigfoot settlement built in harmony with living ancient trees."

  - id: bramblewood
    name: "The Bramblewood"
    location_type: locale
    parent_location: enchanted_woods
    canon_note: >-
      A bramble-tangled reach of the Enchanted Woods, thick with thornways and
      old shrines. The name survives from the reference chapter
      (bramblewood-01, biome enchanted_woods) and names a place inside the
      Woods, never a separate region — the retired five-biome roster is not a
      back door.

  - id: whispering_marsh
    name: "Whispering Marsh"
    location_type: region
    canon_note: "Mist-covered wetlands where memories and voices collect."

  - id: the_expanse
    name: "The Expanse"
    location_type: forbidden_region
    canon_note: "Barren northern waste. What lives or lies beyond it is intentionally unknown."

  - id: mount_redsky
    name: "Mount RedSky"
    location_type: legendary_region
    canon_note: "Active volcano, source of powerful gemstones, and territory of rare solitary legendary beasts."

  - id: red_sky_foothills
    name: "Red Sky Foothills"
    location_type: region
    canon_note: "Volcanic hills, cooled lava tubes, crystal veins, and the dragonling homeland."

  - id: the_plains
    name: "The Plains"
    location_type: region
    canon_note: "Central open country crossed by old roads and caravans."

  - id: sunward_fields
    name: "Sunward Fields"
    location_type: region
    canon_note: "Rolling meadows and farms that feed much of the realm."

  - id: the_exchange
    name: "The Exchange"
    location_type: city
    canon_note: "Neutral coastal hub where all peoples, paths, stories, and trade converge."

  - id: glacier_of_origins
    name: "Glacier of Origins"
    location_type: legendary_region
    canon_note: "Ancient glacier where the Great River begins and old memories remain frozen."

  - id: frostfang_peaks
    name: "Frostfang Peaks"
    location_type: region
    canon_note: "High frozen mountains and the griffin homeland."

  - id: eastern_plains
    name: "Eastern Plains"
    location_type: region
    canon_note: "Wide open country east of the Great River and the manticore homeland."

  - id: stone_crossing
    name: "Stone Crossing"
    location_type: landmark
    canon_note: "A narrow and strategically important crossing of the Great River."

  - id: bone_yard
    name: "The Bone Yard"
    location_type: forbidden_region
    canon_note: "River-delta island where the remains of enormous ancient creatures collect and sleep."

  - id: mermaid_cove
    name: "Mermaid Cove"
    location_type: region
    canon_note: "Warm reefs protected by merfolk, selkies, and an ancient alliance."

  - id: skullwater_cave
    name: "Skullwater Cave"
    location_type: gateway
    canon_note: "Skull-shaped opening into a much larger underground world."

  - id: great_river
    name: "The Great River"
    location_type: waterway
    canon_note: "Glacial river flowing south through the realm and carrying faint fragments of memory."

  - id: open_sea
    name: "The Open Sea"
    location_type: region
    canon_note: "Ocean surrounding the realm."

  - id: the_whirlpool
    name: "The Whirlpool"
    location_type: legendary_landmark
    canon_note: "Powerful whirlpool near Mermaid Cove and the Bone Yard; its deeper cause remains unknown."

entities:
  # ---------------------------------------------------------------------------
  # PLAYABLE PEOPLES
  # ---------------------------------------------------------------------------

  - id: dragonling
    name: "Dragonling"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [red_sky_foothills]
    secondary_locations: [the_exchange, the_plains, sunward_fields]
    danger_level: none
    rarity: common_in_homeland
    short_description: >-
      Young dragon-like people adapted to the tremors, ash, caves, and crystal
      fields of the Red Sky Foothills.
    visual_identity:
      - "Compact, expressive dragon-like form with scales, horns, and a clearly youthful silhouette."
      - "Colors and markings may vary widely between individuals."
      - "Clothing and equipment favor climbing, heat protection, and cave travel."
    visual_constraints:
      - "Use the established player-character design for exact wing, horn, and body configuration."
      - "Do not visually imply that all dragonlings are children of Mount RedSky's adult dragons."
    scale: small_to_medium
    movement: "Ground travel and strong climbing; any flight capability follows the established player design."
    communication: "Spoken language, gesture, warning calls, and communal crystal chimes."
    social_structure: >-
      Family homes and small settlements occupy cooled lava tubes, sheltered
      valleys, and cliffside caves throughout the foothills.
    cultural_norms:
      - "Watch the mountain closely and share warnings quickly."
      - "Gather gemstones released by natural eruptions rather than cutting into living veins."
      - "Value practical courage: preparedness and helping others are more admired than recklessness."
    standard_behavior: >-
      Dragonling communities monitor tremors, ash, heat, and crystal changes.
      Individuals commonly explore caves, collect cooled gemstones, trade with
      caravans, and help maintain eruption routes and warning systems.
    common_abilities:
      - "Heat tolerance"
      - "Cave navigation"
      - "Sensitivity to volcanic changes"
    common_story_uses:
      - "Local guide to the foothills"
      - "Hero conflicted about entering forbidden gemstone caves"
      - "Witness to unusual changes in Mount RedSky"
    canon_constraints:
      - "Mount RedSky itself is not the dragonling homeland."
      - "Claims of descent from legend dragons are unverified cultural stories, not established fact."

  - id: bigfoot
    name: "Bigfoot"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [mosshome]
    secondary_locations: [enchanted_woods, whispering_marsh, the_exchange]
    danger_level: none
    rarity: common_in_homeland
    short_description: >-
      Large, shaggy forest people known for observation, natural history,
      living construction, and quietly maintained knowledge.
    visual_identity:
      - "Tall, broad, shaggy silhouette with expressive face and hands."
      - "Natural accessories made from fallen wood, woven grasses, stones, and cultivated moss."
      - "MossHome residents may carry botanical tools, seed pouches, or history tokens."
    scale: large
    movement: "Powerful ground travel, climbing, and quiet movement through dense forest."
    communication: "Spoken language, low calls across the forest, gesture, and ecological records."
    social_structure: >-
      Extended families live throughout MossHome and maintain relationships with
      neighboring forest communities.
    cultural_norms:
      - "Observe before acting."
      - "Build with living systems rather than destroying them."
      - "Record history in gardens, moss patterns, tree rings, and arranged stones."
    standard_behavior: >-
      Bigfoots tend forest paths and living structures, study changes in plants
      and wildlife, preserve community history, and intervene when the forest is
      damaged or behaving unusually.
    common_abilities:
      - "Exceptional strength"
      - "Quiet forest movement"
      - "Tracking and ecological knowledge"
    common_story_uses:
      - "Forest historian"
      - "Guide through changing paths"
      - "Hero who notices an environmental clue others miss"
    canon_constraints:
      - "Do not portray Bigfoots as primitive, unintelligent, or universally reclusive."

  - id: manticore
    name: "Manticore"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [eastern_plains]
    secondary_locations: [stone_crossing, the_plains, the_exchange]
    danger_level: none
    rarity: common_in_homeland
    short_description: >-
      Proud, formidable plains people who travel in family prides, maintain
      routes, and guard travelers crossing the open east.
    visual_identity:
      - "Lion-like body and a distinctive powerful tail."
      - "A formidable silhouette balanced by expressive, approachable features."
      - "Trail markers, travel gear, badges, or woven pride colors distinguish families."
    visual_constraints:
      - "Use the established player-character design for exact face, wing, and tail anatomy."
      - "Do not make threatening anatomy a shorthand for evil."
    scale: medium_to_large
    movement: "Fast over open ground; any flight capability follows the established player design."
    communication: "Spoken language, long-distance calls, formal introductions, and trail signs."
    social_structure: >-
      Mobile extended families called prides travel established circuits and
      gather seasonally at shared meeting grounds.
    cultural_norms:
      - "Announce intentions clearly when approaching another group."
      - "Protect peaceful travelers within one's claimed route."
      - "Use riddles, challenges, and elaborate introductions to test attention and confidence."
    standard_behavior: >-
      Manticores patrol roads, repair trail markers, investigate unusual tracks,
      escort caravans, and exchange news between isolated settlements.
    common_abilities:
      - "Speed and endurance"
      - "Powerful defensive anatomy"
      - "Long-distance observation"
    common_story_uses:
      - "Road guardian"
      - "Caravan escort"
      - "Hero confronting unfair assumptions about appearance"
    canon_constraints:
      - "Manticores are not an inherently hostile or villainous people."

  - id: griffin
    name: "Griffin"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [frostfang_peaks]
    secondary_locations: [glacier_of_origins, eastern_plains, the_exchange]
    danger_level: none
    rarity: common_in_homeland
    short_description: >-
      Eagle-and-lion people of the Frostfang aeries who serve as scouts,
      rescuers, messengers, and guardians of the northern horizon.
    visual_identity:
      - "Raptor head, wings, and forequarters combined with a powerful feline body."
      - "Cold-weather plumage and practical flight gear."
      - "Aerie, rescue, and watch roles may be shown through bands, packs, or insignia."
    scale: medium_to_large
    movement: "Powerful flight, mountain climbing, and controlled dives."
    communication: "Spoken language, aerial signals, calls, and distant watch signals."
    social_structure: >-
      Cliffside aerie communities share watch, rescue, teaching, and messenger duties.
    cultural_norms:
      - "Answer calls for rescue."
      - "Take watch duties seriously."
      - "Report signs from the Expanse rather than pursuing them alone."
    standard_behavior: >-
      Griffins patrol passes, carry messages, rescue stranded travelers, teach
      young fliers, and watch for unexplained movement north of the peaks.
    common_abilities:
      - "Sustained flight"
      - "Exceptional distant vision"
      - "Cold and high-altitude endurance"
    common_story_uses:
      - "Northern scout"
      - "Mountain rescuer"
      - "Curious young hero tempted to investigate the forbidden north"

  - id: unicorn
    name: "Unicorn"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [enchanted_woods]
    secondary_locations: [mosshome, sunward_fields, the_exchange]
    danger_level: none
    rarity: uncommon
    short_description: >-
      Magical forest people who tend hidden glades, shifting paths, wounded
      magic, and the ancient promises remembered by the Enchanted Woods.
    visual_identity:
      - "Equine form with a single magical horn and an expressive, youthful face."
      - "Natural color and marking variation; magic may appear as subtle light, plants, or path-like motifs."
      - "Adornment favors living flowers, woven leaves, and keepsakes tied to promises."
    scale: medium_to_large
    movement: "Fast ground travel through forest paths and open meadows."
    communication: "Spoken language, posture, horn magic, and changes in nearby plant life."
    social_structure: >-
      Small glade communities linked by magical paths and shared obligations to the forest.
    cultural_norms:
      - "Repair damaged magic and broken trust."
      - "Take promises seriously."
      - "Guide lost travelers who have treated the forest kindly."
    standard_behavior: >-
      Unicorns inspect changes in paths and glades, help restore damaged places,
      mediate promises, and investigate disturbances the forest appears to remember.
    common_abilities:
      - "Sensitivity to magic and broken promises"
      - "Healing or restorative magic"
      - "Finding and opening hidden forest paths"
    common_story_uses:
      - "Magical guide"
      - "Restorer of a damaged place"
      - "Impulsive young hero who is too confident in reading the truth"
    canon_constraints:
      - "Unicorns are not universally calm, elegant, wise, or correct."

  - id: kitsune
    name: "Kitsune"
    classification: playable_people
    canon_status: confirmed
    sapience: sapient
    playable: true
    primary_locations: [sky_islands]
    secondary_locations: [the_exchange, enchanted_woods, frostfang_peaks]
    danger_level: none
    rarity: common_in_homeland
    short_description: >-
      Fox-like people of the drifting Sky Islands who use wind, stories,
      navigation, and illusion to connect moving communities.
    visual_identity:
      - "Fox-like form with expressive ears, tail or tails, and light travel clothing."
      - "Wind, cloud, star, and temple motifs."
      - "Young kitsune generally have one tail; additional tails signify magical maturity and self-understanding."
    scale: small_to_medium
    movement: "Agile ground movement, island-to-island travel using established conveyances, and wind-assisted magic."
    communication: "Spoken language, stories, wind signals, lanterns, and controlled illusion."
    social_structure: >-
      Temple-like villages on drifting islands maintain long-distance relationships
      through recurring wind routes.
    cultural_norms:
      - "Describe destinations by when they can be reached, not only where they are."
      - "Use cleverness to reveal choices rather than simply fooling others."
      - "Preserve stories that help communities recognize recurring routes."
    standard_behavior: >-
      Kitsune chart wind patterns, maintain island stabilizing sites, carry
      stories between islands, prepare for storms, and use illusions for teaching,
      communication, protection, and play.
    common_abilities:
      - "Illusion"
      - "Wind sensitivity"
      - "Agility and indirect problem-solving"
    common_story_uses:
      - "Wind navigator"
      - "Messenger carrying incomplete or symbolic information"
      - "Hero whose clever solution creates an unexpected consequence"
    canon_constraints:
      - "Do not portray every kitsune as dishonest or mischievous."

  # ---------------------------------------------------------------------------
  # SUPPORTING PEOPLES AND CULTURAL ORDERS
  # ---------------------------------------------------------------------------

  - id: centaur
    name: "Centaur"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [the_plains]
    secondary_locations: [eastern_plains, sunward_fields, the_exchange, stone_crossing]
    danger_level: none
    rarity: common_in_homeland
    short_description: "Traveling plains people who guide caravans and preserve the realm's oldest overland routes."
    visual_identity:
      - "Humanoid upper body and equine lower body."
      - "Travel gear, route maps, messenger packs, and caravan colors."
    scale: large
    movement: "Fast, enduring ground travel."
    communication: "Spoken language, trail signs, bells, and caravan signals."
    social_structure: "Traveling bands, route-keeping families, and seasonal gatherings."
    standard_behavior: >-
      Centaurs guide travelers, carry news, maintain camps and road markers, and
      redirect caravans when weather or magic changes familiar routes.
    common_abilities: ["Endurance", "Navigation", "Caravan coordination"]
    common_story_uses: ["Guide", "Courier", "Witness to trouble along the roads"]

  - id: faun
    name: "Faun"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [sunward_fields]
    secondary_locations: [the_plains, the_exchange, enchanted_woods]
    danger_level: none
    rarity: common_in_homeland
    short_description: "Hooved farming people associated with orchards, music, communal work, and seasonal celebrations."
    visual_identity:
      - "Humanoid form with goat-like legs, ears, and variable horns."
      - "Practical farm clothing, tools, instruments, and sun motifs."
    scale: medium
    movement: "Sure-footed ground travel and agile jumping."
    communication: "Spoken language, music, work songs, and field signals."
    social_structure: "Farm households, village cooperatives, and seasonal work groups."
    standard_behavior: >-
      Fauns plant, harvest, repair irrigation and fences, organize shared meals,
      and use music to coordinate work and celebrate seasonal changes.
    common_abilities: ["Farming", "Music", "Agility"]
    common_story_uses: ["Farmer", "Festival organizer", "Neighbor facing a practical local problem"]

  - id: harvest_sprite
    name: "Harvest Sprite"
    classification: supporting_people
    canon_status: confirmed
    sapience: semi_sapient
    playable: false
    primary_locations: [sunward_fields]
    secondary_locations: [enchanted_woods, the_plains]
    danger_level: none
    rarity: common_but_easily_missed
    short_description: "Tiny field spirits who tend overlooked plants and reward careful stewardship."
    visual_identity:
      - "Tiny luminous or plant-like figures."
      - "Features and colors change with crop and season."
    scale: tiny
    movement: "Quick hopping, fluttering, or darting movement through vegetation."
    communication: "Simple speech, chimes, gestures, arranged seeds, and plant growth."
    social_structure: "Small cooperative groups centered on particular fields or orchards."
    standard_behavior: >-
      Harvest sprites tend unharvested patches, recover dropped seeds, hide from
      careless workers, and assist communities that leave food and habitat for
      small creatures.
    common_abilities: ["Plant tending", "Concealment", "Minor growth magic"]
    common_story_uses: ["Environmental clue", "Tiny helper", "Indicator of a field's health"]

  - id: frogfolk
    name: "Frogfolk"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [whispering_marsh]
    secondary_locations: [great_river, the_exchange]
    danger_level: none
    rarity: common_in_homeland
    short_description: "Amphibious marsh people who maintain safe channels, reed settlements, and mist markers."
    visual_identity:
      - "Amphibious humanoid form with broad eyes and varied frog-like colors."
      - "Reed-woven clothing, floating packs, pole boats, and mist lanterns."
    scale: small_to_medium
    movement: "Swimming, powerful jumping, and careful movement over mud and reeds."
    communication: "Spoken language, rhythmic calls, water taps, and lantern signals."
    social_structure: "Stilt and reed settlements connected by marked water routes."
    standard_behavior: >-
      Frogfolk mark safe channels, monitor water levels, collect useful marsh
      plants, guide respectful travelers, and close routes when the whispers grow dangerous.
    common_abilities: ["Swimming", "Jumping", "Marsh navigation"]
    common_story_uses: ["Marsh guide", "Boat keeper", "First witness to a changed waterway"]

  - id: boggart
    name: "Boggart"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [whispering_marsh]
    secondary_locations: [enchanted_woods, the_exchange]
    danger_level: low
    rarity: uncommon
    short_description: "Small marsh-dwelling people who collect lost objects, secrets, and unusual sounds."
    visual_identity:
      - "Small, wiry silhouettes with marsh-colored skin, fur, or plant-like coverings."
      - "Collections of buttons, keys, shells, bells, and other found objects."
    scale: small
    movement: "Quick movement through roots, reeds, shallow water, and hidden burrows."
    communication: "Spoken language, imitation, whistles, and traded objects."
    social_structure: "Solitary homes and small family groups linked by exchange networks."
    standard_behavior: >-
      Boggarts collect things the marsh has swallowed, trade information indirectly,
      avoid large groups, and test whether strangers pay attention before offering help.
    common_abilities: ["Finding lost objects", "Sound imitation", "Concealment"]
    common_story_uses: ["Unreliable-looking but truthful witness", "Keeper of a missing object", "Information trader"]
    canon_constraints:
      - "Boggarts may be secretive or irritating, but they are not inherently malicious."

  - id: yeti
    name: "Yeti"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [glacier_of_origins]
    secondary_locations: [frostfang_peaks]
    danger_level: none
    rarity: uncommon
    short_description: "Patient ice-dwelling people who preserve and interpret memories trapped in the glacier."
    visual_identity:
      - "Large fur-covered form adapted to snow and ice."
      - "Layered cold-weather wraps, memory tokens, ice tools, and carved walking staffs."
    scale: large
    movement: "Powerful ground movement over snow, ice, and steep glacial terrain."
    communication: "Spoken language, low carrying calls, carvings, and tactile memory rituals."
    social_structure: "Small kin groups and isolated memory-keeping shelters."
    standard_behavior: >-
      Yetis inspect the glacier for exposed memories, guide visitors away from
      unstable ice, preserve old accounts, and deliberate carefully before acting.
    common_abilities: ["Cold endurance", "Ice travel", "Reading some memories preserved in ice"]
    common_story_uses: ["Keeper of old knowledge", "Glacier guide", "Interpreter of an incomplete memory"]

  - id: merfolk
    name: "Merfolk"
    classification: supporting_people
    canon_status: confirmed
    sapience: sapient
    playable: false
    primary_locations: [mermaid_cove]
    secondary_locations: [open_sea, the_exchange, great_river]
    danger_level: none
    rarity: common_in_homeland
    short_description: "Aquatic reef people who maintain Mermaid Cove and uphold an ancient alliance with the land."
