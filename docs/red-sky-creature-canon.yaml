world_phenomena:
  - id: living_gem_veins
    locations: [mount_redsky, red_sky_foothills]
    canon_status: confirmed
    description: >-
      Mount RedSky's eruptions create valuable gemstones. Dragonlings interpret
      changes in gemstone color and pattern as one way the mountain communicates.
    behavior: >-
      Gathering cooled gemstones released naturally is accepted. Cutting deeply
      into active or living veins can disturb the mountain.

  - id: forest_memory
    locations: [enchanted_woods, mosshome]
    canon_status: confirmed
    description: "The Enchanted Woods remembers how visitors treat it."
    behavior: >-
      Helpful travelers may find safer or shorter paths. Destructive travelers
      may find paths returning them to the harm they caused.

  - id: marsh_memories
    locations: [whispering_marsh]
    canon_status: confirmed
    description: "Memories carried by water and magic collect in the marsh mist."
    behavior: >-
      Whispers may repeat warnings, secrets, ordinary moments, or emotionally
      important fragments. A voice in the marsh does not prove its speaker is dead.

  - id: glacial_memory
    locations: [glacier_of_origins]
    canon_status: confirmed
    description: "Ancient memories remain preserved within the deepest glacier ice."
    behavior: "Some yetis can interpret exposed fragments, but no memory is guaranteed to be complete or objective."

  - id: river_memory
    locations: [great_river]
    canon_status: confirmed
    description: "The Great River carries faint fragments of memory south from the Glacier of Origins."
    behavior: "Fragments may influence dreams, impressions, magic, or marsh whispers without providing a complete historical record."

  - id: merfolk_containment_song
    locations: [mermaid_cove, the_whirlpool]
    canon_status: confirmed
    description: "Merfolk songs help keep the great whirlpool from widening."
    behavior: "The song is a maintained practice connected to an ancient alliance, not a single permanent spell."

regional_population_index:
  # The buckets here name an entity's ROLE IN THIS REGION, not its
  # `classification` — the two deliberately disagree. A playable people appears
  # under `supporting_people` where it lives as a minority (bigfoot in the
  # Enchanted Woods); a classification-`supporting_people` appears under
  # `primary_people` where it is the dominant culture (frogfolk in the marsh);
  # a `supernatural_manifestation` lists under `dangerous_creatures` where it
  # endangers travelers, because that is what a chapter set there needs to
  # know. Read the entity's own entry for what it *is*; read this index for
  # what it *does here*.
