<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids &amp; Dragons — brand assets</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(24px, 6vw, 80px); background: #0d0b1a; color: #f4f1ff; font-family: system-ui, sans-serif; }
  main { max-width: 900px; margin: auto; }
  .lockup { display: flex; align-items: center; gap: clamp(16px, 4vw, 32px); padding: 40px 0; }
  .lockup img { width: clamp(80px, 22vw, 180px); height: auto; }
  h1 { margin: 0; font-size: clamp(26px, 6vw, 56px); line-height: 1.05; font-weight: 800; letter-spacing: -.04em; }
  h1 span { color: #ffe8a3; }
  .samples { display: flex; flex-wrap: wrap; gap: 20px; margin: 32px 0; }
  figure { margin: 0; min-width: 110px; padding: 24px; border-radius: 16px; background: #21183e; text-align: center; }
  .light { background: #fff7e4; color: #21183e; }
  figcaption { margin-top: 16px; font-size: 13px; }
  .sizes { display: flex; align-items: center; gap: 24px; min-height: 60px; }
  p { color: #bcb5d4; line-height: 1.6; }
</style>
<main>
  <div class="lockup"><img src="dragon-512.png" alt="Friendly purple dragon with gold horns"><h1>Kids <span>&amp;</span><br>Dragons</h1></div>
  <p>A friendly dragon for small adventures. Use the symbol on its own for the app icon, or pair it with the name as shown above.</p>
  <div class="samples">
    <figure><img src="dragon-192.png" width="128" height="128" alt="Dragon mark on dark background"><figcaption>Dark background</figcaption></figure>
    <figure class="light"><img src="dragon-192.png" width="128" height="128" alt="Dragon mark on light background"><figcaption>Light background</figcaption></figure>
  </div>
  <p>Actual favicon sizes: 16, 32, and 48 pixels.</p>
  <div class="sizes"><img src="dragon-16.png" width="16" height="16" alt="16 pixel icon"><img src="dragon-32.png" width="32" height="32" alt="32 pixel icon"><img src="dragon-48.png" width="48" height="48" alt="48 pixel icon"></div>
</main>
</html>
