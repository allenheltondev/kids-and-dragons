AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

# Kids & Dragons — the whole stack, architecture §2.
#
# One template, one region, three stacks distinguished only by stack name:
# `staging` from every pull request, `prod` from main, and `dev` for a stack you
# drive by hand from a laptop (§7).
#
# The shape, top to bottom:
#
#   CloudFront ──┬── S3            the SPA, art assets, and content
#                └── HTTP API      /api/* → one Lambda over handlers/
#   AppSync Events                 room/<code>; IAM publishes, players subscribe
#   DynamoDB                       one table, one GSI, architecture §3
#   Cognito                        optional sign-in, email OTP then passkey
#   SSM SecureString               the key that signs device and session tokens
#
# Deploy with `npm run infra:deploy` — that runs `infra/build.mjs` first, which
# is what produces the CodeUri directories below. `sam build` is not used.

Description: Kids & Dragons — API, realtime, storage, auth, and CDN

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: >-
      Which environment this stack is (architecture §7). `staging` is deployed
      from every pull request and `prod` from main; `dev` exists for a stack you
      drive by hand from a laptop.

  GuestSweepSchedule:
    Type: String
    Default: rate(24 hours)
    Description: >-
      How often expired anonymous households are deleted.

      The frequency is not what makes the promise true — the 7-day guest TTL is,
      and the sweeper only ever deletes households already past it. All this
      controls is how long a household sits deleted-in-principle before it is
      deleted in fact, and a day of that is invisible to anyone: nobody is
      watching for their characters to disappear on the seventh evening.

      Daily also keeps the batch limit honest. 25 households a run is 25 a day
      rather than 100, which is still far more than this game will ever produce
      — and if it somehow is not, the backlog drains a day later rather than
      never.

  WebAuthnRelyingPartyId:
    Type: String
    Default: ""
    Description: >-
      The domain passkeys are bound to — the CloudFront domain, or a custom one.
      Leave empty on the first deploy and sign-in is email-OTP only; fill it in
      from the SiteUrl output and deploy again to turn passkeys on.

      It cannot default to the distribution's own domain: the user pool would
      then depend on CloudFront, which depends on the API, which depends on the
      user pool, and CloudFormation refuses the cycle. A passkey is bound to a
      domain for the life of the credential, so this is worth getting right once
      rather than automatically.

  AppDomainName:
    Type: String
    Default: ""
    Description: >-
      Optional hostname for the game, e.g. kd.readysetcloud.io. With
      AppHostedZoneId, the stack issues an ACM certificate for it (DNS
      validated in that zone), adds it to the CloudFront distribution and
      points A/AAAA alias records at the distribution. Empty (the default, and
      every non-production deploy) serves on the *.cloudfront.net domain only.
      CloudFront certificates must be in us-east-1, as this stack is.

  AppHostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone that holds AppDomainName's parent domain.

  PushNotifications:
    Type: String
    Default: "off"
    AllowedValues: ["off", "on"]
    Description: >-
      "It's your turn" Web Push notifications to an installed app in the
      background (#466). Off by default: nothing is sent and the Account
      screen's switch does not appear. On, the API mints a VAPID key pair into
      the SecureString /kad/<stage>/push-vapid-keys on first use (as it does
      the token signing key) and needs PushContact.

  SessionTiming:
    Type: String
    Default: "on"
    AllowedValues: ["off", "on"]
    Description: >-
      Family-session timing (#511): the API stamps each chapter's opening,
      steps, pauses and ending on the run's event log and a household can
      export how long its chapters really took. On by default and operator-only:
      nothing is shown at the table. Set "off" to record nothing. No names, chat
      or audio are kept, and it is deleted with the household
      (docs/session-timing.md).

  PushContact:
    Type: String
    Default: ""
    Description: >-
      The VAPID subject the push services can reach the operator at: a
      mailto: or https: address. Required when PushNotifications is on;
      without it the API logs a warning and pushes stay off.

Conditions:
  # The stage that holds families' heroes. Staging and dev hold test rows and
  # are torn down by hand (docs/deploy.md), so they skip the guards below.
  IsProd: !Equals [!Ref StageName, prod]
  # Passkeys need a relying-party domain. Without one, email OTP alone.
  Passkeys: !Not [!Equals [!Ref WebAuthnRelyingPartyId, ""]]
  # Both halves are needed: the certificate validates, and the alias records
  # live, in the hosted zone.
  CustomDomain: !And
    - !Not [!Equals [!Ref AppDomainName, ""]]
    - !Not [!Equals [!Ref AppHostedZoneId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Handler: index.handler
    Architectures: [arm64]
    MemorySize: 512
    # Long enough for a cold start plus a transactional write; short enough that
    # a wedged invocation cannot quietly bill for a quarter of an hour.
    Timeout: 15
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        # Content ships inside the bundle; see infra/build.mjs.
        KAD_CONTENT_DIR: /var/task/content
        # The SecureString holding the token signing key. Set here rather than
        # per-function so that this path is written down exactly once — the two
        # IAM statements that grant access to it build the ARN from the same two
        # pieces, and a path that drifts between them fails at the first token
        # with an AccessDenied that names neither.
        TOKEN_KEY_PARAMETER: !Sub "/kad/${StageName}/token-signing-key"

Resources:
  # ---------------------------------------------------------------------------
  # Data — architecture §3
  # ---------------------------------------------------------------------------

  Table:
    Type: AWS::DynamoDB::Table
    # A family's characters are not recreatable. Keep the table if the stack is
    # ever torn down by accident.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "kad-${StageName}"
      BillingMode: PAY_PER_REQUEST
      # No `SSESpecification`, which is not the same as no encryption: DynamoDB
      # encrypts at rest unconditionally, and the default is an AWS-owned key at
      # no cost. Naming a key here is what would create one.
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Four jobs, one index (store/keys.ts): device id → household, run id →
        # household, and the GUEST and IDLE partitions the sweeper reads.
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        # Single rows nothing else points at only: rooms, code-miss windows
        # (handlers/code-guard.ts), invites, transfer and pairing codes, moved-
        # device forwards, presence. Everything else that expires spans rows and
        # partitions, and does so through the GUEST and IDLE indexes and the
        # sweeper — see the long note in store/keys.ts.
        AttributeName: ttl
        Enabled: true
      # `DeletionPolicy: Retain` above guards `sam delete` pointed at the wrong
      # stack. It does nothing for a DeleteTable call, or for a sweeper bug that
      # deletes households it should have kept — and the sweeper holds CRUD on
      # this table. On prod, deletion protection refuses the first.
      #
      # No point-in-time recovery, by the owner's decision: #440 turned it on
      # and this turns it off again. It also could not be turned on. Enabling
      # it makes CloudFormation call `dynamodb:UpdateContinuousBackups`, and
      # the GithubDeploy role is not allowed that action, so from #440 merging
      # until this line went every production deploy failed on the table and
      # rolled the whole stack back — three releases' worth, with nothing but
      # a red workflow to say so. Staging never saw it: `IsProd` made the value
      # false there, and false asks for no call at all.
      #
      # If PITR is ever wanted back, the role's policy is the thing to change
      # first, and the question to settle is what the restore is for. It hands
      # back the whole table at a moment in time, into a *new* table, so one
      # family's rows can be copied out of it — a drill somebody has to be
      # willing to run on a Saturday evening for it to be worth its permission.
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # ---------------------------------------------------------------------------
  # Token signing — architecture §4.5
  # ---------------------------------------------------------------------------

  # There is no resource here, and that is the point of this block.
  #
  # This stack creates no KMS key of its own. Every encrypted thing in it uses an
  # Amazon-managed key: the table gets the AWS-owned DynamoDB default, the bucket
  # gets SSE-S3, and the token signing key gets `aws/ssm`.
  #
  # That constrains the token format, and it is worth being explicit about why.
  # Signing needs an *asymmetric* key, and every `aws/*` managed key is symmetric
  # and encryption-only — KMS will not sign with one. So tokens are HS256 over a
  # shared key rather than ES256 over a private key that never leaves KMS. The
  # trust boundary is unchanged (both signer and verifier are Lambdas in this
  # stack); what is given up is the ability for some future outside verifier to
  # check a token without also being able to mint one. See token-identity.ts.
  #
  # The key lives in a Parameter Store **SecureString** at the name below, which
  # CloudFormation cannot declare: `AWS::SSM::Parameter` takes `String` and
  # `StringList`, and has never supported `SecureString`. So the API function
  # mints 32 random bytes into it on first use, with `Overwrite: false` so that
  # racing cold starts converge on one key. What stays in the template is the
  # name and the permissions — the part worth reviewing.
  #
  # Consequence to know: the parameter outlives the stack. That is deliberate
  # (delete and recreate staging, and every paired phone still works) and it is
  # on the teardown list in docs/deploy.md.

  # ---------------------------------------------------------------------------
  # Optional sign-in — architecture §4.5
  #
  # Nobody has to have an account. This exists so that a family who wants to keep
  # their characters can claim the household they are already playing in.
  # ---------------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "kad-${StageName}"
      # Grown-ups' sign-ins are not recreatable either; see the table above.
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      # Passwordless first-factor sign-in (email OTP, passkeys) needs the
      # Essentials tier. Its free tier is far above a household.
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      Policies:
        SignInPolicy:
          # PASSWORD is here because Cognito refuses to create the pool without
          # it — "PASSWORD should be configured as one of the allowed first auth
          # factors" — and not because anything uses it.
          #
          # Nothing in this game ever asks for a password. Sign-in is an emailed
          # code, then optionally a passkey; the client signs a user up with a
          # random secret it discards immediately (`sync/auth.ts`), and no screen
          # has a password field. This entry satisfies Cognito's validator and
          # changes nothing a family sees.
          AllowedFirstAuthFactors: !If
            - Passkeys
            - [PASSWORD, EMAIL_OTP, WEB_AUTHN]
            - [PASSWORD, EMAIL_OTP]
      WebAuthnRelyingPartyID: !If
        - Passkeys
        - !Ref WebAuthnRelyingPartyId
        - !Ref AWS::NoValue
      WebAuthnUserVerification: !If [Passkeys, preferred, !Ref AWS::NoValue]
      # Sign-up is a step the player never sees: the client calls SignUp and then
      # immediately starts the email-code challenge. Without this trigger the new
      # user sits UNCONFIRMED behind a *second* emailed code, and sign-in fails
      # for everyone who has never played before.
      #
      # Auto-confirming is not a shortcut past verifying the address. The email
      # code *is* the verification — nobody reaches a signed-in state without
      # reading a message sent to that inbox. All this removes is a redundant
      # confirmation round trip in front of it.
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailConfiguration:
        # Cognito's own sender caps at 50 emails a day, which is roughly 49 more
        # than this will ever need. Swap to SES if that stops being true.
        EmailSendingAccount: COGNITO_DEFAULT
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Auto-confirms sign-ups so the emailed code is the only step
      # Inline, and CommonJS: it is ten lines that will never change, and giving
      # it a bundle would put a build step between the user pool and a function
      # whose whole body is two assignments.
      InlineCode: |
        exports.handler = async (event) => {
          event.response.autoConfirmUser = true;
          if (event.request.userAttributes?.email) {
            event.response.autoVerifyEmail = true;
          }
          return event;
        };
      Handler: index.handler
      MemorySize: 128
      Timeout: 5

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "kad-web-${StageName}"
      # A browser cannot keep a secret.
      GenerateSecret: false
      ExplicitAuthFlows:
        # USER_AUTH is the choice-based flow that carries EMAIL_OTP and
        # WEB_AUTHN. Deliberately no SRP and no USER_PASSWORD: there are no
        # passwords in this pool, and leaving those enabled would invite one.
        - ALLOW_USER_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: [COGNITO]
      # No hosted UI, so no domain and no OAuth flows — the sign-in screen is
      # ours (§4.5) and talks to Cognito's API directly from the browser.
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------------------
  # Realtime — architecture §4.4
  # ---------------------------------------------------------------------------

  EventApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: !Sub "kad-rooms-${StageName}"
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
          - AuthType: AWS_LAMBDA
            LambdaAuthorizerConfig:
              AuthorizerUri: !GetAtt ChannelAuthorizerFunction.Arn
              # Short. The authorizer already caps this per token, but a room
              # lives six hours and a revoked device must not linger behind a
              # cached yes.
              AuthorizerResultTtlInSeconds: 300
        # Clients connect and subscribe with their room token; only the game
        # Lambda's execution role can publish. That split is the security model.
        ConnectionAuthModes:
          - AuthType: AWS_LAMBDA
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM
        DefaultSubscribeAuthModes:
          - AuthType: AWS_LAMBDA

  RoomNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventApi.ApiId
      # `room/<code>` — the room *is* the channel (§4.4).
      Name: room

  ChannelAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/channel-authorizer
      Description: Decides who may subscribe to room/<code>
      # Only needs to read device bindings and a run's removed list (#267), and
      # verify a signature. No publish, no writes — deliberately the smallest
      # policy in the stack.
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref Table
        # `GetParameter` and nothing else. This function verifies tokens; it
        # never mints one, and it must not be able to create the key either —
        # if the parameter is missing here, something is wrong (token-identity.ts).
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kad/${StageName}/token-signing-key"
            - Effect: Allow
              # Decrypting a SecureString written under the Amazon-managed
              # `aws/ssm` key. Scoped by `ViaService` rather than by key ARN
              # because an AWS-managed key's id is not knowable at template time
              # — this grant cannot be used against any other key, and cannot be
              # used except through Parameter Store.
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  ChannelAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ChannelAuthorizerFunction.Arn
      Principal: appsync.amazonaws.com
      # Scoped by account rather than by the API's ARN on purpose: naming the API
      # here would make this permission depend on EventApi, which depends on this
      # function, which CloudFormation reports as a circular reference.
      SourceAccount: !Ref AWS::AccountId

  # ---------------------------------------------------------------------------
  # API — architecture §4.2
  # ---------------------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # No CORS configuration at all, on purpose. CloudFront is the only front
      # door and serves the SPA and /api/* from one domain, so the browser never
      # makes a cross-origin request — and in dev, Vite proxies for the same
      # reason. A permissive CORS policy here would only widen who can call this.
      DefaultRouteSettings:
        # A phone reconnecting retries; a wedged client must not be able to spend
        # the account. Generous for three players, cheap insurance otherwise.
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/api
      Description: Rooms, actions, state, and the optional sign-in link
      # The engine, content parsing, and a JSON Patch diff per action. 1024MB is
      # also the point where Lambda's vCPU allocation stops being the thing
      # deciding how long a dice roll takes.
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          APPSYNC_HTTP_DOMAIN: !GetAtt EventApi.Dns.Http
          APPSYNC_REALTIME_DOMAIN: !GetAtt EventApi.Dns.Realtime
          # The value CloudFront stamps on every request it forwards, as
          # x-kad-origin (see the api origin below). It is what lets the API
          # believe the viewer address CloudFront writes into x-kad-viewer, and
          # disbelieve one sent straight to the execute-api address
          # (lambda/http.ts, clientOf). scripts/deploy.sh creates the parameter
          # before the first deploy that needs it.
          KAD_ORIGIN_SECRET: !Sub "{{resolve:ssm:/kad/${StageName}/origin-secret}}"
          # "It's your turn" pushes (#466): off unless the stack says on. The
          # key pair is minted into PUSH_KEY_PARAMETER on first use, like the
          # signing key, so turning this on needs no secret typed in by hand.
          KAD_PUSH: !Ref PushNotifications
          KAD_PUSH_SUBJECT: !Ref PushContact
          PUSH_KEY_PARAMETER: !Sub "/kad/${StageName}/push-vapid-keys"
          # Family-session timing (#511): on unless the stack says off.
          KAD_TIMING: !Ref SessionTiming
          # Where each step's push job goes, by an asynchronous invoke: the API
          # never sends a push itself (lambda/push-dispatch.ts).
          PUSH_SENDER_FUNCTION: !Ref PushSenderFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              # The one principal that may create the signing key, on the one
              # parameter it is allowed to create. `PutParameter` looks like a
              # write worth worrying about until you notice this function is
              # also the only thing that ever *signs* with the key — it cannot
              # reach anything it did not already hold.
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kad/${StageName}/token-signing-key"
            - Effect: Allow
              # The push key pair (#466), read and minted the same way. Only
              # ever touched while PushNotifications is on.
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kad/${StageName}/push-vapid-keys"
            - Effect: Allow
              # Handing a turn's push job to the sender (#466). Its own
              # function, so this grant names another resource rather than
              # this function's own ARN, which would be a cycle.
              Action: lambda:InvokeFunction
              Resource: !GetAtt PushSenderFunction.Arn
            - Effect: Allow
              # See the note on the authorizer's copy of this.
              Action:
                - kms:Decrypt
                - kms:Encrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              # Publishing to a room. The server is authoritative for everything
              # that matters (§4.1), and this is the only principal that can say
              # anything on a channel.
              Action: appsync:EventPublish
              Resource: !Sub "${EventApi.ApiArn}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            # One catch-all: the function routes internally (lambda/http.ts), so
            # adding a route is a code change rather than a stack change. That
            # includes POST /api/client-error (#317): the client's crash reports
            # take this path, and CloudFront's /api/* behavior forwards POST.
            Path: /{proxy+}
            Method: ANY

  # ---------------------------------------------------------------------------
  # "It's your turn" pushes (#466) — off the request path
  # ---------------------------------------------------------------------------

  # The API decides who a step opened a question for and invokes this with
  # that job, InvocationType Event, so a tap never waits on presence reads,
  # phones or a push vendor. This reads the room, picks the quiet phones, sends
  # and forgets dead subscriptions (lambda/push-sender.ts). It swallows every
  # push failure and succeeds, so Lambda's default async retries (two) only
  # follow a crash. A turn older than a quarter of an hour is not worth sending.
  PushSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/push-sender
      Description: Sends "It's your turn" Web Pushes for the API, asynchronously
      MemorySize: 256
      # No reserved concurrency: a reservation is refused in an account at the
      # new-account limit, and only when pushes are turned on, which is the
      # wrong moment to learn it. Async invocations queue, and a family game
      # is a handful of pushes a minute.
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 900
        MaximumRetryAttempts: 2
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          KAD_PUSH: !Ref PushNotifications
          KAD_PUSH_SUBJECT: !Ref PushContact
          PUSH_KEY_PARAMETER: !Sub "/kad/${StageName}/push-vapid-keys"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              # Read only: the API mints the pair before any job can exist.
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kad/${StageName}/push-vapid-keys"
            - Effect: Allow
              # See the note on the authorizer's copy of this.
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # ---------------------------------------------------------------------------
  # Anonymous play expiry — the sweeper
  # ---------------------------------------------------------------------------

  SweepFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/sweep
      Description: Deletes anonymous households nobody signed in to keep, and kids past their household's retention window
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref GuestSweepSchedule
            Description: Sweep expired guest households
            # Named per stage, and it has to be. Left out, SAM names the
            # schedule after its own logical id — `SweepFunctionSchedule`, with
            # no stage in it — and puts it in EventBridge Scheduler's `default`
            # group, where names are unique per account and region. Staging and
            # prod both deploy to us-east-1 in one account, so the second of
            # them to reach this resource would fail on a name the first had
            # taken.
            Name: !Sub "kad-sweep-${StageName}"

  # ---------------------------------------------------------------------------
  # Hosting — architecture §1, §7
  # ---------------------------------------------------------------------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "kad-site-${StageName}-${AWS::AccountId}"
      # Reachable only through CloudFront, via the OAC below.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # The deploy syncs with --delete, so without versioning the previous
      # client bundle is *gone* the moment a bad one lands — the rollback
      # story was "roll forward and wait". Noncurrent versions are kept for
      # 30 days: long enough to restore last week's site, short enough that
      # a bucket of build outputs never becomes a bill.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-previous-deploys
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              # SSE-S3: keys Amazon manages, free, and with no per-object KMS
              # call. The objects here are a public SPA and its art — `aws:kms`
              # would add a request charge per file for no secrecy that the
              # CloudFront distribution in front of them does not already give
              # away.
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "kad-site-${StageName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The SPA owns its routes (`/tv/<code>`, `/p/<code>`), so a deep link has to
  # reach index.html. Doing that with CloudFront's custom error responses would
  # rewrite the *API's* 404s too — they are a distribution-wide setting — which
  # is how "no open room ABCD" silently becomes a blank page. A viewer-request
  # function on the SPA behavior alone keeps the API's errors intact.
  SpaRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "kad-spa-router-${StageName}"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for client-side routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var uri = event.request.uri;
          // Anything with an extension is a real file: the bundle, an art asset,
          // a chapter. Everything else is a route the SPA resolves itself.
          if (uri.indexOf(".") === -1) {
            event.request.uri = "/index.html";
          }
          return event.request;
        }

  # Who is asking, for the wrong-code budget (handlers/code-guard.ts). Behind
  # CloudFront the API sees an edge's address, shared by everyone near it, so
  # this writes the viewer's own into x-kad-viewer. Assigned, not appended: a
  # viewer that sends its own x-kad-viewer has it overwritten here.
  ViewerAddressFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "kad-viewer-address-${StageName}"
      AutoPublish: true
      FunctionConfig:
        Comment: Pass the viewer's address to the API
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          event.request.headers["x-kad-viewer"] = { value: event.viewer.ip };
          return event.request;
        }

  # The custom domain (prod). CloudFormation writes the DNS validation record
  # itself and waits for the certificate before the distribution uses it.
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CustomDomain
    Properties:
      DomainName: !Ref AppDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref AppDomainName
          HostedZoneId: !Ref AppHostedZoneId

  # A and AAAA: the distribution serves IPv6. Z2FDTNDATAQYW2 is CloudFront's
  # fixed hosted zone id for alias targets.
  SiteDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomain
    Properties:
      HostedZoneId: !Ref AppHostedZoneId
      Name: !Ref AppDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  SiteDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomain
    Properties:
      HostedZoneId: !Ref AppHostedZoneId
      Name: !Ref AppDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Kids & Dragons (${StageName})"
        HttpVersion: http2and3
        Aliases: !If [CustomDomain, [!Ref AppDomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - CustomDomain
          - AcmCertificateArn: !Ref SiteCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            # Empty rather than absent: OAC replaces the legacy origin access
            # identity, but CloudFront still wants the S3 origin block itself.
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            # Proves a request came through CloudFront (see KAD_ORIGIN_SECRET on
            # the API function). CloudFront overwrites a viewer's own header of
            # the same name, so the value never comes from outside. A plain
            # `ssm` reference rather than `ssm-secure`: CloudFront does not take
            # SecureString references, and the value is a bearer of nothing
            # beyond "believe this request's x-kad-viewer".
            OriginCustomHeaders:
              - HeaderName: x-kad-origin
                HeaderValue: !Sub "{{resolve:ssm:/kad/${StageName}/origin-secret}}"
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouterFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # Managed-CachingDisabled. Every one of these is a mutation or a
            # read of state that changes on every tap.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed-AllViewerExceptHostHeader — forwards Authorization and
            # x-kad-device-token while letting the origin see its own host,
            # which API Gateway requires. Also x-kad-viewer, which the function
            # below sets: a header a viewer-request function writes is a viewer
            # header as far as the policy is concerned.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerAddressFunction.FunctionARN
          - PathPattern: /content/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: /assets/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  # ---------------------------------------------------------------------------
  # Logs
  #
  # No `AWS::Logs::LogGroup` resources and no `RetentionInDays`, deliberately.
  # Lambda creates `/aws/lambda/<function>` on the first invocation, and
  # retention is managed account-wide by a utility outside this repo — declaring
  # it here would mean a redeploy quietly resetting whatever that utility had
  # decided.
  #
  # `LoggingConfig` in Globals stays: format and levels are a property of the
  # application, not of how long anyone keeps the output.
  # ---------------------------------------------------------------------------

Outputs:
  SiteUrl:
    Description: >-
      Open this on the TV and on every phone. The custom domain when one is
      configured, the CloudFront domain otherwise.
    Value: !If
      - CustomDomain
      - !Sub "https://${AppDomainName}"
      - !Sub "https://${Distribution.DomainName}"

  SiteBucketName:
    Description: Sync the client bundle, assets, and content here
    Value: !Ref SiteBucket

  DistributionId:
    Description: For cache invalidation after a deploy
    Value: !Ref Distribution

  ApiEndpoint:
    Description: The HTTP API's own domain; CloudFront is the one clients use
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  TableName:
    Value: !Ref Table

  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient

  EventApiHttpDomain:
    Value: !GetAtt EventApi.Dns.Http

  EventApiRealtimeDomain:
    Value: !GetAtt EventApi.Dns.Realtime
