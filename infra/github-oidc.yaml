AWSTemplateFormatVersion: "2010-09-09"

# The bootstrap stack: how GitHub Actions is allowed to deploy.
#
# **Optional.** If the account already has a role that other repositories deploy
# with — the way `allenheltondev/content-tracking` does, where the role lives in
# the account and the repo only knows its ARN — the smaller change is to add
# this repository's two `sub` claims to that role instead:
#
#   repo:<owner>/kids-and-dragons:environment:Staging
#   repo:<owner>/kids-and-dragons:environment:Production
#
# Use this template when you would rather have roles dedicated to this project.
# Deployed **once, by hand**, before any automated deploy can work — it is the
# thing that grants the permission, so it cannot be granted by the thing it
# grants. Its outputs are the `AWS_DEPLOYMENT_ROLE_ARN` secrets you set on the
# `Staging` and `Production` GitHub environments.
#
#   aws cloudformation deploy \
#     --template-file infra/github-oidc.yaml \
#     --stack-name kad-github-oidc \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubOwner=allenheltondev GitHubRepo=kids-and-dragons
#
# The two roles are **not interchangeable**: each trusts exactly one GitHub
# environment. `StagingRoleArn` goes in the Staging environment's
# AWS_DEPLOYMENT_ROLE_ARN and `ProdRoleArn` in Production's. Putting one ARN in
# both leaves whichever environment does not match failing with
# "Not authorized to perform sts:AssumeRoleWithWebIdentity" — which is the trust
# boundary working, not a misconfiguration of it.
#
# No access keys anywhere. GitHub presents a short-lived OIDC token, AWS trades
# it for temporary credentials, and there is no long-lived secret in the
# repository that could leak.

Description: GitHub Actions OIDC provider and per-environment deploy roles for Kids & Dragons

Parameters:
  GitHubOwner:
    Type: String
    Description: The GitHub user or org that owns the repository.

  GitHubRepo:
    Type: String
    Default: kids-and-dragons

  # The GitHub environment names, exactly as they appear in
  # Settings → Environments. Parameters rather than literals because the OIDC
  # `sub` claim carries the name **as configured**, matched here with
  # StringEquals — so `Staging` and `staging` are different principals, and a
  # rename in the GitHub UI silently stops every deploy until this stack is
  # updated to match.
  StagingEnvironmentName:
    Type: String
    Default: Staging

  ProdEnvironmentName:
    Type: String
    Default: Production

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      An AWS account may hold only one provider per URL. Set false if
      token.actions.githubusercontent.com already exists in this account —
      creating a second one fails the whole stack.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS has verified this provider's certificate chain since 2023 and no
      # longer pins a thumbprint, but the field is still required.
      ThumbprintList:
        - ffffffffffffffffffffffffffffffffffffffff

  StagingDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kad-deploy-staging
      Description: Deploys the Kids & Dragons staging stack from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Scoped to the GitHub *environment*, not just the repository.
                # Without this a workflow job targeting Staging could assume the
                # production role, and the two environments would be one.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:${StagingEnvironmentName}"

  ProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kad-deploy-prod
      Description: Deploys the Kids & Dragons prod stack from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:${ProdEnvironmentName}"

  # What a deploy may actually touch — replacing the PowerUserAccess +
  # IAMFullAccess pair both roles used to carry. One policy, attached to both
  # roles, because the two stacks are the same template under different names:
  # every resource is prefixed `kad-` / `kad-site-` (infra/template.yaml), and
  # CloudFormation prefixes every name it generates — function names, role
  # names — with the stack name, which is `kad-staging` or `kad-prod`. So the
  # boundary this draws is *"cannot touch a non-kad resource"*: generous with
  # actions inside each service+name scope (enumerating exotic actions buys
  # nothing but AccessDenied roulette), strict about which resources those
  # actions can reach. This matters most for the staging role, which is
  # assumable from a workflow that runs repository-controlled code on every
  # collaborator PR.
  #
  # Validated by use: the first real deploy after tightening this is the test.
  # If it fails, the workflow's "Diagnose failed deploy" step prints the stack
  # events — an over-tight policy shows up there as CREATE_FAILED/UPDATE_FAILED
  # with "API: <service>:<Action> ... is not authorized to perform" in
  # ResourceStatusReason, naming the exact action and ARN to add below. An
  # AccessDenied *before* any stack event (during `sam deploy`'s changeset or
  # upload phase) means the cloudformation or S3 statements instead.
  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: kad-deploy
      Description: Everything a Kids & Dragons stack deploy touches, and nothing off the kad-* prefix
      Roles:
        - !Ref StagingDeployRole
        - !Ref ProdDeployRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The stacks themselves, plus SAM's own bookkeeping stack:
          # `resolve_s3 = true` (infra/samconfig.toml) has SAM manage its
          # artifact bucket through a stack named aws-sam-cli-managed-default,
          # which a deploy reads on every run and creates on the first.
          - Sid: CloudFormationKadStacks
            Effect: Allow
            Action: cloudformation:*
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/kad-*/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default*/*"

          # Deploying a template with `Transform: AWS::Serverless-2016-10-31`
          # requires CreateChangeSet on the transform's own pseudo-ARN.
          - Sid: CloudFormationSamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"

          # Read-only calls sam makes against a template *body* — there is no
          # resource ARN to name for these.
          - Sid: CloudFormationTemplateReads
            Effect: Allow
            Action:
              - cloudformation:GetTemplateSummary
              - cloudformation:ValidateTemplate
            Resource: "*"

          # The site buckets (create/update via CloudFormation, then the three
          # `aws s3 sync --delete` calls in deploy.sh) and SAM's artifact
          # bucket, where every deploy uploads the Lambda bundles.
          - Sid: S3KadBuckets
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::kad-site-*"
              - !Sub "arn:${AWS::Partition}:s3:::kad-site-*/*"
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*"
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*/*"

          # The execution roles SAM generates for the four functions and the
          # sweep schedule — all named <stack>-<LogicalId>-<random>, so the
          # kad- prefix holds. PassRole is what hands a role to Lambda and to
          # EventBridge Scheduler at create time.
          - Sid: IamKadRoles
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:ListRoleTags
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:UpdateRole
              - iam:UpdateRoleDescription
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/kad-*"

          # role/kad-* unavoidably matches the two deploy roles in this very
          # template. Without this deny, the staging role — assumable from
          # repository-controlled code on any collaborator PR — could
          # PutRolePolicy on *itself* and mint whatever the statement above
          # withheld. These roles are only ever managed by the by-hand deploy
          # of this bootstrap stack, never by the pipeline.
          - Sid: DenyTouchingTheDeployRolesThemselves
            Effect: Deny
            Action: iam:*
            Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/kad-deploy-*"

          - Sid: LambdaKadFunctions
            Effect: Allow
            Action: lambda:*
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:kad-*"

          # table/kad-* also matches the GSI ARNs (table/kad-*/index/*) — IAM
          # wildcards cross "/".
          - Sid: DynamoKadTables
            Effect: Allow
            Action: dynamodb:*
            Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/kad-*"

          # The token-signing SecureString lives at /kad/<stage>/…. Nothing in
          # the deploy path writes it today (the API function mints it at
          # runtime), but the teardown documented in docs/deploy.md deletes it,
          # and scoping it here costs nothing.
          - Sid: SsmKadParameters
            Effect: Allow
            Action: ssm:*
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kad/*"

          # The sweep schedule is EventBridge Scheduler (ScheduleV2 in the
          # template), named kad-sweep-<stage> in the default group — not a
          # classic events:* rule, so no events statement is needed.
          - Sid: SchedulerKadSchedules
            Effect: Allow
            Action: scheduler:*
            Resource: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/kad-*"

          # The stack declares no log groups (retention is managed outside this
          # repo), but Lambda's groups are /aws/lambda/kad-* and diagnosing a
          # deploy sometimes needs to read them from the workflow.
          - Sid: LogsKadGroups
            Effect: Allow
            Action: logs:*
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/kad-*"

          # Resource "*" from here down, and each for the same reason: these
          # services put a *generated id*, not the resource's name, in the ARN,
          # so a name-prefix scope has nothing to match against.
          #
          # CloudFront distribution ARNs are distribution/E2ABCDEF… — the
          # kad naming lives only in the Comment. Covers the distribution CRUD
          # CloudFormation performs, the OAC, the kad-spa-router function, and
          # the CreateInvalidation deploy.sh issues after every sync.
          - Sid: CloudFrontUnscopable
            Effect: Allow
            Action: cloudfront:*
            Resource: "*"

          # Cognito user pool ARNs end in a generated pool id
          # (us-east-1_AbCdEf123), and CreateUserPool is authorized against no
          # resource at all. deploy.sh also calls describe-user-pool for the
          # passkey hint.
          - Sid: CognitoUnscopable
            Effect: Allow
            Action: cognito-idp:*
            Resource: "*"

          # AppSync Events API ARNs are apis/<generated id>.
          - Sid: AppSyncUnscopable
            Effect: Allow
            Action: appsync:*
            Resource: "*"

          # API Gateway (the HttpApi) — ARNs carry no account and no name,
          # only generated api ids; the region is the tightest honest scope.
          - Sid: ApiGatewayRegionScoped
            Effect: Allow
            Action: apigateway:*
            Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::*"

Outputs:
  StagingRoleArn:
    Description: Set as AWS_DEPLOYMENT_ROLE_ARN on the Staging environment (not Production)
    Value: !GetAtt StagingDeployRole.Arn

  ProdRoleArn:
    Description: Set as AWS_DEPLOYMENT_ROLE_ARN on the Production environment (not Staging)
    Value: !GetAtt ProdDeployRole.Arn
